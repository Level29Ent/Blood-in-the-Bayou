<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night diner review</title><style>body{margin:0;background:#707b7c;font:13px sans-serif;color:white}canvas{display:block}aside{position:fixed;z-index:2;top:10px;left:10px;padding:12px;background:#20343dea;max-width:340px}button{min-height:44px;padding:10px;margin:3px;background:#33536a;color:white;border:1px solid #ce9b64}</style></head><body><aside><b>CREOLE NIGHT DINER</b><p>Production interior at actual footprint. Isolated review—not full-city meal purchases or music playback.</p><button id="entry">DINER AISLE</button><button id="racks">RED BOOTHS</button><button id="packing">LUNCH COUNTER</button><button id="forklift">JUKEBOX</button><p id="status"></p></aside><script src="three.min.js"></script><script src="night-diner.js?v=night-diner-reference-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,1200),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#aab5b4');scene.add(new T.HemisphereLight('#fff4de','#596c70',1.1));const light=new T.DirectionalLight('#fff6e8',.8);light.position.set(50,100,200);scene.add(light);document.body.appendChild(renderer.domElement);const b={x:0,y:0,w:192,h:160},store=level29NightDiner.build(T,b);scene.add(store.root);const shell=new T.Group(),m=new T.MeshStandardMaterial({color:'#bbc4bf'});for(const [w,h,d,x,y,z]of [[192,52,1,96,26,.5],[1,52,160,.5,26,80],[1,52,160,191.5,26,80],[192,1,160,96,52,80]]){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);shell.add(o);}scene.add(shell);const views={entry:[[96,23,153],[96,23,30]],racks:[[92,25,120],[26,15,69]],packing:[[88,24,129],[164,16,67]],forklift:[[70,22,145],[18,16,130]]};function view(n){const[a,b]=views[n];camera.position.set(...a);camera.lookAt(...b);renderer.render(scene,camera);document.getElementById('status').textContent='3 red booth bays · 5 counter stools · jukebox · checkerboard floor';}for(const n of Object.keys(views))document.getElementById(n).onclick=()=>view(n);view('entry');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);view('entry');});
</script></body></html>
