const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,500),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#c9c9bc');scene.add(new T.HemisphereLight('#fff1db','#768279',1.2));const sun=new T.DirectionalLight('#fff4dc',.65);sun.position.set(60,110,90);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29CosmeticsStore.build(T,{x:0,y:0,w:102,h:70});scene.add(d.root);let current='store';function show(view){current=view;const v={store:[[51,18,68],[51,22,13]],wall:[[51,23,29],[51,20,5]],beauty:[[50,20,56],[32,20,39]],makeup:[[82,22,61],[96,22,25]]}[view];camera.position.set(...v[0]);camera.lookAt(...v[1]);renderer.render(scene,camera);const s=d.root.userData.cosmetics;document.getElementById('status').textContent=s.products+' products · two illuminated vanity mirrors · 10 lipstick testers · clear service aisle';}for(const id of ['store','wall','beauty','makeup'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
