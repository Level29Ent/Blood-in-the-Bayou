<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superdome exterior review</title><style>body{margin:0;background:#a8beca;color:#f5eddc;font:14px system-ui}canvas{display:block}aside{position:fixed;top:12px;left:12px;max-width:330px;padding:14px;background:#242b30ed;border:1px solid #ad9467}p{margin:8px 0}button{min-height:44px;padding:10px;margin:3px;border:1px solid #c7b286;background:#4c473b;color:#fff2d5}</style></head><body>
<aside><strong>SUPERDOME · EXTERIOR REVIEW</strong><p>Shared production model at the existing 256 × 256 parcel. Isolated architecture—not full-city gameplay or a phone performance test.</p><button id="aerial">Elevated view</button><button id="street">Street view</button><button id="night">Night lighting</button><p id="status" role="status">Loading…</p></aside>
<script src="three.min.js"></script><script src="superdome-reference.js?v=bronze-dome-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,2000),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
const hemi=new T.HemisphereLight('#fff3df','#7c8178',1.15),sun=new T.DirectionalLight('#fff0d1',1.7);sun.position.set(-180,220,160);scene.add(hemi,sun);
const root=level29SuperdomeReference.build(T,{x:0,y:0,w:256,h:256});scene.add(root);
const plaza=new T.Mesh(new T.CylinderGeometry(150,150,1,128),new T.MeshStandardMaterial({color:'#aba99e',roughness:1}));plaza.position.set(128,-.55,128);scene.add(plaza);
const ground=new T.Mesh(new T.PlaneGeometry(2000,2000).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:'#717a74',roughness:1}));ground.position.set(128,-1.1,128);scene.add(ground);
let night=false,current='aerial';
function draw(){scene.background=new T.Color(night?'#0a142c':'#adc9d9');hemi.intensity=night?.19:1.15;sun.intensity=night?.13:1.7;level29SuperdomeReference.setNight(root,night);const pos=current==='street'?[128,45,455]:[350,177,440];camera.position.set(...pos);camera.lookAt(128,37,128);renderer.render(scene,camera);document.getElementById('status').textContent=(night?'Night · purple / green / gold emissive facade':'Day · bronze panels and ivory roof')+' · '+renderer.info.render.calls+' draws';document.getElementById('night').textContent=night?'Day lighting':'Night lighting';}
for(const mode of ['aerial','street'])document.getElementById(mode).onclick=()=>{current=mode;draw();};document.getElementById('night').onclick=()=>{night=!night;draw();};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);draw();});draw();
</script></body></html>
