<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>District detail model review</title><style>body{margin:0;background:#203b49;color:#f4dfac;font:13px/1.5 monospace}canvas{display:block}#panel{position:fixed;z-index:2;top:10px;left:10px;right:10px;max-width:580px;background:#0b2029eb;padding:12px;max-height:32dvh;overflow:auto;border:1px solid #a68d50}button,select{min-height:44px;background:#2a4650;color:#f4dfac;border:1px solid #b69c5c;margin:4px;padding:8px}h1{font-size:19px;margin:0}p{margin:6px 0}</style></head><body><section id="panel"><h1>DISTRICT DETAIL · ISOLATED COMPONENT REVIEW</h1><p>Shared models, not the full city or a device performance benchmark.</p><button id="parade">MARDI GRAS</button><button id="plant">NUCLEAR PLANT</button><button id="shops">STOCKED BUSINESSES</button><select id="kind" aria-label="Business type"><option value="food">Food / café</option><option value="tech">Technology</option><option value="workshop">Garage / tools</option><option value="care">Pharmacy</option><option value="fashion">Clothing</option><option value="equipment">Armory</option><option value="books">Books</option><option value="nature">Plants</option><option value="market">Market</option><option value="furniture">Furniture</option><option value="toys">Toys</option><option value="sports">Sports</option><option value="music">Music</option></select><p id="status"></p></section><script src="three.min.js"></script><script>window.level29EnergyReview=true;window.level29RichnessReview=true;</script><script src="cathedral-energy.js?v=1"></script><script src="business-richness.js?v=1"></script><script src="festival-spectacle.js?v=1"></script><script src="prologue-crowd.js?v=festival-detail-1"></script><script>
const T=THREE,renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;document.body.appendChild(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#9cbfc9');scene.add(new T.HemisphereLight('#fff0d3','#4b645b',1));const sun=new T.DirectionalLight('#ffe5bb',.8);sun.position.set(80,300,160);scene.add(sun);const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,1,4000),floor=new T.Mesh(new T.PlaneGeometry(5000,5000),new T.MeshLambertMaterial({color:'#647760'}));floor.rotation.x=-Math.PI/2;floor.position.y=-.3;scene.add(floor);let root,mode='parade',crowd,people=[],floats=[];const cache={};
function bounds(g){const b=new T.Box3(),m=new T.Matrix4(),w=new T.Matrix4();g.updateMatrixWorld(true);g.traverse(o=>{if(!o.isMesh)return;o.geometry.computeBoundingBox();if(o.isInstancedMesh){for(let i=0;i<o.count;i++){o.getMatrixAt(i,m);w.multiplyMatrices(o.matrixWorld,m);b.union(o.geometry.boundingBox.clone().applyMatrix4(w));}}else b.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));});return b;}
function show(next){mode=next;if(root)scene.remove(root);root=new T.Group();scene.add(root);crowd=null;floats=[];people=[];if(next==='plant'){root.add(level29CathedralEnergy.buildPlant(T,{x:0,y:0,w:320,h:320}));document.getElementById('status').textContent='Cooling towers · turbine hall · reactor dome · transformers · fenced gate. Model only.';}else if(next==='shops'){const k=document.getElementById('kind').value;for(let i=0;i<3;i++){const p=level29BusinessRichness.fixture(T,k);p.position.x=i*34;root.add(p);}const wall=new T.Mesh(new T.BoxGeometry(112,44,1),new T.MeshLambertMaterial({color:'#c5bba6'}));wall.position.set(34,21,-6);root.add(wall);document.getElementById('status').textContent='Three densely stocked '+k+' fixtures · category-specific shapes and materials.';}else{const road=new T.Mesh(new T.BoxGeometry(1400,.4,100),new T.MeshLambertMaterial({color:'#545b61'}));road.position.set(360,-.1,0);root.add(road);for(const side of [-1,1]){const pavement=new T.Mesh(new T.BoxGeometry(1400,1,42),new T.MeshLambertMaterial({color:'#b4b4a3'}));pavement.position.set(360,.4,side*72);root.add(pavement);for(let i=0;i<12;i++){const h=28+(i%3)*16,m=new T.Mesh(new T.BoxGeometry(63,h,65),new T.MeshLambertMaterial({color:['#e0bd8e','#99bbae','#c59fae'][i%3]}));m.position.set(-100+i*80,h/2,side*128);root.add(m);for(let w=0;w<3;w++){const window=new T.Mesh(new T.BoxGeometry(9,12,.8),new T.MeshLambertMaterial({color:'#466b7b'}));window.position.set(-118+i*80+w*18,17,side*95);root.add(window);}}}for(let i=0;i<5;i++){const f=level29FestivalSpectacle.floatModel(T,i);f.position.set(i*165,0,0);root.add(f);floats.push(f);}crowd=level29PrologueCrowd.create(T,132);root.add(crowd);people=Array.from({length:132},(_,i)=>({id:i,x:-40+(i%66)*13,y:i<66?-60:60,a:i<66?Math.PI/2:-Math.PI/2,cheer:true,wait:999,anim:i}));document.getElementById('status').textContent='Five sculpted themed floats with riders and tractors · dense cheering sidewalk crowd · original stylized Mardi Gras interpretation.';}
 const b=bounds(root),center=b.getCenter(new T.Vector3()),s=b.getSize(new T.Vector3()),d=Math.max(s.x,s.y,s.z)/Math.min(1,camera.aspect);if(next==='parade'){camera.position.set(-180,112,168);camera.lookAt(280,18,0);}else{camera.position.copy(center).add(new T.Vector3(d*.7,d*.65,d*1.1));camera.lookAt(center);}}
for(const m of ['parade','plant','shops'])document.getElementById(m).onclick=()=>show(m);document.getElementById('kind').onchange=()=>show('shops');function loop(t){if(crowd){for(const a of people)a.anim=t*.003+a.id;level29PrologueCrowd.pose(T,crowd,people,()=>0);}for(const [i,f]of floats.entries())f.position.x=i*165+Math.sin(t*.0003)*12;renderer.render(scene,camera);requestAnimationFrame(loop);}show('parade');requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
