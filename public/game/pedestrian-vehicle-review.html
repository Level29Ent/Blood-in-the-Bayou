<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedestrian vehicle avoidance regression</title><style>body{margin:0;background:#9db7be;font:14px system-ui}canvas{display:block}section{position:fixed;top:12px;left:12px;background:#203b3ded;color:white;padding:12px;max-width:390px}button{padding:10px;min-height:44px}p{margin:7px 0}</style><section><strong>PEDESTRIAN / VEHICLE REGRESSION</strong><p>Production avoidance algorithm; isolated car/body proxies, not full-city appearance.</p><button id="reset">RESTART WALK</button><button id="rotate">ROTATE CAR</button><p id="status"></p></section><script src="three.min.js"></script><script src="pedestrian-vehicles.js"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,500),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#b5cfd4');scene.add(new T.HemisphereLight('#fff2df','#647a67',1.3));const light=new T.DirectionalLight('#fff4de',.7);light.position.set(30,90,80);scene.add(light);renderer.outputEncoding=T.sRGBEncoding;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);camera.position.set(105,105,130);camera.lookAt(0,0,0);const ground=new T.Mesh(new T.BoxGeometry(180,1,110),new T.MeshStandardMaterial({color:'#687974'}));ground.position.y=-1;scene.add(ground);const car={x:0,y:0,a:0,spec:{len:40,wid:20}},body=new T.Group();scene.add(body);const chassis=new T.Mesh(new T.BoxGeometry(40,9,20),new T.MeshStandardMaterial({color:'#d1b44a'}));chassis.position.y=6;body.add(chassis);const cab=new T.Mesh(new T.BoxGeometry(19,8,18),new T.MeshStandardMaterial({color:'#34505c'}));cab.position.set(-2,13,0);body.add(cab);const person=new T.Group();scene.add(person);const torso=new T.Mesh(new T.BoxGeometry(6,12,5),new T.MeshStandardMaterial({color:'#96469e'}));torso.position.y=10;person.add(torso);const head=new T.Mesh(new T.SphereGeometry(3,12,8),new T.MeshStandardMaterial({color:'#976e4c'}));head.position.y=19;person.add(head);let a,goal,last=performance.now(),collisions=0;function reset(){a={x:-65,y:0,anim:0};goal={x:65,y:0};collisions=0;}document.getElementById('reset').onclick=reset;document.getElementById('rotate').onclick=()=>{car.a+=Math.PI/4;body.rotation.y=-car.a;reset();};reset();function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000);last=t;level29PedestrianVehicles.step(a,goal,dt*22,[car],()=>false);if(level29PedestrianVehicles.blocked([car],a.x,a.y))collisions++;person.position.set(a.x,0,a.y);person.rotation.y=-a.a;document.getElementById('status').textContent=(Math.hypot(goal.x-a.x,goal.y-a.y)<1?'ARRIVED':'Walking around vehicle')+' · overlap frames: '+collisions;renderer.render(scene,camera);}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});</script></html>
