<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creole environments review</title><style>body{margin:0;background:#16313d;color:#e4d1a0;font:13px monospace}aside{position:fixed;z-index:2;top:12px;left:12px;padding:16px;background:#10232de8;max-width:340px}select,button{padding:12px;background:#304d55;color:#f4d49b}</style></head><body><aside>CREOLE ENVIRONMENTS<p>Shared builders. Isolated graphics review—not a full-city placement or performance test.</p><select id="kind" aria-label="Environment"><option value="deepbayou">Deep bayou / boardwalks</option><option value="parkdock">City Park dock</option><option value="waterfront">River loading</option><option value="vault">Bank sublevel</option></select><button id="open">VAULT LOCKS</button><p id="stats"></p></aside><script src="three.min.js"></script><script>window.level29CreoleReview=true;window.level29VaultReview=true;</script><script src="creole-environments.js"></script><script src="subterranean-vault.js"></script><script>
const T=THREE,scene=new T.Scene(),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);scene.background=new T.Color('#48616a');scene.add(new T.HemisphereLight('#c0d5db','#465249',1));const sun=new T.DirectionalLight('#f9d6a8',1.2);sun.position.set(120,280,100);scene.add(sun);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,2500);let model,open=false,source;function show(){if(model){scene.remove(model);const gs=new Set(),ms=new Set();model.traverse(o=>{if(o.geometry)gs.add(o.geometry);if(o.material)ms.add(o.material);});gs.forEach(g=>g.dispose());ms.forEach(m=>m.dispose());}source=document.getElementById('kind').value;open=false;if(source==='vault'){model=level29VaultReview.buildVault(T);camera.position.set(120,29,167);camera.lookAt(120,20,50);}else{model=level29CreoleReview.buildRegion(T,{x:0,y:0,w:288,h:320},source);camera.position.set(360,280,510);camera.lookAt(140,5,165);}scene.add(model);document.getElementById('stats').textContent=model.children.length+' mesh batches / objects';}document.getElementById('kind').onchange=show;document.getElementById('open').onclick=()=>open=!open;show();function draw(t){requestAnimationFrame(draw);for(const w of model.userData.waters||[])w.mesh.material.uniforms.time.value=t/1000;for(const d of model.userData.doors||[]){d.mesh.rotation.y=open?1.1:0;d.wheel.rotation.z=open?t/200:0;}for(const m of model.userData.lasers||[])m.visible=!open;renderer.render(scene,camera);}requestAnimationFrame(draw);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
