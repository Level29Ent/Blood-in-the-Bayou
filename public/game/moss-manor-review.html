const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(62,innerWidth/innerHeight,.1,1500),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#bfd3cd');scene.add(new T.HemisphereLight('#fff4dc','#657760',1.15));const sun=new T.DirectionalLight('#fff0d3',.75);sun.position.set(-80,180,260);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29MossManor.build(T,{x:0,y:0,w:224,h:192});scene.add(d.root);const ground=new T.Mesh(new T.BoxGeometry(250,.2,215),new T.MeshStandardMaterial({color:'#536f46'}));ground.position.set(112,-.2,96);scene.add(ground);let current='front';function show(v){current=v;const c={front:[[285,130,370],[112,41,174]],bedroom:[[108,20,136],[43,18,47]],lounge:[[112,19,146],[190,17,65]],gallery:[[112,25,237],[112,62,181]]}[v];d.facade.visible=v==='front'||v==='gallery';d.roof.visible=d.facade.visible;camera.position.set(...c[0]);camera.lookAt(...c[1]);renderer.render(scene,camera);}for(const id of['front','bedroom','lounge','gallery'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});</script></html>
