<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookstore review</title><style>body{margin:0;background:#3d3137;color:#fff;font:13px sans-serif}canvas{display:block}aside{position:fixed;top:10px;left:10px;background:#202329eb;padding:12px;z-index:2;max-width:370px}button{min-height:44px;padding:10px;margin:3px;background:#743f44;color:white;border:1px solid #baaa89}p{margin:6px 0}</style></head><body><aside><strong>BOOK STORE · STORIES / HISTORY / CHILDREN</strong><p>Actual mall tenant dimensions, shared production model.<br>Isolated review—not full-city gameplay or physical-device performance.</p><button id="entry">ENTRANCE</button><button id="bins">BOOK AISLE</button><button id="wall">CHILDREN’S BOOKS</button><button id="flip">NORTH / SOUTH</button><p id="status"></p></aside><script src="three.min.js"></script><script src="graphics-pre.js"></script><script src="book-store.js?v=reference-books-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,700),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#9c9290');scene.add(new T.HemisphereLight('#fff3db','#6f6870',1.1));const light=new T.DirectionalLight('#fff2d5',.65);light.position.set(30,90,90);scene.add(light);document.body.appendChild(renderer.domElement);const b={x:0,y:0,w:79.2,h:70},room=new T.Group();scene.add(room);const m=new T.MeshStandardMaterial({color:'#dfd0b3'});for(const [w,h,d,x,y,z]of [[79.2,49,1,39.6,25,.5],[1,49,70,.5,25,35],[1,49,70,78.7,25,35],[79.2,1,70,39.6,49,35]]){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);room.add(o);}let dir=1,current='entry',store;const views={entry:[[39.6,23,66],[39.6,23,15]],bins:[[40,24,60],[12,17,33]],wall:[[39.6,26,42],[39.6,26,4]]};function view(n){current=n;const [a,b]=views[n].map(p=>dir===1?p:[79.2-p[0],p[1],70-p[2]]);camera.position.set(...a);camera.lookAt(...b);renderer.render(scene,camera);document.getElementById('status').textContent=store.root.userData.bookStore.books+' books · '+store.root.userData.bookStore.covers+' original illustrated covers';}function build(){if(store)scene.remove(store.root);store=level29BookStore.build(T,b,{dir});scene.add(store.root);view(current);}for(const n of ['entry','bins','wall'])document.getElementById(n).onclick=()=>view(n);document.getElementById('flip').onclick=()=>{dir*=-1;room.rotation.y=dir===1?0:Math.PI;room.position.set(dir===1?0:79.2,0,dir===1?0:70);build();};build();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);});
</script></body></html>
