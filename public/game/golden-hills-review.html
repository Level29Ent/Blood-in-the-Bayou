<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Hills lot review</title><style>body{margin:0;font:14px system-ui;background:#a6b2ac;color:#ffeac4}canvas{display:block}section{position:fixed;left:10px;top:10px;background:#293d36ed;padding:12px;max-width:340px}button{min-height:44px;margin:3px;padding:8px}p{margin:6px 0}</style><section><strong>GOLDEN HILLS / STUDIOS</strong><p>Production lot and sets. Review omits live arcade cabinets, services and NPCs. Set views hide roofs like interior reveal.</p><button id="lot">STUDIO LOT</button><button id="alley">STAGE ALLEY</button><button id="sitcom">LOUNGE SET</button><button id="talk">GH INTERVIEWS</button></section><script src="three.min.js"></script><script src="golden-hills.js?v=studio-lot-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,1500),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#acbfb5');scene.add(new T.HemisphereLight('#fff2da','#67716a',1.25));const sun=new T.DirectionalLight('#ffefd6',.8);sun.position.set(-70,170,260);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29GoldenHills.build(T,{x:0,y:0,w:256,h:224});scene.add(d.root);let current='lot';function show(id){current=id;d.roof.visible=id==='lot'||id==='alley';const p={lot:[[370,260,380],[128,10,112]],alley:[[128,26,215],[128,25,32]],sitcom:[[53,22,142],[43,14,29]],talk:[[208,22,144],[207,18,38]]}[id];camera.position.set(...p[0]);camera.lookAt(...p[1]);renderer.render(scene,camera);}for(const id of['lot','alley','sitcom','talk'])document.getElementById(id).onclick=()=>show(id);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});show(current);
