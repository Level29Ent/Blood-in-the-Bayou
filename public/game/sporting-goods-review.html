<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayou Sporting Goods review</title><style>body{margin:0;background:#b3bcb1;color:#fff3d6;font:14px system-ui}canvas{display:block}section{position:fixed;top:12px;left:12px;max-width:380px;padding:12px;background:#203d37ed}button{min-height:44px;padding:8px;margin:3px;background:#e4deca;color:#203d37;border:1px solid #a08c6c}p{margin:8px 0}</style></head><body><section><strong>BAYOU SPORTING GOODS · FIELD / OUTDOOR</strong><p>Production stock in the original mall tenant. Review cameras only; no surrounding mall, staff or shopping UI.</p><button id="store">STORE</button><button id="gloves">GLOVE WALL</button><button id="golf">GOLF BAGS</button><button id="balls">BALL RACKS</button><button id="rods">RODS / MANNEQUINS</button><p id="status"></p></section><script src="three.min.js"></script><script src="sporting-goods-interior.js?v=reference-sports-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,500),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#bec7b9');scene.add(new T.HemisphereLight('#fff4df','#627269',1.2));const sun=new T.DirectionalLight('#fff2d5',.65);sun.position.set(50,110,90);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29SportingGoods.build(T,{x:0,y:0,w:79.2,h:70});scene.add(d.root);let current='store';function show(view){current=view;const v={store:[[39.6,18,68],[39.6,22,12]],gloves:[[39.6,21,29],[39.6,20,5]],golf:[[17,23,61],[6,22,24]],balls:[[62,23,61],[73,22,24]],rods:[[39.6,21,65],[58,21,45]]}[view];camera.position.set(...v[0]);camera.lookAt(...v[1]);renderer.render(scene,camera);const s=d.root.userData.sports;document.getElementById('status').textContent=s.gloves+' gloves · '+s.golfBags+' golf bags · '+s.balls+' balls · '+s.rods+' fishing rods · 2 mannequins';}for(const id of ['store','gloves','golf','balls','rods'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
