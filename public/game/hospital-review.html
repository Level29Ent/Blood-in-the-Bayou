<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>General Hospital interior review</title><style>body{margin:0;background:#d4dedc;color:#fff;font:14px system-ui}canvas{display:block}section{position:fixed;top:12px;left:12px;max-width:410px;padding:12px;background:#173e51ed;border:1px solid #d6e8e5}button{min-height:44px;margin:3px;padding:8px;background:#e9eddd;color:#173e51;border:1px solid #a9c0c2}p{margin:8px 0}</style></head><body><section><strong>GENERAL HOSPITAL · INTERIOR REVIEW</strong><p>Actual production furnishings and partitions. Furniture-only review: no patients, nurses, city shell or gameplay simulation.</p><button id="lobby">RECEPTION</button><button id="imaging">IMAGING</button><button id="morgue">MORGUE</button><button id="ward">PATIENT WARD</button><button id="room">BEDSIDE</button><button id="recovery">RECOVERY</button><p id="status"></p></section><script src="three.min.js"></script><script src="hospital-interior.js?v=reference-hospital-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#c1cecd');scene.add(new T.HemisphereLight('#fff9e9','#758c99',1.3));const sun=new T.DirectionalLight('#fff7e5',.6);sun.position.set(70,170,190);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const b={x:0,y:0,w:288,h:256},decks=Array.from({length:5},(_,f)=>level29HospitalInterior.build(T,b,0,f));for(const d of decks)scene.add(d.root);let current='lobby';function show(view){current=view;const f={lobby:0,imaging:1,morgue:2,ward:3,room:3,recovery:4}[view];decks.forEach((d,i)=>d.root.visible=i===f);camera.position.set(144,18,245);camera.lookAt(144,24,35);if(view==='imaging'){camera.position.set(144,18,166);camera.lookAt(43,19,112);}if(view==='morgue'){camera.position.set(144,18,243);camera.lookAt(114,18,85);}if(view==='ward'||view==='recovery'){camera.position.set(144,18,237);camera.lookAt(144,20,84);}if(view==='room'){camera.position.set(81,19,128);camera.lookAt(43,19,99);}renderer.render(scene,camera);document.getElementById('status').textContent='Floor '+(f+1)+' · '+level29HospitalInterior.DEPARTMENTS[f]+' · '+decks[f].solids.length+' collision reservations';}for(const id of ['lobby','imaging','morgue','ward','room','recovery'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
