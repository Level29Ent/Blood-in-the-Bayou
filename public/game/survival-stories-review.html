<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survivor landmarks review</title><style>body{margin:0;color:#ecd5a3;font:13px monospace;background:#1a303b}aside{position:fixed;top:12px;left:12px;background:#102733ef;z-index:2;padding:14px;max-width:330px}select,button{padding:12px;min-height:44px;background:#354e54;color:#edd8a8}</style></head><body><aside>NOLA SURVIVOR LANDMARKS<p>Shared procedural builders. Isolated model review—not city placement or performance proof.</p><select id="site" aria-label="Landmark"><option value="cathedral">Cathedral / Jackson Square</option><option value="shelter">Evacuation shelter</option><option value="grain">Grain elevator / cargo yard</option><option value="barn">Streetcar barn</option><option value="pharmacy">Looted pharmacy</option><option value="hospital">Abandoned hospital</option><option value="boat">Riverboat survivor hub</option></select><button id="deck">NEXT BOAT DECK</button><p id="status"></p></aside><script src="three.min.js"></script><script>window.level29StoryReview=true;window.level29HubReview=true;</script><script src="survival-landmarks.js"></script><script src="riverboat-hub.js"></script><script>
const T=THREE,scene=new T.Scene(),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);scene.background=new T.Color('#8a9e9f');scene.add(new T.HemisphereLight('#d4e4df','#595e4c',1));const sun=new T.DirectionalLight('#ffe7bb',1.3);sun.position.set(100,200,200);scene.add(sun);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,3000);let model,deck=0;function show(){if(model){scene.remove(model);const gs=new Set(),ms=new Set();model.traverse(o=>{if(o.geometry)gs.add(o.geometry);if(o.material)ms.add(o.material);});gs.forEach(g=>g.dispose());ms.forEach(m=>m.dispose());}const kind=document.getElementById('site').value;model=kind==='boat'?level29HubReview.buildHub(T,{x:0,y:0,w:320,h:192}):level29StoryReview.buildLandmark(T,{x:0,y:0,w:320,h:320},kind);scene.add(model);camera.position.set(430,320,610);camera.lookAt(160,35,140);document.getElementById('status').textContent=kind;deck=0;}document.getElementById('site').onchange=show;document.getElementById('deck').onclick=()=>{if(model.userData.floors){deck=(deck+1)%3;model.userData.floors.forEach((g,i)=>g.visible=i===deck);document.getElementById('status').textContent='Boat deck '+(deck+1);}};show();function draw(t){requestAnimationFrame(draw);if(model.userData.wheel)model.userData.wheel.rotation.z=t*.0003;renderer.render(scene,camera);}requestAnimationFrame(draw);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
