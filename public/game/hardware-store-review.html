<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayou Hardware interior review</title><style>body{margin:0;background:#bbbdb5;color:#fff;font:13px sans-serif}canvas{display:block}aside{position:fixed;top:10px;left:10px;z-index:2;background:#172a2de8;padding:12px;max-width:370px}button{min-height:44px;padding:10px;margin:3px;background:#bd511e;color:white;border:1px solid #e6c28e}p{margin:6px 0}</style></head><body><aside><strong>BAYOU HARDWARE · TOOL AISLES</strong><p>Actual 96 × 96 neighborhood store and production builder.<br>Isolated interior review, not full-city gameplay.</p><button id="entrance">MAIN AISLE</button><button id="tools">HAND TOOLS</button><button id="power">POWER TOOLS</button><button id="checkout">CHECKOUT</button><p id="status">Loading…</p></aside><script src="three.min.js"></script><script src="graphics-pre.js"></script><script>window.level29HardwareReview=true;</script><script src="hardware-store.js?v=hardware-reference-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,600),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;scene.background=new T.Color('#c2c9c6');document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight('#fffef1','#888e88',1.05));const sun=new T.DirectionalLight('#fffaf0',.65);sun.position.set(35,85,100);scene.add(sun);
const b={x:0,y:0,w:96,h:96},store=level29HardwareStore.build(T,b);scene.add(store.root);const views={entrance:[[48,22,87],[48,24,27]],tools:[[39,22,76],[8,24,40]],power:[[54,23,74],[88,24,43]],checkout:[[45,22,48],[65,20,10]]};
function view(name){camera.position.set(...views[name][0]);camera.lookAt(...views[name][1]);renderer.render(scene,camera);document.getElementById('status').textContent=store.root.userData.hardware.products+' stocked products · '+store.root.userData.hardware.tools+' modeled hanging tools · '+name;}for(const name of Object.keys(views))document.getElementById(name).onclick=()=>view(name);view('entrance');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);});
</script></body></html>
