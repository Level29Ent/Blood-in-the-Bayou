<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crown Smoke Shop interior review</title><style>body{margin:0;background:#202024;color:#f4ead5;font:14px sans-serif}canvas{display:block}aside{position:fixed;left:12px;top:12px;padding:12px;background:#24162eea;max-width:320px}p{margin:7px 0}button{min-height:44px;padding:9px;margin:3px;color:#fff5df;background:#5b3572;border:1px solid #c8abd9}</style></head><body><aside><strong>CROWN SMOKE SHOP · INTERIOR REVIEW</strong><p>Production model at the actual compact room size.<br>Not a full-city or phone performance test.</p><button id="entrance">ENTRANCE</button><button id="counter">GLASS COUNTER</button><button id="hookah">HOOKAH DISPLAY</button><button id="wall">WALL STOCK</button><p id="status"></p></aside><script src="three.min.js"></script><script src="smoke-shop-interior.js?v=reference-crown-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(75,innerWidth/innerHeight,.1,500),renderer=new T.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;document.body.appendChild(renderer.domElement);scene.background=new T.Color('#57565e');scene.add(new T.HemisphereLight('#f3eaff','#8a8a81',1.15));const fill=new T.DirectionalLight('#f4faff',.65);fill.position.set(25,90,80);scene.add(fill);
function sign(g,text,w,h,x,y,z,col){const c=document.createElement('canvas');c.width=1024;c.height=128;const a=c.getContext('2d');a.fillStyle='#241a2f';a.fillRect(0,0,1024,128);a.fillStyle=col;a.font='bold 50px sans-serif';a.textAlign='center';a.textBaseline='middle';a.fillText(text,512,64,1000);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:t,side:T.DoubleSide}));m.position.set(x,y,z);g.add(m);}
const shop=level29SmokeShop.build(T,{x:0,y:0,w:64,h:96},{doorWidth:38.4,sign});scene.add(shop.root);const views={entrance:[[32,22,90],[32,21,30]],counter:[[34,21,70],[9,13,43]],hookah:[[32,24,85],[54,24,64]],wall:[[32,23,45],[32,25,5]]};function view(name){camera.position.set(...views[name][0]);camera.lookAt(...views[name][1]);renderer.render(scene,camera);const d=shop.root.userData.smokeShop;document.getElementById('status').textContent=d.hookahs+' hookahs · '+d.glassware+' glass pieces · '+d.packages+' packages · '+name;}for(const name of Object.keys(views))document.getElementById(name).onclick=()=>view(name);view('entrance');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);});
</script></body></html>
