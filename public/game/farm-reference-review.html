<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayou Farm reference review</title><style>body{margin:0;font:14px system-ui;background:#92a38b;color:#fff4dc}canvas{display:block}section{position:fixed;left:12px;top:12px;padding:12px;background:#294c36ed;max-width:380px}button{padding:9px;min-height:44px;margin:3px}p{margin:8px 0}</style><section><strong>BAYOU FARM · BARNS / LIVESTOCK / HARVEST</strong><p>Production scenery and animal models. Review only; no live city jobs or feeding simulation.</p><button id="aerial">FARM OVERVIEW</button><button id="barn">BARNS / TRACTOR</button><button id="animals">SHEEP / GOATS</button><button id="harvest">PUMPKINS</button></section><script src="three.min.js"></script><script>window.level29World={material:c=>new THREE.MeshStandardMaterial({color:new THREE.Color(c).convertSRGBToLinear()})};function mkRng(seed){return ()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};}</script><script src="farm-models.js"></script><script src="farm-reference.js"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,1500),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#b9d4db');scene.add(new T.HemisphereLight('#fff5de','#5b7549',1.15));const sun=new T.DirectionalLight('#fff0d2',.8);sun.position.set(-80,240,190);scene.add(sun);const grass=new T.Mesh(new T.BoxGeometry(400,.2,240),new T.MeshStandardMaterial({color:'#55753d'}));grass.position.set(192,-.2,112);scene.add(grass);scene.add(level29FarmReference.build(T,{x:0,y:0,w:384,h:224}).root);for(const[k,kind]of ['cow','pig','chicken','goat','sheep','duck'].entries())for(let i=0;i<4;i++){const g=level29FarmModels.create(kind,k*4+i);g.scale.multiplyScalar(.65);g.position.set(32+(k%3)*120+(i%2)*60,0,98+Math.floor(k/3)*65+Math.floor(i/2)*22);g.rotation.y=i*.6;scene.add(g);}renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);let current='aerial';function show(v){current=v;const c={aerial:[[470,270,390],[190,12,100]],barn:[[180,33,105],[185,24,28]],animals:[[210,17,208],[165,10,162]],harvest:[[300,8,220],[286,3,210]]}[v];camera.position.set(...c[0]);camera.lookAt(...c[1]);renderer.render(scene,camera);}for(const id of ['aerial','barn','animals','harvest'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});</script></html>
