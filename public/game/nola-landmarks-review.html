<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOLA landmarks review</title><style>body{margin:0;background:#172934;color:#ead9b4;font:13px monospace}aside{position:fixed;top:12px;left:12px;background:#10222be8;padding:14px;z-index:2}select,button{padding:12px;background:#344b51;color:#ffde9b}p{max-width:300px}</style></head><body><aside>NOLA LANDMARKS<p>Shared builders · isolated architecture review, not a full-city screenshot or exact replica.</p><select id="landmark" aria-label="Landmark"><option value="treme">Tremé cottages</option><option value="university">University campus</option><option value="park">City Park</option></select><button id="turn">ROTATE VIEW</button><pre id="status"></pre></aside><script src="three.min.js"></script><script>window.level29NolaReview=true;</script><script src="nola-landmarks.js"></script><script>
const T=THREE,scene=new T.Scene(),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);scene.background=new T.Color('#879da2');scene.add(new T.HemisphereLight('#d3e5e7','#5d6551',.9));const sun=new T.DirectionalLight('#ffe5bd',1.5);sun.position.set(120,400,220);scene.add(sun);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,1,3000);let root,angle=.5;function show(){if(root){scene.remove(root);const gs=new Set(),ms=new Set();root.traverse(o=>{if(o.geometry)gs.add(o.geometry);if(o.material)ms.add(o.material);});gs.forEach(g=>g.dispose());ms.forEach(m=>m.dispose());}const kind=document.getElementById('landmark').value,[w,h]=level29NolaReview.SIZES[kind];root=level29NolaReview.createNewOrleansLandmarks(T,scene,{[kind]:{x:0,y:0,w,h}});camera.position.set(w/2+Math.sin(angle)*660,420,h/2+Math.cos(angle)*660);camera.lookAt(w/2,15,h/2);document.getElementById('status').textContent=kind+' · '+root.children.length+' mesh batches · '+root.userData.solids.length+' solid footprints';}document.getElementById('landmark').onchange=show;document.getElementById('turn').onclick=()=>{angle+=Math.PI/2;show();};show();function frame(){requestAnimationFrame(frame);renderer.render(scene,camera);}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
