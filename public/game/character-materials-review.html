<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character materials and standing fire review</title><style>body{margin:0;background:#1e2924;color:#efe8d5;font:14px system-ui}aside{position:fixed;top:12px;left:12px;max-width:360px;padding:14px;background:#101911ed;z-index:2}button{min-height:44px;padding:8px;margin:4px;background:#304539;color:#ffe3b9;border:1px solid #bda772}#error{color:#ffa489}canvas{display:block}</style></head><body><aside><h2>CHARACTER GPU REVIEW</h2><p>Shared character shaders and recovered animated Ronniebaby. Isolated fixture, not full-city performance evidence.</p><button id="fire">STANDING FIRE</button><button id="walk">WALK</button><button id="night">DUSK / MOONLIGHT</button><button id="turn">TURN</button><p id="status" role="status">Loading animated player…</p><p id="error" role="alert"></p></aside>
<script>window.level29CharacterReviewMode=true;</script><script src="three.min.js"></script><script src="vendor/character-loaders-r149.js"></script><script src="pbr-asset-loader.js"></script><script src="character-polish-models.js"></script><script src="character-materials.js"></script><script src="animated-player.js"></script><script>
const T=THREE,M=level29CharacterMaterials,renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#39473a');scene.fog=new T.FogExp2('#39473a',.006);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,250);camera.position.set(65,28,72);camera.lookAt(8,12,0);scene.add(new T.HemisphereLight('#bdc9b0','#303b28',.8));const sun=new T.DirectionalLight('#ffc17e',1.4);sun.position.set(15,55,30);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-65,right:65,top:65,bottom:-65,near:.1,far:150});scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(160,160),new T.MeshStandardMaterial({color:'#283b2e',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
function sample(x,infected){const root=level29CharacterReview.makeFigure(infected);root.userData.skin.color.set(infected?'#81906c':'#a46d45');root.userData.shirt.color.set(infected?'#63514e':'#40596c');root.userData.pants.color.set('#303c45');root.position.x=x;scene.add(root);M.apply(T,root,infected);return root;}sample(-20,false);sample(22,true);
let player=null,mode='fire',angle=0,dark=false,errors=0;const status=document.getElementById('status'),error=document.getElementById('error');renderer.debug.onShaderError=(gl,program,vs,fs)=>{errors++;error.textContent='Shader compilation failed: '+gl.getProgramInfoLog(program)+' '+gl.getShaderInfoLog(fs);};addEventListener('error',e=>error.textContent=e.message);level29PbrAssets.init(renderer);level29PbrAssets.load('models/Ronniebaby_character.glb').then(g=>{player=new level29AnimatedPlayer.AnimatedPlayer(T,g);M.apply(T,player.model);player.model.visible=true;scene.add(player.model);status.textContent='READY · standing fire · skin mask / morph-safe shaders';}).catch(e=>error.textContent=e.message);
document.getElementById('fire').onclick=()=>{mode='fire';status.textContent='READY · standing fire';};document.getElementById('walk').onclick=()=>{mode='walk';status.textContent='READY · walking';};document.getElementById('turn').onclick=()=>angle+=Math.PI/2;document.getElementById('night').onclick=()=>{dark=!dark;sun.color.set(dark?'#9ebacb':'#ffc17e');sun.intensity=dark?.65:1.4;scene.background.set(dark?'#111d1a':'#39473a');scene.fog.color.copy(scene.background);};
const clock=new T.Clock(),p={x:0,y:0};function frame(){if(player){p.vx=mode==='walk'?1:0;player.update(p,{yaw:angle,fire:mode==='fire'},Math.min(.05,clock.getDelta()),0);player.model.rotation.y=angle;}M.resources(T).rim.value.copy(sun.color);renderer.render(scene,camera);requestAnimationFrame(frame);}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
