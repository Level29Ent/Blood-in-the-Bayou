<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29 Wildlife Zoo safari landscape review</title><style>body{margin:0;background:#a9c4c3;color:#eee2be;font:14px system-ui}canvas{display:block}aside{position:fixed;left:12px;top:12px;max-width:370px;background:#233e32ed;padding:12px}button{padding:10px;min-height:44px;margin:3px;background:#d6c6a1;color:#21372b;border:1px solid #7d6b45}</style></head><body><aside><strong>29 WILDLIFE ZOO · SAFARI HABITATS</strong><p>Production scenery and existing animal models. Review cameras only—not keeper gameplay or a phone performance test.</p><button id="overview">OVERVIEW</button><button id="elephants">ELEPHANTS / RHINO</button><button id="giraffes">GIRAFFE OVERLOOK</button><button id="pool">ROCK POOLS</button><p id="status"></p></aside><script src="three.min.js"></script><script>window.level29DestinationsPreview=true;</script><script src="city-destinations.js?v=safari-reference-1"></script><script src="zoo-landscape.js?v=safari-reference-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,2500),renderer=new T.WebGLRenderer({antialias:false});scene.background=new T.Color('#b5d0d1');scene.add(new T.HemisphereLight('#fff1d4','#627050',1.2));const sun=new T.DirectionalLight('#fff0cc',.8);sun.position.set(-90,200,140);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const z={x:0,y:0,w:704,h:640},model=level29ZooLandscape.build(T,z);scene.add(model.root);for(const h of model.plan.habitats)for(let j=0;j<2;j++){const a=level29DestinationModels.createAnimal(T,h.kind);a.position.set(h.x+78+j*95,1,h.y+50);scene.add(a);}const views={overview:[[920,650,900],[352,0,300]],elephants:[[313,37,151],[192,20,91]],giraffes:[[545,21,159],[533,35,84]],pool:[[666,32,437],[620,8,364]]};let active='overview';function show(v){active=v;camera.position.set(...views[v][0]);camera.lookAt(...views[v][1]);renderer.render(scene,camera);document.getElementById('status').textContent='8 habitats · 4 rock pools · timber viewing rails · static safari truck / rhino · '+v;}for(const v of Object.keys(views))document.getElementById(v).onclick=()=>show(v);show(active);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(active);});
</script></body></html>
