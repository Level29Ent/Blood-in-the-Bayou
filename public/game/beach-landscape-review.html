<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29 Sunset Beach coastal redesign review</title><style>body{margin:0;color:#eee5cc;font:14px system-ui}canvas{display:block}aside{position:fixed;top:12px;left:12px;max-width:370px;padding:12px;background:#244c52ed}button{min-height:44px;padding:10px;margin:3px;background:#e9d4aa;color:#24464a;border:1px solid #b4aa82}</style></head><body><aside><strong>29 SUNSET BEACH · PALM COAST</strong><p>Production scenery. Static visitors/cabins; no full-city swimming or phone benchmark.</p><button id="coast">COASTLINE</button><button id="cabins">BEACH CABINS</button><button id="palms">PALM LOUNGE</button><button id="shore">TURQUOISE SHORE</button><p id="status"></p></aside><script src="three.min.js"></script><script src="beach-landscape.js?v=coastal-reference-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,3000),renderer=new T.WebGLRenderer({antialias:false});scene.background=new T.Color('#a4d2df');scene.fog=new T.Fog('#a4d2df',1300,2500);scene.add(new T.HemisphereLight('#fff1d6','#8b9d8e',1.25));const sun=new T.DirectionalLight('#fff0ce',.85);sun.position.set(50,250,300);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29BeachLandscape.build(T,{x:0,y:0,w:704,h:320});scene.add(d.root);const views={coast:[[820,310,500],[330,0,130]],cabins:[[340,27,109],[170,25,37]],palms:[[595,20,168],[375,20,82]],shore:[[670,20,177],[210,0,200]]};let current='coast';function show(v){current=v;camera.position.set(...views[v][0]);camera.lookAt(...views[v][1]);renderer.render(scene,camera);document.getElementById('status').textContent='4 timber cabins · 8 palms · 16 umbrellas · 32 static visitors · '+v;}for(const v of Object.keys(views))document.getElementById(v).onclick=()=>show(v);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
