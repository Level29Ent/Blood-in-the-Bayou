<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airport / M240 review</title><style>body{margin:0;background:#162c38;color:#e4cf9c;font:13px monospace}aside{position:fixed;z-index:2;top:12px;left:12px;background:#152b35ed;padding:14px;max-width:330px}button,select{min-height:44px;background:#344d55;color:#f3d495;padding:10px}</style></head><body><aside>SHARED MODEL REVIEW<p>Not a full-city gameplay screenshot. Terminal and M240 use production builders.</p><select id="view" aria-label="Review"><option value="airport">Airport terminal interior</option><option value="exterior">Airport roof / exterior</option><option value="gun">M240 feed / casing motion</option></select><button id="fire">FIRE / STOP</button><p id="status"></p></aside><script src="three.min.js"></script><script>

function mkRng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6d2b79f5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const T=THREE,scene=new T.Scene(),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#8b9fa3');document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight('#d6e7ef','#63634d',1));const sun=new T.DirectionalLight('#fff0d0',1.8);sun.position.set(10,20,30);scene.add(sun);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.05,3000),terminal=level29TerminalReview.buildTerminal(T,{x:0,y:0,w:544,h:288});scene.add(terminal);const gun=level29ArsenalReview.buildM240();scene.add(gun);let firing=false,start=performance.now(),last=0,phase=0,next=0;const shells=[],cases=new T.InstancedMesh(new T.CylinderGeometry(.12,.12,.7,8),new T.MeshStandardMaterial({color:'#bd9d59',metalness:.65,roughness:.35}),12);cases.count=0;cases.frustumCulled=false;scene.add(cases);document.getElementById('fire').onclick=()=>firing=!firing;function show(){const mode=document.getElementById('view').value;terminal.visible=mode!=='gun';gun.visible=mode==='gun';cases.visible=gun.visible;if(gun.visible){camera.position.set(13,6,19);camera.lookAt(-.8,-.3,-2);}else if(mode==='exterior'){camera.position.set(650,300,650);camera.lookAt(272,30,140);}else{camera.position.set(272,21,264);camera.lookAt(272,25,75);}}document.getElementById('view').onchange=show;show();const dummy=new T.Object3D();function draw(now){requestAnimationFrame(draw);const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(firing&&now>next){next=now+110;phase+=.43;if(shells.length>=12)shells.shift();shells.push({x:1.4,y:0,z:0,vx:6,vy:5,vz:2,age:0});}for(const [i,m]of (gun.userData.feedBelt||[]).entries()){m.position.x=m.userData.restX-phase%(.43*8);while(m.position.x<-3.5)m.position.x+=.43*8;m.position.y=.35+Math.sin(i*.52+phase*2)*.26;}gun.userData.flash.visible=firing&&now%110<35;let n=0;for(let i=shells.length-1;i>=0;i--){const c=shells[i];if(!level29WeaponFeedReview.casingStep(c,dt)){shells.splice(i,1);continue;}dummy.position.set(c.x,c.y,c.z);dummy.rotation.set(c.age*12,0,c.age*9);dummy.updateMatrix();cases.setMatrixAt(n++,dummy.matrix);}cases.count=n;cases.instanceMatrix.needsUpdate=true;document.getElementById('status').textContent=gun.visible?(firing?'FIRING':'IDLE')+' · '+shells.length+' / 12 cases · '+gun.userData.feedBelt.length+' feed rounds':'Check-in, security, baggage, seating · clear central aisle';renderer.render(scene,camera);}requestAnimationFrame(draw);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
