<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tremé Fight House review</title><style>body{margin:0;background:#24292c;color:#eee8d3;font:14px system-ui}canvas{display:block}section{position:fixed;top:12px;left:12px;max-width:390px;padding:12px;background:#1a2834ed;border:1px solid #b29962}button{min-height:44px;padding:8px;margin:3px;background:#dae0cf;color:#183447;border:1px solid #a0ada4}p{margin:8px 0}</style></head><body><section><strong>TREMÉ FIGHT HOUSE · INDUSTRIAL BOXING GYM</strong><p>Production furnishings in the existing gym footprint. Review cameras only; no city shell, trainers or drill simulation.</p><button id="hall">TRAINING HALL</button><button id="ring">BOXING RING</button><button id="bags">BAGS / TURF</button><button id="strength">WEIGHTS</button><button id="ceiling">DUCTS / LIGHTS</button><p id="status"></p></section><script src="three.min.js"></script><script src="boxing-gym-interior.js?v=reference-boxing-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#485151');scene.add(new T.HemisphereLight('#fff2db','#5b6973',1.05));const sun=new T.DirectionalLight('#fff6e5',.7);sun.position.set(80,130,180);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29BoxingInterior.build(T,{x:0,y:0,w:256,h:224});scene.add(d.root);let current='hall';function show(view){current=view;const v={hall:[[128,19,211],[128,24,53]],ring:[[177,25,133],[125,15,62]],bags:[[128,19,212],[224,24,140]],strength:[[69,19,103],[27,19,35]],ceiling:[[128,19,208],[128,44,137]]}[view];camera.position.set(...v[0]);camera.lookAt(...v[1]);renderer.render(scene,camera);document.getElementById('status').textContent='Raised four-rope ring · 4 suspended bags · turf lane · exposed ducts · emissive hex lights';}for(const id of ['hall','ring','bags','strength','ceiling'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
