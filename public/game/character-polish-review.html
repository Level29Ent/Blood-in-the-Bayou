const R=level29CharacterReview,T=THREE,scene=new T.Scene(),renderer=new T.WebGLRenderer({antialias:true}),camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,600);renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(1.5,devicePixelRatio));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#263640');document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight('#f4e8cf','#344656',1.1));const key=new T.DirectionalLight('#fff0d8',1.6);key.position.set(40,80,65);scene.add(key);const rim=new T.DirectionalLight('#8ebdd1',.7);rim.position.set(-50,30,-40);scene.add(rim);const ground=new T.Mesh(new T.PlaneGeometry(230,130).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:'#33434a',roughness:1}));ground.position.y=-.15;scene.add(ground);
