const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,700),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#9c9290');scene.add(new T.HemisphereLight('#fff3db','#6f6870',1.1));const light=new T.DirectionalLight('#fff2d5',.65);light.position.set(30,90,90);scene.add(light);document.body.appendChild(renderer.domElement);const b={x:0,y:0,w:102,h:70},room=new T.Group();scene.add(room);const m=new T.MeshStandardMaterial({color:'#d2bd95'});for(const [w,h,d,x,y,z]of [[102,49,1,51,25,.5],[1,49,70,.5,25,35],[1,49,70,101.5,25,35],[102,1,70,51,49,35]]){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);room.add(o);}let dir=1,current='entry',store;const views={entry:[[51,23,66],[51,23,15]],bins:[[42,24,60],[12,20,33]],wall:[[60,25,64],[91,20,36]]};function view(n){current=n;const [a,b]=views[n].map(p=>dir===1?p:[102-p[0],p[1],70-p[2]]);camera.position.set(...a);camera.lookAt(...b);renderer.render(scene,camera);document.getElementById('status').textContent=store.root.userData.techGifts.laptops+' laptops · '+store.root.userData.techGifts.packages+' accessory packs · '+store.root.userData.techGifts.plush+' plush toys';}function build(){if(store)scene.remove(store.root);store=level29TechGifts.build(T,b,{dir});scene.add(store.root);view(current);}for(const n of ['entry','bins','wall'])document.getElementById(n).onclick=()=>view(n);document.getElementById('flip').onclick=()=>{dir*=-1;room.rotation.y=dir===1?0:Math.PI;room.position.set(dir===1?0:102,0,dir===1?0:70);build();};build();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);});
