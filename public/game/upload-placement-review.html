<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optimized upload placement review</title><style>body{margin:0;background:#26363d;color:#ead8aa;font:12px monospace}#panel{position:fixed;left:10px;top:10px;z-index:2;background:#09151de8;padding:12px;max-width:85vw}select,button{min-height:44px;background:#28414a;color:#edddac;border:1px solid #a58c53}pre{white-space:pre-wrap;max-height:35vh;overflow:auto}</style></head><body><div id="panel">OPTIMIZED UPLOADS · ISOLATED FIT/LOADER REVIEW<br>Not a full-city screenshot<br><select id="asset" aria-label="Optimized asset"></select><button id="rotate">ROTATE</button><pre id="status">Loading…</pre></div><script src="three.min.js"></script><script src="vendor/gltf-loader-r149.js"></script><script>window.level29ImportedReview=true;</script><script src="imported-assets.js"></script><script>
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,2000),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.appendChild(renderer.domElement);scene.background=new THREE.Color('#5a6e78');scene.add(new THREE.HemisphereLight('#d2e6f2','#585c4b',1));const sun=new THREE.DirectionalLight('#ffe4ba',1.8);sun.position.set(100,200,150);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(1500,1500),new THREE.MeshStandardMaterial({color:'#70816a',roughness:.9}));ground.rotation.x=-Math.PI/2;ground.position.y=-.2;scene.add(ground);const loader=new BayouAssets.GLTFLoader();let model=null,seq=0,report=[];const select=document.getElementById('asset');async function show(){const token=++seq,id=select.value;document.getElementById('status').textContent='LOADING '+id;try{const gltf=await loader.loadAsync('models/optimized/'+id+'.glb');if(token!==seq)return;if(model){scene.remove(model);const geos=new Set(),mats=new Set(),textures=new Set();model.traverse(o=>{if(o.geometry)geos.add(o.geometry);for(const m of Array.isArray(o.material)?o.material:[o.material])if(m){mats.add(m);for(const v of Object.values(m))if(v?.isTexture)textures.add(v);}});geos.forEach(g=>g.dispose());mats.forEach(m=>m.dispose());textures.forEach(t=>t.dispose());}const s=new THREE.Box3().setFromObject(gltf.scene).getSize(new THREE.Vector3()),h=level29ImportedReview.PLACEMENTS[id]?.height||30;model=level29ImportedReview.fit(THREE,gltf.scene,{w:180,h,d:120},level29ImportedReview.PLACEMENTS[id]?.turn||0);scene.add(model);const b=new THREE.Box3().setFromObject(model),size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3()),d=Math.max(size.x,size.y,size.z);camera.position.copy(center).add(new THREE.Vector3(d*.9,d*.65,d*1.25));camera.lookAt(center);const r=report.find(x=>x.id===id);document.getElementById('status').textContent=JSON.stringify({id,bytes:r.afterBytes,triangles:r.afterTriangles,originalBytes:r.beforeBytes,fit:size,textures:renderer.info.memory.textures},null,2);}catch(e){document.getElementById('status').textContent='FAILED '+e.message;}}fetch('models/optimized/report.json').then(r=>r.json()).then(r=>{report=r;for(const item of r.filter(r=>r.url)){const o=document.createElement('option');o.value=item.id;o.textContent=item.id;select.appendChild(o);}for(const id of ['apartment','abandoned','warehouse','modern-house','wooden-house']){const o=document.createElement('option');o.value=id+'-lod';o.textContent=id+' distant LOD';select.appendChild(o);report.push({id:id+'-lod',afterBytes:null,afterTriangles:null,beforeBytes:null});}show();});select.onchange=show;document.getElementById('rotate').onclick=()=>{if(model)model.rotation.y+=Math.PI/2;};function loop(){requestAnimationFrame(loop);renderer.render(scene,camera);}loop();addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></body></html>
