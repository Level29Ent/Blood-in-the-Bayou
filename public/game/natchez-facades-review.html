<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natchez approach facade review</title><style>body{margin:0;background:#394d45;color:#f8edce;font:14px system-ui}aside{position:fixed;z-index:2;top:12px;left:12px;padding:16px;max-width:320px;background:#10231bea}button{min-height:44px;padding:10px}canvas{display:block}</style><body><aside><h2>NATCHEZ APPROACH FACADES</h2><p>Production facade finish on representative tall blue/pink buildings. Geometry and roofs unchanged. Isolated material review—not a full landing screenshot.</p><button id="time">DAY / DUSK</button><p id="status" role="status">Loading…</p></aside><script src="three.min.js"></script><script>window.level29FacadeReview=true;</script><script src="natchez-facades.js"></script><script>
const T=THREE,renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#71817a');scene.fog=new T.FogExp2('#71817a',.0013);const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,1,2000);camera.position.set(270,100,390);camera.lookAt(0,100,0);const sun=new T.DirectionalLight('#ffdfb4',1.7);sun.position.set(-100,300,200);scene.add(sun,new T.HemisphereLight('#c4d4d0','#353c2d',.8));const roof=new T.MeshStandardMaterial({color:'#4a4c46',roughness:1});for(const [i,col]of ['#a9c4d8','#d7a7b4'].entries()){const b={x:-130+i*145,y:-50,w:110,h:100,kind:'normal',col},H=i?210:180,geo=new T.BoxGeometry(b.w,H,b.h),uv=geo.attributes.uv,faceW=[b.h,b.h,b.w,b.w,b.w,b.w];for(let f=0;f<6;f++){if(f===2||f===3)continue;for(let k=0;k<4;k++){const j=f*4+k;uv.setXY(j,uv.getX(j)*faceW[f]/64,uv.getY(j)*H/48);}}const m=new T.Mesh(geo,[roof,roof,roof,roof,roof,roof]);m.position.set(b.x+b.w/2,H/2,0);level29NatchezFacades.apply(T,m,b,H,{x:0,y:0},()=>document.createElement('canvas'));scene.add(m);}const floor=new T.Mesh(new T.PlaneGeometry(1500,1500),new T.MeshStandardMaterial({color:'#3e4741',roughness:.95}));floor.rotation.x=-Math.PI/2;scene.add(floor);let dark=false;document.getElementById('time').onclick=()=>{dark=!dark;sun.color.set(dark?'#edba83':'#ffdfb4');sun.intensity=dark?.65:1.7;};function draw(){renderer.render(scene,camera);document.getElementById('status').textContent='READY · weathered walls / cool glass / separate roughness';requestAnimationFrame(draw);}draw();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
