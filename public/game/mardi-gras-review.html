<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three-block Mardi Gras review</title><style>body{margin:0;background:#253b30;color:#f5e4b9;font:14px/1.4 system-ui}aside{position:fixed;z-index:2;left:12px;top:12px;max-width:380px;padding:14px;background:#0b1d16ed}button{min-height:44px;padding:8px;margin:3px;background:#3c4a35;color:#ffe9b4;border:1px solid #b8a35f}canvas{display:block}</style><body><aside><h2>THREE-BLOCK MARDI GRAS</h2><p>Production loop planner, parade formations, floats, spectators and banners on a synthetic road grid. Not a full-city screenshot or device benchmark.</p><button id="overview">ROUTE OVERVIEW</button><button id="street">STREET VIEW</button><button id="outbreak">CELEBRATION / OUTBREAK</button><p id="status" role="status">Loading…</p></aside><script src="three.min.js"></script><script src="npc-appearance.js"></script><script src="prologue-story.js"></script><script src="festival-spectacle.js"></script><script src="prologue-crowd.js"></script><script src="mardi-gras-city.js"></script><script>
const T=THREE,M=level29MardiCity,C=level29PrologueCrowd,S=level29PrologueStory,renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#6e8979');scene.add(new T.HemisphereLight('#e2d8b6','#354a34',1));const sun=new T.DirectionalLight('#ffe0ac',1.5);sun.position.set(500,700,400);scene.add(sun);const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,1,8000),W=80,roads=[5,19,33,47,61],g=new Uint8Array(W*W),mask=new Uint8Array(W*W).fill(1);for(let y=0;y<W;y++)for(let x=0;x<W;x++)g[y*W+x]=roads.some(r=>x>=r&&x<=r+2||y>=r&&y<=r+2)?1:2;const tile=(x,y)=>g[Math.floor(y/32)*W+Math.floor(x/32)]||4,nav={mask,point:k=>({x:(k%W+.5)*32,y:(Math.floor(k/W)+.5)*32})},route=M.threeBlockRoute(nav,{x:700,y:700},W,roads,tile),length=M.length(route),formation=C.formation(route,S.routePoint,tile,()=>false),spectators=C.spectators(route,tile,()=>false,640,true),marchers=C.procession(),crowd=C.create(T,768);scene.add(crowd);const floor=new T.Mesh(new T.PlaneGeometry(2600,2600),new T.MeshStandardMaterial({color:'#8f9581',roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.set(1280,-.3,1280);scene.add(floor);const roadMat=new T.MeshStandardMaterial({color:'#424c46',roughness:.98});for(const r of roads)for(const vertical of [false,true]){const road=new T.Mesh(new T.PlaneGeometry(vertical?96:2500,vertical?2500:96),roadMat);road.rotation.x=-Math.PI/2;road.position.set(vertical?(r+1.5)*32:1280,0,vertical?1280:(r+1.5)*32);scene.add(road);}const buildings=[];for(let j=0;j<4;j++)for(let i=0;i<4;i++){const b={x:(roads[i]+4)*32,y:(roads[j]+4)*32,w:290,h:290,H:24,kind:'normal'};buildings.push(b);const m=new T.Mesh(new T.BoxGeometry(b.w,58,b.h),new T.MeshStandardMaterial({color:['#8d9480','#8a786c','#657c7a'][i%3],roughness:.9}));m.position.set(b.x+b.w/2,29,b.y+b.h/2);scene.add(m);}const decor=M.build(T,buildings,route);scene.add(decor);const floats=Array.from({length:5},(_,i)=>C.floatModel(T,i));floats.forEach(f=>{f.scale.z=1.45;scene.add(f);});const confetti=level29FestivalSpectacle.confetti(T,96);scene.add(confetti);let street=false,celebrating=true;const start=performance.now();document.getElementById('overview').onclick=()=>street=false;document.getElementById('street').onclick=()=>street=true;document.getElementById('outbreak').onclick=()=>celebrating=!celebrating;
function loop(){const t=(performance.now()-start)/1000;for(const a of marchers){const q=C.formationPoint(formation,t*14+a.unit*(length/5)+140+a.row*14,a.column,a.columns);Object.assign(a,q,{anim:t*6+a.id});}const near=S.routePoint(route,t*14+180);for(const a of spectators)a.anim=t*3+a.id;C.pose(T,crowd,celebrating?spectators.slice(0,384).concat(marchers.filter(a=>a.visible).slice(0,330)):[],()=>0);floats.forEach((f,i)=>{const p=C.formationPoint(formation,t*14+i*(length/5)+70,0,1);f.position.set(p.x,.3,p.y);f.rotation.y=-p.a;f.visible=celebrating&&p.floatClear;});decor.visible=confetti.visible=celebrating;level29FestivalSpectacle.animateConfetti(T,confetti,route,S.routePoint,t,near);if(street){camera.position.set(near.x-Math.cos(near.a)*110-Math.sin(near.a)*20,48,near.y-Math.sin(near.a)*110+Math.cos(near.a)*20);camera.lookAt(near.x+Math.cos(near.a)*40,18,near.y+Math.sin(near.a)*40);}else{camera.position.set(1800,1400,1800);camera.lookAt(900,0,600);}renderer.render(scene,camera);document.getElementById('status').textContent='READY · '+route.blocks+' BLOCK CLOSED LOOP · '+Math.round(length)+' units · '+spectators.length+' planned spectators · '+decor.userData.bannerCount+' banners · '+(celebrating?'CELEBRATING':'OUTBREAK / CELEBRATION HIDDEN');requestAnimationFrame(loop);}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
