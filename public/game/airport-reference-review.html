<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airport reference review</title><style>body{margin:0;background:#93abb5;font:13px sans-serif;color:#fff}canvas{display:block}aside{position:fixed;z-index:2;top:10px;left:10px;max-width:330px;background:#15344eea;padding:12px}button{min-height:44px;padding:10px;margin:3px;background:#286090;color:#fff;border:1px solid #b8c9cc}p{margin:6px 0}</style></head><body><aside><b>CRESCENT INTERNATIONAL · MSY INSPIRED</b><p>Production terminal builder at actual parcel dimensions. Isolated architecture review—not full-city aircraft, traffic or services.</p><button id="exterior">EXTERIOR</button><button id="hall">ARRIVALS HALL</button><button id="security">SECURITY</button><button id="gates">GATE CONCOURSES</button><button id="roof">TOGGLE ROOF</button><p id="status"></p></aside><script src="three.min.js"></script><script>window.level29TerminalReview=true;</script><script src="airport-terminal.js?v=msy-reference-2"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.2,4000),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#b4cbd6');scene.add(new T.HemisphereLight('#fff5e1','#8d9998',1.1));const sun=new T.DirectionalLight('#fff1d3',.9);sun.position.set(-200,500,400);scene.add(sun);document.body.appendChild(renderer.domElement);const b={x:0,y:0,w:544,h:288},g=level29TerminalReview.buildTerminal(T,b);scene.add(g);const ground=new T.Mesh(new T.PlaneGeometry(1300,1200).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:'#a5b39a',roughness:1}));ground.position.set(300,-.3,50);scene.add(ground);let current='exterior';const views={exterior:[[640,340,710],[270,25,110]],hall:[[270,24,281],[300,27,120]],security:[[265,25,205],[190,19,112]],gates:[[550,260,-330],[270,20,20]]};function view(n){current=n;const [a,b]=views[n];camera.position.set(...a);camera.lookAt(...b);renderer.render(scene,camera);document.getElementById('status').textContent='6 check-in desks · 4 screening lanes · 2 baggage belts · 6 gate bridges';}for(const n of ['exterior','hall','security','gates'])document.getElementById(n).onclick=()=>view(n);document.getElementById('roof').onclick=()=>{g.userData.roof.visible=!g.userData.roof.visible;view(current);};view(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);view(current);});
</script></body></html>
