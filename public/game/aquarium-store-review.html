<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aquarium store review</title><style>body{margin:0;background:#233d55;color:white;font:13px sans-serif}canvas{display:block}aside{position:fixed;top:10px;left:10px;background:#122f47e8;padding:12px;z-index:2;max-width:370px}button{min-height:44px;margin:3px;padding:10px;background:#235574;border:1px solid #9bd4df;color:white}p{margin:6px 0}</style></head><body><aside><strong>FISH AQUARIUM STORE · TANK GALLERY</strong><p>Actual mall tenant dimensions and shared production builder.<br>Isolated review, not full-city gameplay or a phone FPS test.</p><button id="entry">ENTRANCE</button><button id="reef">REEF TANK</button><button id="wall">TANK WALL</button><button id="flip">NORTH / SOUTH</button><button id="swim">PAUSE FISH</button><p id="status"></p></aside><script src="three.min.js"></script><script src="graphics-pre.js"></script><script src="aquarium-store.js?v=aquarium-reference-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,700),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#b0c1c4');scene.add(new T.HemisphereLight('#e5f3ff','#839394',1.05));const light=new T.DirectionalLight('#e5f8ff',.65);light.position.set(40,90,90);scene.add(light);document.body.appendChild(renderer.domElement);
const b={x:0,y:0,w:102,h:70};let dir=1,current='entry',running=true,store;const wallMat=new T.MeshStandardMaterial({color:'#e6e8dc'}),room=new T.Group();scene.add(room);for(const [w,h,d,x,y,z]of [[102,46,1,51,24,.5],[1,46,70,.5,24,35],[1,46,70,101.5,24,35]]){const m=new T.Mesh(new T.BoxGeometry(w,h,d),wallMat);m.position.set(x,y,z);room.add(m);}
function build(){if(store)scene.remove(store.root);store=level29AquariumStore.build(T,b,{dir});scene.add(store.root);view(current);}const views={entry:[[51,22,66],[51,18,20]],reef:[[43,24,59],[22,22,40]],wall:[[52,24,40],[52,23,6]]};function view(name){current=name;const [pos,target]=views[name].map(a=>dir===1?a:[102-a[0],a[1],70-a[2]]);camera.position.set(...pos);camera.lookAt(...target);document.getElementById('status').textContent=store.root.userData.aquarium.tanks+' tanks · '+store.root.userData.aquarium.fish+' fish · '+store.root.userData.aquarium.products+' care products · '+(dir===1?'canonical':'mirrored');}
for(const name of ['entry','reef','wall'])document.getElementById(name).onclick=()=>view(name);document.getElementById('flip').onclick=()=>{dir*=-1;room.rotation.y=dir===1?0:Math.PI;room.position.set(dir===1?0:102,0,dir===1?0:70);build();};document.getElementById('swim').onclick=()=>{running=!running;document.getElementById('swim').textContent=running?'PAUSE FISH':'RESUME FISH';};build();let clock=0,last=performance.now();function draw(now){if(running)clock+=Math.min(.05,(now-last)/1000);last=now;store.animate(clock);renderer.render(scene,camera);requestAnimationFrame(draw);}requestAnimationFrame(draw);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
