<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Architecture and Water Check</title><style>body{margin:0;background:#253e49;color:#ead6a2;font:14px monospace}aside{position:fixed;left:12px;top:12px;background:#000c;padding:12px;max-width:330px}button{padding:12px;background:#29434d;color:#ead6a2;border:1px solid #9c8754}</style></head><body><aside><h2>ARCHITECTURE / WATER</h2><p>Shared game builders in a small GPU scene—not a full-city stability benchmark.</p><button id="wake">CREATE WAKE</button><p id="status">Loading…</p></aside><script src="../three.min.js"></script><script>window.level29ArchitecturePreview=true;</script><script src="../architecture-water.js"></script><script>
const A=level29ArchitecturePreviewAPI,scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,1,3000),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(1.5,devicePixelRatio));renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);scene.background=new THREE.Color('#85a6b5');scene.add(new THREE.HemisphereLight('#ebe2cd','#4e6563',1.3));const sun=new THREE.DirectionalLight('#ffe4ba',1.1);sun.position.set(-200,500,200);scene.add(sun);const wall=new THREE.MeshStandardMaterial({color:'#8b8170',roughness:.85}),roof=new THREE.MeshStandardMaterial({color:'#465760',roughness:.7});for(let i=0;i<4;i++)scene.add(A.architecture(THREE,{x:-300+i*150,y:-100,w:110,h:80,kind:i===3?'tower':'normal'},50+i*35,wall,roof));const land=new THREE.Mesh(new THREE.BoxGeometry(850,5,210),wall);land.position.set(0,-3,-75);scene.add(land);const uniforms={time:{value:0},eye:{value:new THREE.Vector3()},deep:{value:new THREE.Color('#234a49')},sky:{value:new THREE.Color('#8ca9b7')},wakes:{value:Array.from({length:6},()=>new THREE.Vector4(0,0,-10,0))}},water=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.ShaderMaterial({uniforms,vertexShader:A.WATER_VERTEX,fragmentShader:A.WATER_FRAGMENT}));water.rotation.x=-Math.PI/2;water.position.set(0,-1,350);scene.add(water);camera.position.set(390,215,420);camera.lookAt(0,32,0);let last=performance.now(),t=0,frames=0;document.getElementById('wake').onclick=()=>uniforms.wakes.value[0].set(60,150,t,1);renderer.debug.onShaderError=()=>document.getElementById('status').textContent='Shader error';function loop(now){t+=Math.max(0,Math.min(.05,(now-last)/1000));last=now;uniforms.time.value=t;uniforms.eye.value.copy(camera.position);renderer.render(scene,camera);if(++frames===3)document.getElementById('status').textContent='Rendered · '+renderer.info.render.calls+' draw calls';requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></body></html>
