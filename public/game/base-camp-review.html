<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Military base camp review</title><style>body{margin:0;color:#eee2c0;background:#b7c6c7;font:14px system-ui}canvas{display:block}aside{position:fixed;left:12px;top:12px;background:#293c32ed;padding:12px;max-width:350px}button{padding:10px;min-height:44px;margin:3px;background:#cabb94;color:#24342b;border:1px solid #e8dec4}</style></head><body><aside><strong>BASE CAMP · REFERENCE SCENERY</strong><p>Production static scenery on original-size parcel.<br>Existing building footprints shown as plain blocks.<br>Not full-world troops, missions or device testing.</p><button id="overview">OVERVIEW</button><button id="tents">TENT ROWS</button><button id="aircraft">AIRCRAFT</button><button id="armor">MOTOR POOL</button><p id="status"></p></aside><script src="three.min.js"></script><script src="base-camp-scenery.js?v=reference-base-camp-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(63,innerWidth/innerHeight,1,2500),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#adcbd3');scene.add(new T.HemisphereLight('#fff1d7','#6b735b',1.25));const sun=new T.DirectionalLight('#ffedcc',.9);sun.position.set(-200,400,260);scene.add(sun);document.body.appendChild(renderer.domElement);const b={x:0,y:0,w:768,h:768,command:{x:384,y:384},buildings:[{x:45,y:55,w:190,h:100,H:114},{x:533,y:55,w:190,h:100,H:45},{x:45,y:240,w:160,h:90,H:38},{x:563,y:240,w:160,h:90,H:38}]},d=level29BaseCamp.build(T,b);scene.add(d.root);function block(w,h,z,x,y,zz,c){const mesh=new T.Mesh(new T.BoxGeometry(w,h,z),new T.MeshStandardMaterial({color:c}));mesh.position.set(x,y,zz);scene.add(mesh);}block(768,1,768,384,-.5,384,'#b1ab91');for(const r of b.buildings)block(r.w,r.H,r.h,r.x+r.w/2,r.H/2,r.y+r.h/2,'#929780');const views={overview:[[1040,670,940],[384,0,310]],tents:[[320,48,282],[150,14,195]],aircraft:[[370,40,240],[295,12,110]],armor:[[475,33,424],[610,12,360]]};let current='overview';function show(id){current=id;camera.position.set(...views[id][0]);camera.lookAt(...views[id][1]);renderer.render(scene,camera);const s=d.root.userData.baseCamp;document.getElementById('status').textContent=s.tents+' tents · '+s.aircraft+' parked aircraft · '+s.armoredVehicles+' armored displays · '+s.flags+' flags';}for(const id of Object.keys(views))document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
