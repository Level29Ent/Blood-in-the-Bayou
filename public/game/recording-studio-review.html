<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crescent recording studio review</title><style>body{margin:0;background:#504839;color:#fff;font:13px sans-serif}canvas{display:block}aside{position:fixed;top:10px;left:10px;background:#17272de8;padding:12px;z-index:2;max-width:390px}button{min-height:44px;margin:3px;padding:10px;background:#67503a;border:1px solid #b7ac83;color:#fff}p{margin:6px 0}</style></head><body><aside><strong>CRESCENT RECORDS · CONTROL / LIVE ROOM</strong><p>Shared production furnishings at the actual 160 × 128 footprint.<br>Isolated review—not full-city gameplay or a working audio mixer.</p><button id="entry">ENTRANCE</button><button id="console">MIXING DESK</button><button id="booth">LIVE ROOM</button><button id="rack">OUTBOARD / KEYS</button><p id="status"></p></aside><script src="three.min.js"></script><script src="graphics-pre.js"></script><script src="recording-studio.js?v=studio-reference-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,700),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#81776a');scene.add(new T.HemisphereLight('#fff4da','#68616d',1.05));const sun=new T.DirectionalLight('#ffe8c5',.65);sun.position.set(50,100,120);scene.add(sun);document.body.appendChild(renderer.domElement);
const b={x:0,y:0,w:160,h:128},studio=level29RecordingStudio.build(T,b);scene.add(studio.root);const wall=new T.MeshStandardMaterial({color:'#76634e'});for(const [w,h,d,x,y,z]of [[160,52,3,80,26,1.5],[3,52,128,1.5,26,64],[3,52,128,158.5,26,64]]){const m=new T.Mesh(new T.BoxGeometry(w,h,d),wall);m.position.set(x,y,z);scene.add(m);}const views={entry:[[80,23,118],[59,23,35]],console:[[59,30,80],[40,19,37]],booth:[[143,24,102],[121,18,40]],rack:[[74,25,85],[14,19,69]]};function view(n){camera.position.set(...views[n][0]);camera.lookAt(...views[n][1]);renderer.render(scene,camera);document.getElementById('status').textContent=studio.root.userData.recordingStudio.channels+' channels · '+studio.root.userData.recordingStudio.modules+' outboard modules · '+n;}for(const n of Object.keys(views))document.getElementById(n).onclick=()=>view(n);view('entry');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);});
</script></body></html>
