<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mess Stop and Bayou Burgers interior review</title><style>body{margin:0;background:#778378;color:#fff0dc;font:14px sans-serif}canvas{display:block}aside{position:fixed;left:12px;top:12px;padding:12px;background:#1e2f2de9;max-width:330px}p{margin:7px 0}button{min-height:44px;padding:9px;margin:3px;border:1px solid #cbbd9b;background:#6d3930;color:#fff3dd}</style></head><body><aside><strong>TWO RESTAURANTS · TWO DIFFERENT INTERIORS</strong><p>Shared production models, actual room sizes.<br>Not full-city gameplay or a phone benchmark.</p><button id="mess">MESS STOP</button><button id="bayou">BAYOU BURGERS</button><button id="counter">COUNTER / KITCHEN</button><button id="seats">DINING AREA</button><p id="status"></p></aside><script src="three.min.js"></script><script src="fast-food-interiors.js?v=distinct-fastfood-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(76,innerWidth/innerHeight,.1,1500),renderer=new T.WebGLRenderer({antialias:false});renderer.outputEncoding=T.sRGBEncoding;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.background=new T.Color('#a8b4aa');scene.add(new T.HemisphereLight('#fff5dd','#829386',1.1));const fill=new T.DirectionalLight('#fff7e8',.6);fill.position.set(60,180,160);scene.add(fill);
function sign(g,text,w,h,x,y,z,col){const c=document.createElement('canvas');c.width=1024;c.height=128;const a=c.getContext('2d');a.fillStyle='#263329';a.fillRect(0,0,1024,128);a.fillStyle=col;a.font='bold 45px sans-serif';a.textAlign='center';a.textBaseline='middle';a.fillText(text,512,64,1000);const tex=new T.CanvasTexture(c);tex.encoding=T.sRGBEncoding;const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tex,side:T.DoubleSide}));m.position.set(x,y,z);g.add(m);}
const rooms={};for(const theme of ['mess','bayou']){const mall=theme==='bayou',b={x:0,y:0,w:mall?102:128,h:mall?70:128},built=level29FastFood.build(T,b,{theme,sign}),root=new T.Group();root.add(built.root);const mat=new T.MeshStandardMaterial({color:mall?'#292e29':'#e4d5bd',roughness:.9});function wall(w,h,d,x,y,z){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);root.add(m);}wall(b.w,48,2,b.w/2,24,0);for(const x of [0,b.w])wall(2,48,b.h,x,24,b.h/2);const door=40,span=(b.w-door)/2;for(const side of [-1,1])wall(span,48,2,b.w/2+side*(door/2+span/2),24,b.h);wall(door,8,2,b.w/2,44,b.h);wall(b.w,1,b.h,b.w/2,50,b.h/2);scene.add(root);rooms[theme]={root,b};}
let active='mess';function view(mode='entry'){for(const name of Object.keys(rooms))rooms[name].root.visible=name===active;const b=rooms[active].b,c=b.w/2;if(mode==='counter'){camera.position.set(c,22,active==='mess'?51:48);camera.lookAt(c,25,9);}else if(mode==='seats'){camera.position.set(c,23,b.h-13);camera.lookAt(active==='mess'?15:12,10,active==='mess'?81:b.h-23);}else{camera.position.set(c,23,b.h-6);camera.lookAt(c,20,20);}renderer.render(scene,camera);document.getElementById('status').textContent=active==='mess'?'MESS STOP · red / stainless · classic booths · soda station':'BAYOU BURGERS · warm oak / black · colorful seating · pendant lights';}document.getElementById('mess').onclick=()=>{active='mess';view();};document.getElementById('bayou').onclick=()=>{active='bayou';view();};document.getElementById('counter').onclick=()=>view('counter');document.getElementById('seats').onclick=()=>view('seats');view();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);});
</script></body></html>
