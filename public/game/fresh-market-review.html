<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fresh Market reference review</title><style>body{margin:0;background:#657874;color:#fff0d2;font:14px system-ui}canvas{display:block}aside{position:fixed;top:12px;left:12px;max-width:340px;background:#283c35eb;padding:12px;border:1px solid #ac915e}p{margin:7px 0}button{min-height:44px;padding:9px;margin:3px;background:#d6c59e;color:#243831;border:1px solid #a88e58}</style></head><body><aside><strong>FRESH MARKET · PRODUCE / GROCERIES</strong><p>Production furnishings at the existing 256 × 224 store size. Isolated interior—not full-city shopping, missions or a device-performance test.</p><button id="entry">Store entrance</button><button id="produce">Produce displays</button><button id="cold">Refrigerated produce</button><button id="deli">Prepared meals</button><button id="aisle">Grocery aisle</button><p id="status" role="status">Loading…</p></aside><script src="three.min.js"></script><script src="fresh-market-interior.js?v=reference-market-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,1200),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#8d9c94');scene.add(new T.HemisphereLight('#fff4df','#7b847a',1.4));const sun=new T.DirectionalLight('#fff5e2',.8);sun.position.set(90,160,170);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const b={x:0,y:0,w:256,h:224},d=level29FreshMarket.build(T,b);scene.add(d.root);let current='entry';const views={entry:[[128,21,210],[128,23,78]],produce:[[128,22,205],[81,13,159]],cold:[[42,22,158],[12,18,109]],deli:[[60,22,54],[58,16,9]],aisle:[[216,22,175],[221,22,80]]};function show(id){current=id;camera.position.set(...views[id][0]);camera.lookAt(...views[id][1]);renderer.render(scene,camera);const s=d.root.userData.freshMarket;document.getElementById('status').textContent=s.fruit+' produce pieces · '+s.meals+' prepared trays · '+s.packages+' pantry/dairy items · '+renderer.info.render.calls+' draws';}for(const id of Object.keys(views))document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
