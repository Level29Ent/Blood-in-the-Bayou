<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29 Land theme park review</title><style>body{margin:0;background:#a6cfdf;color:#fff5db;font:14px system-ui}canvas{display:block}aside{position:fixed;left:12px;top:12px;background:#183b48ee;padding:12px;max-width:350px}button,select{min-height:44px;padding:9px;margin:3px;background:#eed178;color:#173748;border:1px solid #fff0b4}p{margin:7px 0}</style></head><body><aside><strong>29 LAND · THRILLS & SPLASH ISLAND</strong><p>Shared production park and six existing rides.<br>Splash area is scenery, not playable water slides.<br>Not a full-city or phone-performance test.</p><button id="overview">OVERVIEW</button><button id="loop">COASTER LOOP</button><button id="splash">SPLASH ISLAND</button><button id="midway">MIDWAY</button><button id="pause">PAUSE MOTION</button><p id="status">Loading park…</p></aside><script src="three.min.js"></script><script>window.level29ParkPreviewOnly=true;addEventListener('error',e=>document.getElementById('status').textContent='Preview error: '+e.message);</script><script src="theme-park-scenery.js?v=reference-thrills-1"></script><script src="29-land.js?v=reference-thrills-1"></script><script>
const T=THREE,api=level29ParkBuilder,scene=new T.Scene(),camera=new T.PerspectiveCamera(57,innerWidth/innerHeight,1,3500),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#a5d1e1');scene.add(new T.HemisphereLight('#fff4dc','#5e7661',1.2));const sun=new T.DirectionalLight('#fff0d5',.95);sun.position.set(-300,800,500);scene.add(sun);document.body.appendChild(renderer.domElement);const park=api.buildPark(T,{x:0,y:0});park.root.rotation.y=0;park.root.position.set(0,0,0);scene.add(park.root);const water=new T.Mesh(new T.PlaneGeometry(3000,3000),new T.MeshStandardMaterial({color:'#488a9f',roughness:.3}));water.rotation.x=-Math.PI/2;water.position.set(352,-4,320);scene.add(water);const views={overview:[[1010,690,1050],[352,35,300]],loop:[[356,130,416],[146,76,180]],splash:[[712,105,381],[552,34,231]],midway:[[350,54,622],[354,38,400]]};let active='overview',paused=false,time=0,last=performance.now();function view(id){active=id;camera.position.set(...views[id][0]);camera.lookAt(...views[id][1]);document.getElementById('status').textContent='6 free rides · looping steel coaster · 4 decorative slides · '+id;}for(const id of Object.keys(views))document.getElementById(id).onclick=()=>view(id);document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'RESUME MOTION':'PAUSE MOTION';};view(active);function tick(now){if(!paused)time+=Math.max(0,Math.min(.05,(now-last)/1000));last=now;api.animatePark(park,time);renderer.render(scene,camera);requestAnimationFrame(tick);}tick(last);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
