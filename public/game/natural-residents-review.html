<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natural civilian NPC review</title><style>body{margin:0;background:#b3c5c7;color:#eee4ca;font:14px system-ui}canvas{display:block}aside{position:fixed;left:12px;top:12px;background:#263a40ed;padding:12px;max-width:350px}button{min-height:44px;padding:10px;margin:3px;background:#cbbb97;color:#253b40;border:1px solid #ebdeba}</style></head><body><aside><strong>EVERYDAY CIVILIAN NPCS</strong><p>Production nine-batch crowd model.<br>Original procedural people, not photo-scanned faces.<br>Not full-city AI or physical-device performance.</p><button id="group">GROUP</button><button id="face">CLOSE-UP</button><button id="walk">STAND / WALK</button><p id="status"></p></aside><script src="three.min.js"></script><script src="npc-appearance.js?v=natural-residents-1"></script><script src="prologue-crowd.js?v=natural-residents-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,1500),renderer=new T.WebGLRenderer({antialias:true});renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));scene.background=new T.Color('#bdcdd1');scene.add(new T.HemisphereLight('#fff1d8','#707b74',1.15));const sun=new T.DirectionalLight('#fff3db',.85);sun.position.set(100,150,80);scene.add(sun);document.body.appendChild(renderer.domElement);const C=level29PrologueCrowd,people=Array.from({length:16},(_,id)=>({id,...C.character(id),x:id%8*14-49,y:Math.floor(id/8)*22,a:Math.PI/2,anim:0,wait:999})),model=C.create(T,16);scene.add(model);const ground=new T.Mesh(new T.PlaneGeometry(700,700).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:'#8f9892'}));ground.position.y=-.1;scene.add(ground);let walking=false,last=performance.now(),time=0;function view(close){camera.position.set(close?-34:0,close?18:34,close?29:175);camera.lookAt(close?-35:0,close?17:10,0);}document.getElementById('group').onclick=()=>view(false);document.getElementById('face').onclick=()=>view(true);document.getElementById('walk').onclick=()=>walking=!walking;view(false);function tick(now){time+=Math.max(0,Math.min(.05,(now-last)/1000));last=now;people.forEach((a,i)=>{a.wait=walking?0:999;a.anim=walking?time*2+i*.25:0;});C.pose(T,model,people,()=>0);renderer.render(scene,camera);document.getElementById('status').textContent='16 civilians · '+model.children.length+' instanced batches · stable hairstyles/outfits';requestAnimationFrame(tick);}tick(last);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
