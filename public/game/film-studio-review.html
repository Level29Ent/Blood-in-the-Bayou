<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Film studio interior review</title><style>body{margin:0;background:#9aa89b;color:#f1eedb;font:14px sans-serif}canvas{display:block}aside{position:fixed;left:12px;top:12px;max-width:330px;padding:12px;background:#214237e8}p{margin:7px 0}button{min-height:44px;padding:9px;margin:3px;background:#3f6e54;color:#fff6dc;border:1px solid #b2bea1}</style></head><body><aside><strong>LEVEL 29 PRODUCTION · SOUNDSTAGE A</strong><p>Production model at the actual 288 × 224 parcel size.<br>Isolated room, not a city or phone benchmark.</p><button id="entry">ENTRANCE</button><button id="stage">GREEN SCREEN</button><button id="director">DIRECTOR</button><button id="crane">CAMERA CRANE</button><button id="ceiling">LIGHTING RIG</button><p id="status"></p></aside><script src="three.min.js"></script><script src="film-studio-interior.js?v=reference-film-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(76,innerWidth/innerHeight,.1,1500),renderer=new T.WebGLRenderer({antialias:false});renderer.outputEncoding=T.sRGBEncoding;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.background=new T.Color('#252b2d');scene.add(new T.HemisphereLight('#fff7e2','#8b9b8e',1.1));const fill=new T.DirectionalLight('#fff7e8',.6);fill.position.set(100,180,180);scene.add(fill);
function sign(g,text,w,h,x,y,z,col){const c=document.createElement('canvas');c.width=1024;c.height=128;const a=c.getContext('2d');a.fillStyle='#202627';a.fillRect(0,0,1024,128);a.fillStyle=col;a.font='bold 46px sans-serif';a.textAlign='center';a.textBaseline='middle';a.fillText(text,512,64,1000);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:t,side:T.DoubleSide}));m.position.set(x,y,z);g.add(m);}
const b={x:0,y:0,w:288,h:224},store=level29FilmStudio.build(T,b,{sign});scene.add(store.root);
const views={entry:[[144,25,215],[144,23,60]],stage:[[144,26,106],[144,23,13]],director:[[112,27,202],[40,19,155]],crane:[[165,28,188],[239,27,133]],ceiling:[[144,23,165],[144,46,65]]};function show(name){camera.position.set(...views[name][0]);camera.lookAt(...views[name][1]);renderer.render(scene,camera);document.getElementById('status').textContent='3 cameras · 1 crane · green cyclorama · '+name;}for(const name of Object.keys(views))document.getElementById(name).onclick=()=>show(name);show('entry');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);});
</script></body></html>
