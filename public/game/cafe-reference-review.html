<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distinct Neighborhood and Golden Hills cafe review</title><style>body{margin:0;background:#73817e;color:#eee5d0;font:14px system-ui}canvas{display:block}aside{position:fixed;top:12px;left:12px;max-width:370px;padding:12px;background:#253933ed}button{min-height:44px;padding:9px;margin:3px;background:#eee2cb;color:#253933;border:1px solid #967548}</style></head><body><aside><strong>COFFEEHOUSE REDESIGNS</strong><p>Production furniture at each actual parcel size. Isolated review—not city travel or a phone benchmark.</p><button id="neighborhood">NEIGHBORHOOD CAFÉ</button><button id="golden">GOLDEN HILLS CAFE</button><button id="counter">ESPRESSO COUNTER</button><button id="seating">SEATING / LIGHTS</button><p id="status"></p></aside><script src="three.min.js"></script><script src="cafe-reference.js?v=distinct-cafe-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(72,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:false});scene.background=new T.Color('#7d918f');scene.add(new T.HemisphereLight('#fff4df','#718580',1.3));const sun=new T.DirectionalLight('#fff7ec',.6);sun.position.set(90,140,120);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);let root,style='neighborhood',view='entry',b;
function show(){if(root)scene.remove(root);b={x:0,y:0,w:style==='golden'?160:96,h:style==='golden'?128:96};root=level29CafeReference.build(T,b,{style}).root;scene.add(root);if(view==='counter'){camera.position.set(b.w/2,23,40);camera.lookAt(b.w*.47,22,10);}else if(view==='seating'){camera.position.set(b.w/2,23,b.h-13);camera.lookAt(b.w*.22,25,b.h*.56);}else{camera.position.set(b.w/2,22,b.h-7);camera.lookAt(b.w/2,23,12);}renderer.render(scene,camera);document.getElementById('status').textContent=style==='golden'?'Warm wood · globe chandeliers · botanical shelves · 8 seats':'Teal tile · stainless espresso bar · industrial strips · 4 seats';}
for(const name of['neighborhood','golden'])document.getElementById(name).onclick=()=>{style=name;view='entry';show();};for(const name of['counter','seating'])document.getElementById(name).onclick=()=>{view=name;show();};show();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show();});
</script></body></html>
