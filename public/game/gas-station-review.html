<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAS & GO interior review</title><style>body{margin:0;background:#24272a;font:13px sans-serif;color:#fff}canvas{display:block}aside{position:fixed;top:10px;left:10px;background:#14212be8;padding:12px;z-index:2;max-width:390px}button{padding:12px;margin:4px;border:1px solid #cbbd91;background:#344954;color:white;min-height:44px}p{margin:5px 0}</style></head><body><aside><strong>GAS & GO · REFERENCE INTERIOR</strong><p>Shared production furnishings in an isolated room.<br>Not full-city gameplay or a performance benchmark.</p><button id="entrance">ENTRANCE</button><button id="checkout">CHECKOUT</button><button id="coolers">DRINK AISLE</button><p id="status">Loading…</p></aside><script src="three.min.js"></script><script src="gas-station-interior.js?v=reference-gas-1"></script><script>
