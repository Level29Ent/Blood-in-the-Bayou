<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29 Tow & Impound review</title><style>body{margin:0;background:#b9cdd7;color:white;font:14px system-ui}canvas{display:block}aside{position:fixed;top:12px;left:12px;background:#172a35e8;padding:12px;max-width:90vw}p{margin:6px 0}button{min-height:44px;padding:10px;background:#344e58;color:white;border:1px solid #c4bc99;cursor:pointer}</style><aside><b>29 TOW & IMPOUND</b><p>Production yard on isolated ground; parked models are scenery.<br>Not full-city driving or device-performance evidence.</p><button id="yard">Yard</button> <button id="fleet">Tow fleet</button> <button id="gate">Gate</button><p id="status">Loading…</p></aside>
<script src="three.min.js"></script><script src="tow-yard.js?v=reference-tow-1"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color('#becfd7');const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.2,2000),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.75;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight('#fff5e4','#667366',.8));const sun=new THREE.DirectionalLight('#fff0da',.9);sun.position.set(90,240,160);scene.add(sun);
function sign(g,text,w,h,x,y,z,c){const cv=document.createElement('canvas');cv.width=1024;cv.height=128;const ctx=cv.getContext('2d');ctx.fillStyle='#282e2c';ctx.fillRect(0,0,1024,128);ctx.fillStyle=c;ctx.font='bold 64px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,512,64,990);const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t}));mesh.position.set(x,y,z);g.add(mesh);return mesh}
const yard=level29TowYard.build(THREE,{x:0,y:0,w:192,h:160},{sign});scene.add(yard.root);const ground=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),new THREE.MeshStandardMaterial({color:'#6b7960'}));ground.rotation.x=-Math.PI/2;ground.position.set(96,-.3,80);scene.add(ground);
const views={yard:[[250,160,275],[96,5,72]],fleet:[[96,34,125],[96,10,27]],gate:[[96,20,205],[96,10,65]]};function view(name){camera.position.set(...views[name][0]);camera.lookAt(...views[name][1]);renderer.render(scene,camera);document.getElementById('status').textContent='Ready · '+name+' · '+yard.root.userData.towYard.vehicles+' parked vehicles'}for(const name of Object.keys(views))document.getElementById(name).onclick=()=>view(name);view('yard');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera)});
</script></html>
