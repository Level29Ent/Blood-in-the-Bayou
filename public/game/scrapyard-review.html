<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Southern Iron scrap yard review</title><style>body{margin:0;background:#8a9d9a;color:#eee4c7;font:14px system-ui}canvas{display:block}section{position:fixed;top:12px;left:12px;max-width:395px;padding:12px;background:#233e37ed;border:1px solid #b8a079}button{min-height:44px;padding:8px;margin:3px;background:#e8dec0;color:#203d36;border:1px solid #a28a60}p{margin:8px 0}</style></head><body><section><strong>SOUTHERN IRON · AUTO SALVAGE</strong><p>Production yard in the original parcel. Review cameras only; no city terrain, foreman or salvage gameplay.</p><button id="yard">SALVAGE ROWS</button><button id="logs">WRECK DETAIL</button><button id="mill">SCRAP HEAPS</button><button id="crane">GRAPPLE HANDLER</button><button id="aerial">AERIAL</button><p id="status"></p></section><script src="three.min.js"></script><script src="scrapyard-model.js?v=reference-scrap-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,1500),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#afcbd0');scene.add(new T.HemisphereLight('#fff2d7','#5a6657',1.15));const sun=new T.DirectionalLight('#fff0cb',.85);sun.position.set(-70,180,140);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29Scrapyard.build(T,{x:0,y:0,w:256,h:224});scene.add(d.root);let current='yard';function show(view){current=view;const v={yard:[[128,20,223],[144,17,90]],logs:[[128,19,173],[198,15,125]],mill:[[96,20,167],[40,9,112]],crane:[[110,21,111],[40,22,68]],aerial:[[320,260,330],[128,5,112]]}[view];camera.position.set(...v[0]);camera.lookAt(...v[1]);renderer.render(scene,camera);document.getElementById('status').textContent=d.root.userData.scrapyard.cars+' stripped car shells · scrap heaps · grapple handler · clear salvage lane';}for(const id of ['yard','logs','mill','crane','aerial'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
