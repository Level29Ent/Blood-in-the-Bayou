<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blood in the Bayou · firearm detail</title>
<style>body{margin:0;background:#26343f;color:#fff;font:14px system-ui}header{position:fixed;z-index:2;left:12px;top:12px;padding:12px;background:#18232de8;border:1px solid #5c6d7c;border-radius:8px;max-width:90vw}p{margin:6px 0}button{background:#344956;color:#fff;padding:9px;border:1px solid #7d919c;min-height:44px;cursor:pointer}canvas{display:block;width:100vw;height:100dvh}</style>
<header><b>Blood in the Bayou · firearm detail</b><p>Actual shared gun templates · cosmetic changes only</p><button data-id="carbine">Carbine</button> <button data-id="pistol">Pistol</button> <button data-id="smg">SMG</button> <button data-id="marksman">Marksman</button> <button data-id="shotgun">Shotgun</button> <button id="rotate">Other side</button><p id="status">Loading…</p></header><canvas id="view"></canvas>
<script src="three.min.js"></script><script src="firearm-models.js?v=realistic-1"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color('#26343f');
scene.add(new THREE.HemisphereLight('#e4edf7','#4d4a43',1.1));const key=new THREE.DirectionalLight('#fff1dd',1.5);key.position.set(15,30,25);scene.add(key);const rim=new THREE.DirectionalLight('#a9cfea',1.1);rim.position.set(-15,10,-10);scene.add(rim);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('view'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;
const camera=new THREE.PerspectiveCamera(35,1,.1,200);let model,side=1,active='carbine';
function draw(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera)}
function show(id){active=id;if(model)scene.remove(model);model=level29FirearmModels.create(THREE,id);scene.add(model);const b=new THREE.Box3().setFromObject(model),center=b.getCenter(new THREE.Vector3()),size=b.getSize(new THREE.Vector3());model.position.sub(center);model.rotation.y=.08;const distance=Math.max(size.z,size.y)*1.8;camera.position.set(side*distance,distance*.28,distance*.28);camera.lookAt(0,0,0);document.getElementById('status').textContent='Ready · '+id+' · shared geometry / unchanged combat';draw()}
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(b.dataset.id));document.getElementById('rotate').onclick=()=>{side*=-1;show(active)};addEventListener('resize',()=>show(active));show('carbine');
</script></html>
