<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ronniebaby penthouse luxury review</title><style>body{margin:0;background:#adbbbd;color:#f7e6bf;font:14px system-ui}canvas{display:block}aside{position:fixed;top:10px;left:10px;background:#232332eb;padding:12px;max-width:350px}button{min-height:44px;padding:10px;margin:3px;background:#c4a457;color:#231d2b;border:1px solid #f3d99d}p{margin:7px 0}</style></head><body><aside><strong>RONNIEBABY · PENTHOUSE LOUNGE</strong><p>Production furniture; same-size 192×153.6 review shell.<br>Purple top · gold band · green lower walls.<br>Not elevator gameplay, full city or phone testing.</p><button id="lounge">LOUNGE</button><button id="chaise">CHAISE / BAR</button><button id="ceiling">GOLD COFFERS</button><button id="compact">ORIGINAL / EXPANDED SIZE</button><p id="status"></p></aside><script src="three.min.js"></script><script src="penthouse-luxury.js?v=reference-penthouse-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,2500),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#aabcc4');scene.add(new T.HemisphereLight('#fff0d3','#5c5b60',1.2));const sun=new T.DirectionalLight('#ffe9cc',.85);sun.position.set(270,220,180);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.appendChild(renderer.domElement);let expanded=true,current='lounge',room,detail,b;function build(){if(room)scene.remove(room);if(detail)scene.remove(detail.root);b={x:0,y:0,w:expanded?192:160,h:expanded?153.6:128};room=new T.Group();scene.add(room);detail=level29PenthouseLuxury.build(T,b,{base:0});scene.add(detail.root);const mat=c=>new T.MeshBasicMaterial({color:c,toneMapped:false});function box(w,h,d,x,y,z,m){const mesh=new T.Mesh(new T.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);room.add(mesh);}const purple=mat('#672e79'),green=mat('#173f30'),gold=mat('#c5a23c'),trim=mat('#d3bedb');for(const [w,d,x,z]of [[b.w,2,b.w/2,0],[b.w,2,b.w/2,b.h],[2,b.h,0,b.h/2]]){box(w,18,d,x,40,z,purple);box(w,5.7,d,x,23.1,z,gold);box(w,.9,d,x,19.8,z,trim);box(w,18,d,x,10,z,green);}box(b.w,1,b.h,b.w/2,.5,b.h/2,new T.MeshStandardMaterial({color:'#b8ae99',roughness:.45}));box(b.w,1,b.h,b.w/2,49.5,b.h/2,new T.MeshStandardMaterial({color:'#d8c9a7'}));const glazing=new T.MeshStandardMaterial({color:'#c4d9df',transparent:true,opacity:.11,depthWrite:false});box(.2,24,b.h-40,b.w,26,b.h/2,glazing);show(current);}function show(id){current=id;const cx=b.w/2,cy=b.h/2,views={lounge:[[cx,23,b.h-14],[29,14,cy]],chaise:[[cx+4,24,b.h-14],[b.w-20,17,cy-2]],ceiling:[[cx,28,b.h-25],[cx,43,cy]]};camera.position.set(...views[id][0]);camera.lookAt(...views[id][1]);renderer.render(scene,camera);document.getElementById('status').textContent='4 cloud modules · 2 marble tables · 2 chandeliers · '+(expanded?'expanded':'original')+' footprint';}for(const id of ['lounge','chaise','ceiling'])document.getElementById(id).onclick=()=>show(id);document.getElementById('compact').onclick=()=>{expanded=!expanded;build();};build();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
