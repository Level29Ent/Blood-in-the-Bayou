<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trust Bank interior review</title><style>body{margin:0;background:#d8d0bd;color:#fff4d9;font:14px system-ui}canvas{display:block}section{position:fixed;top:12px;left:12px;max-width:380px;padding:12px;background:#193646ed;border:1px solid #bea471}button{min-height:44px;padding:8px;margin:3px;background:#ecdcc0;color:#193646;border:1px solid #b49663}p{margin:8px 0}</style></head><body><section><strong>TRUST BANK · REFERENCE INTERIOR</strong><p>Production furnishings, teller screens and deposit vault. Review cameras only; no city shell, staff or banking transactions.</p><button id="hall">BANK HALL</button><button id="vault">OPEN VAULT</button><button id="deposits">SAFE DEPOSITS</button><button id="tellers">TELLER WINDOWS</button><button id="office">CONSULTATION</button><p id="status"></p></section><script src="three.min.js"></script><script src="bank-interior.js?v=reference-bank-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#c7c5b9');scene.add(new T.HemisphereLight('#fff3d9','#7d858d',1.2));const sun=new T.DirectionalLight('#fff0d1',.7);sun.position.set(70,150,200);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29BankInterior.build(T,{x:0,y:0,w:256,h:224});scene.add(d.root);let current='hall';function show(view){current=view;const v={hall:[[128,18,211],[150,23,48]],vault:[[62,19,157],[61,25,93]],deposits:[[61,19,88],[61,22,18]],tellers:[[139,18,141],[202,24,70]],office:[[145,18,188],[211,17,175]]}[view];camera.position.set(...v[0]);camera.lookAt(...v[1]);renderer.render(scene,camera);document.getElementById('status').textContent=d.root.userData.bank.depositBoxes+' safe-deposit fronts · 3 brass teller windows · open circular vault';}for(const id of ['hall','vault','deposits','tellers','office'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
