<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greentown Library interior review</title><style>body{margin:0;background:#d0d0c5;color:#fff;font:14px sans-serif}canvas{display:block}section{position:fixed;left:12px;top:12px;max-width:390px;padding:12px;background:#243c39ed}button{min-height:44px;padding:8px;margin:3px;background:#90363a;color:white;border:1px solid #d6d2bd}p{margin:8px 0}</style></head><body><section><strong>GREENTOWN LIBRARY · INTERIOR REVIEW</strong><p>Actual civic shell and production furnishings on a local parcel. Not a full-city gameplay or performance test.</p><button id="entrance">READING ROOM</button><button id="aisle">SCIENCE AISLE</button><button id="lounge">LOUNGE / STUDY</button><p id="status"></p></section><script src="three.min.js"></script><script>window.level29LibraryReview=true;</script><script src="interior-models.js"></script><script src="library-interior.js?v=reference-library-1"></script><script>
function addSign(g,text,w,h,x,y,z,col){const c=document.createElement('canvas');c.width=1024;c.height=128;const a=c.getContext('2d');a.fillStyle='#293d3b';a.fillRect(0,0,1024,128);a.fillStyle=col;a.font='bold 42px sans-serif';a.textAlign='center';a.textBaseline='middle';a.fillText(text,512,64,1000);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t}));o.position.set(x,y,z);g.add(o);}
</script><script src="interstate-civic.js?v=reference-library-1"></script><script>
const T=THREE,scene=new T.Scene(),root=new T.Group(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:false});scene.background=new T.Color('#939c91');scene.add(root);scene.add(new T.HemisphereLight('#fff6df','#687368',1));const sun=new T.DirectionalLight('#fff4da',.55);sun.position.set(90,190,150);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const b={x:0,y:0,w:280,h:220},solids=[];level29LibraryShell(root,b,0,'GREENTOWN PUBLIC LIBRARY',solids);const book=new T.Mesh(new T.BoxGeometry(4,6,1.2),new T.MeshStandardMaterial({color:'#6c8857'}));book.position.set(54,16,35);root.add(book);
function show(view){if(view==='entrance'){camera.position.set(140,22,211);camera.lookAt(140,18,50);}if(view==='aisle'){camera.position.set(70,22,126);camera.lookAt(70,18,30);}if(view==='lounge'){camera.position.set(235,22,205);camera.lookAt(110,12,175);}renderer.render(scene,camera);const info=root.children.find(o=>o.userData.library)?.userData.library;document.getElementById('status').textContent=(info?.books||0)+' individual book spines · 4 stack rows · red lounge seats · study tables · clear mission aisle';}for(const id of ['entrance','aisle','lounge'])document.getElementById(id).onclick=()=>show(id);show('entrance');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);});
