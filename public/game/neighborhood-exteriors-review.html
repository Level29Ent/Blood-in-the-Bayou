<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Residential streets review</title><style>body{margin:0;background:#b5cad2;color:#eee;font:14px sans-serif}aside{position:fixed;top:12px;left:12px;padding:12px;background:#162a2ce8;max-width:330px}button{min-height:44px;margin:3px;padding:10px}</style><aside>RESIDENTIAL STREETS<p>Production exterior models on a sample lot. Not a full-city collision, traffic or phone-performance check.</p><button id="all">STREET</button><button id="craftsman">CRAFTSMAN</button><button id="brick">BRICK HOME</button><button id="apartments">APARTMENTS</button></aside><script src="three.min.js"></script><script src="neighborhood-details.js?v=lived-neighborhoods-1"></script><script src="residential-exteriors.js?v=lived-neighborhoods-1"></script><script>window.level29StreetReview=true;</script><script src="street-surfaces.js?v=reference-streets-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,2500),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#b5cad2');document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight('#fff1d8','#657c62',1.3));const sun=new T.DirectionalLight('#fff0cf',1);sun.position.set(-300,500,400);scene.add(sun);const ground=new T.Mesh(new T.PlaneGeometry(1800,1600).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:'#70835c',roughness:1}));ground.position.set(200,-.2,150);scene.add(ground);
