var city={},player={x:0,y:0},moverCtx=null,VENUE_TYPES=[],genCity=function(){},buildVenue=function(){},buildCity=function(){},terrainHeight=function(){return 0},blockedCircle=function(){return false},insideVenue=function(){return false},serviceVenue=function(){},moveCircle=function(){},update=function(){},missionTarget=function(){};
