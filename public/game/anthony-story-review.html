<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ant story sequence review</title><style>body{margin:0;background:#26303a;color:#f3e7ca;font:15px sans-serif}canvas{display:block}section{position:fixed;top:10px;left:10px;max-width:540px;background:#14282bea;padding:14px;z-index:3}button{min-height:44px;margin:4px;padding:10px;background:#37534e;color:#f6e6bd;border:1px solid #c0a266}p{line-height:1.4}</style></head><body><section><strong>ANT NEIGHBORHOOD STORY · COMPONENT REVIEW</strong><p>Actual uploaded models and production mission-state logic. Location/escort inputs below are simulated; this is not an in-city traversal, combat or save test.</p><p id="step"></p><button id="advance">INTERACT AT ANT</button><button id="wrong">TRY WRONG LOCATION</button><button id="reset">RESET SEQUENCE</button><p id="result" role="status"></p><button data-character="Anthony">Single Anthony</button><button data-character="Drako">Draco / Karma owner</button><button data-character="Ronniebaby">Ronniebaby</button><button id="turn">TURN MODEL</button><p id="model" role="status">Select a model.</p></section><script src="three.min.js"></script><script src="vendor/ktx2-loader-r149.js?v=1"></script><script src="vendor/character-loaders-r149.js?v=1"></script><script src="pbr-asset-loader.js?v=pr151-1"></script><script src="uploaded-characters.js?v=1"></script><script src="anthony-story-core.js?v=1"></script><script>
const T=THREE,C=level29AnthonyCore,renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;document.body.appendChild(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#75818b');scene.add(new T.HemisphereLight('#ffeacd','#2d4559',1.05));const sun=new T.DirectionalLight('#fff5e7',1.5);sun.position.set(-3,6,5);scene.add(sun);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,200);camera.position.set(0,16,49);camera.lookAt(0,13,0);level29PbrAssets.init(renderer);let current=null,token=0,state=C.restore(null);
const events=[{use:true,atAnt:true},{use:true,atDome:true},{use:true,atAnt:true,escorted:true},{use:true,atAnt:true},{use:true,atGreenmart:true},{use:true,atAnt:true},{use:true,atAnt:true},{use:true,atLiquor:true},{atAnt:true},{cleared:true,playerHelp:true}],labels=['ACCEPT SUPERDOME PICKUP','MEET BOTH ADULT WOMEN','RETURN WITH BOTH WOMEN','ACCEPT GREENMART ERRAND','COLLECT SEALED CONDOM PACK','HAND PACK TO ANT','ACCEPT LIQUOR ERRAND','COLLECT LIQUOR BOTTLE','ARRIVE AT ANT — REVEAL','PLAYER HELPS DEFEAT BOTH ZOMBIES'];
function update(){document.getElementById('step').textContent=state.step+' · '+C.STEPS[state.step];document.getElementById('advance').textContent=labels[state.step]||'COMPLETE';document.getElementById('advance').disabled=state.step===10;}
document.getElementById('advance').onclick=()=>{const changed=C.advance(state,events[state.step]||{});document.getElementById('result').textContent=changed?'Checkpoint advanced':'No repeat completion';update();};document.getElementById('wrong').onclick=()=>{const previous=state.step;C.advance(state,{});document.getElementById('result').textContent=state.step===previous?'Wrong location rejected; checkpoint unchanged':'ERROR';update();};document.getElementById('reset').onclick=()=>{state=C.restore(null);update();document.getElementById('result').textContent='Sequence reset';};
async function show(name){const request=++token;document.getElementById('model').textContent='Loading '+name+'…';try{const data=await level29PbrAssets.loadCharacter(name),source=name==='Anthony'?level29UploadedCharacters.singleAnthony(T,data.scene):data.scene;if(request!==token)return;if(current)scene.remove(current);current=level29UploadedCharacters.fit(T,source,23);current.rotation.y=0;scene.add(current);document.getElementById('model').textContent=name+' loaded · '+(name==='Anthony'?'one extracted person':'uploaded model');}catch(e){document.getElementById('model').textContent='Load failed: '+e.message;}}
for(const b of document.querySelectorAll('[data-character]'))b.onclick=()=>show(b.dataset.character);document.getElementById('turn').onclick=()=>{if(current)current.rotation.y+=Math.PI/4;};update();function draw(){renderer.render(scene,camera);requestAnimationFrame(draw);}draw();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});addEventListener('pagehide',()=>level29PbrAssets.dispose());
</script></body></html>
