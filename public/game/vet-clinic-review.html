<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayou Veterinary Care interior review</title><style>body{margin:0;background:#a8b8b2;color:#eff5eb;font:14px sans-serif}canvas{display:block}aside{position:fixed;left:12px;top:12px;max-width:330px;background:#253e4ce8;padding:12px}p{margin:7px 0}button{min-height:44px;padding:9px;margin:3px;color:#fff7e7;background:#3f6578;border:1px solid #a9bbb9}</style></head><body><aside><strong>BAYOU VETERINARY CARE · INTERIOR REVIEW</strong><p>Shared production interior at the actual room size.<br>Not full-city gameplay or a phone benchmark.</p><button id="reception">RECEPTION</button><button id="waiting">WAITING AREA</button><button id="treatment">TREATMENT</button><button id="recovery">RECOVERY KENNELS</button><button id="exam">EXAM TABLE</button><p id="status"></p></aside><script src="three.min.js"></script><script src="vet-clinic-interior.js?v=reference-vet-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(75,innerWidth/innerHeight,.1,800),renderer=new T.WebGLRenderer({antialias:false});renderer.outputEncoding=T.sRGBEncoding;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.background=new T.Color('#a8b8b2');scene.add(new T.HemisphereLight('#f6fff5','#8a9992',1.15));const fill=new T.DirectionalLight('#f6fbf5',.6);fill.position.set(60,150,90);scene.add(fill);
function sign(g,text,w,h,x,y,z,col){const c=document.createElement('canvas');c.width=1024;c.height=128;const a=c.getContext('2d');a.fillStyle='#284554';a.fillRect(0,0,1024,128);a.fillStyle=col;a.font='bold 46px sans-serif';a.textAlign='center';a.textBaseline='middle';a.fillText(text,512,64,1000);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:t,side:T.DoubleSide}));m.position.set(x,y,z);g.add(m);}
