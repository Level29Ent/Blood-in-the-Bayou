const T=THREE,renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(1.5,devicePixelRatio));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.appendChild(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#5b6b78');scene.add(new T.HemisphereLight('#fff1dc','#374456',1.1));const sun=new T.DirectionalLight('#fff5e7',1.7);sun.position.set(-3,6,5);scene.add(sun);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.01,100);camera.position.set(0,1.8,5.3);camera.lookAt(0,1.45,0);const ground=new T.Mesh(new T.CircleGeometry(5,64),new T.MeshStandardMaterial({color:'#3a4447',roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);level29PbrAssets.init(renderer);let current=null,pending=0;
