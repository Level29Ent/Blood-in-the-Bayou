<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story cinema review</title><style>body{margin:0;background:#101b16;color:#ede4ce;font:15px/1.5 system-ui}main{max-width:1000px;margin:auto;padding:18px}button{min-height:44px;margin:4px;padding:10px;background:#2e4538;color:#fff0cf;border:1px solid #a49165}#stage{max-width:960px}#status{color:#c3d5bb}</style><body><main><h1>STORY CINEMA · PRODUCTION PLAYER</h1><p>Actual story player and scene sets. Procedural Ahmad/resident stand-ins; Ronnie fight loads the actual animated GLB. No full-city/device performance claim.</p><button data-scene="garageVideo">GARAGE · X29</button><button data-scene="mallVideo">MALL · OUTBREAK</button><button data-scene="ronnieVideo">RONNIE · FIGHT</button><button id="stop">STOP</button><p id="status" role="status">Select a scene.</p><div id="stage"></div></main><script src="three.min.js"></script><script src="vendor/character-loaders-r149.js"></script><script src="pbr-asset-loader.js"></script><script src="character-polish-models.js"></script><script src="story-cinema-staging.js"></script><script src="story-cutscenes.js"></script><script>
let playback=null,loader=null;const status=document.getElementById('status'),mount=document.getElementById('stage');function stop(){playback?.dispose();playback=null;loader?.dispose();loader=null;}function show(id){stop();const A=level29CharacterReview,ahmad=A.makeFigure(false),seated=A.makeFigure(false),ronnie=A.makeJester('#f2b51c',{local:true});ahmad.userData.skin.color.set('#966849');ahmad.userData.shirt.color.set('#e7e0c8');seated.userData.skin.color.set('#946a4b');seated.userData.shirt.color.set('#76644c');status.textContent='PLAYING · '+id;try{loader=new level29PbrAssetLoader.PbrAssetLoader();playback=level29StoryCutscenes.start({T:THREE,mount,id,actors:{ahmad,seated,ronnie,zombie:seated},rendererFactory(canvas){const r=new THREE.WebGLRenderer({canvas,antialias:true});loader.init(r);return r;},loadRonnie:()=>loader.load('models/Ronniebaby_character.glb'),onEnd(){status.textContent='COMPLETE · '+id;},onError(){status.textContent='Scene failed. Retry.';}});}catch(e){status.textContent='ERROR · '+e.message;}}
for(const b of document.querySelectorAll('[data-scene]'))b.onclick=()=>show(b.dataset.scene);document.getElementById('stop').onclick=()=>{stop();status.textContent='STOPPED · resources released';};addEventListener('pagehide',stop);addEventListener('error',e=>status.textContent='ERROR · '+e.message);
</script></body></html>
