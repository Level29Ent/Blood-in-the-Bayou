<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repair garage reference review</title><style>body{margin:0;background:#bcc1ba;color:white;font:13px sans-serif}canvas{display:block}aside{position:fixed;top:10px;left:10px;background:#1a2c35e8;padding:12px;z-index:2;max-width:380px}button{min-height:44px;padding:10px;margin:3px;background:#225877;color:white;border:1px solid #aab4ae}p{margin:6px 0}</style></head><body><aside><strong>REPAIR GARAGE · SERVICE / DIAGNOSTICS</strong><p>Shared production furnishings inside a garage shell.<br>Isolated review, not full-city driving or a phone FPS test.</p><button id="bay">DRIVE-IN BAY</button><button id="tools">TOOL WALL</button><button id="diagnostics">DIAGNOSTICS</button><p id="status"></p></aside><script src="three.min.js"></script><script src="graphics-pre.js"></script><script src="repair-garage.js?v=repair-reference-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,700),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#a9b5b6');document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight('#f8f9e9','#7c8587',1.1));const sun=new T.DirectionalLight('#fff6df',.7);sun.position.set(60,100,150);scene.add(sun);
const b={x:0,y:0,w:192,h:160},store=level29RepairGarage.build(T,b,{sign:(g,text,w,h,x,y,z,color)=>{const c=document.createElement('canvas');c.width=1024;c.height=128;const a=c.getContext('2d');a.fillStyle='#203c4b';a.fillRect(0,0,1024,128);a.fillStyle=color;a.font='bold 37px sans-serif';a.textAlign='center';a.fillText(text,512,78,1000);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:t}));m.position.set(x,y,z);g.add(m);}});scene.add(store.root);const wall=new T.MeshStandardMaterial({color:'#d7dbcd'});for(const [w,h,d,x,y,z]of [[192,52,3,96,26,1.5],[3,52,160,1.5,26,80],[3,52,160,190.5,26,80]]){const m=new T.Mesh(new T.BoxGeometry(w,h,d),wall);m.position.set(x,y,z);scene.add(m);}
const views={bay:[[96,24,151],[96,22,35]],tools:[[96,24,62],[96,25,9]],diagnostics:[[136,23,96],[180,21,48]]};function view(name){camera.position.set(...views[name][0]);camera.lookAt(...views[name][1]);renderer.render(scene,camera);document.getElementById('status').textContent=store.root.userData.repairGarage.tools+' modeled tools · '+store.root.userData.repairGarage.products+' workshop supplies · '+name;}for(const n of Object.keys(views))document.getElementById(n).onclick=()=>view(n);view('bay');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);});
</script></body></html>
