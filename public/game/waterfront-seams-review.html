<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waterfront pavement and boarding review</title><style>body{margin:0;background:#7399a6;color:#f0dfaa;font:13px monospace}canvas{display:block}#panel{position:fixed;top:10px;left:10px;right:10px;max-width:540px;background:#102631ec;padding:12px;z-index:2}button{min-height:44px;margin:4px;padding:10px;background:#2a4b58;color:#eedbb0;border:1px solid #b69d58}</style></head><body><section id="panel">WATERFRONT SURFACE / BOARDING COMPONENT REVIEW<p>Shared continuous pavement and Natchez model. Not the full city or a driving benchmark.</p><button id="ramp">ROAD JOINS</button><button id="landing">CASINO APPROACH</button><p id="status"></p></section><script src="three.min.js"></script><script>window.level29RenewalReview=true;window.level29HubReview=true;</script><script src="city-renewal.js?v=waterfront-seams-1"></script><script src="riverboat-hub.js?v=waterfront-seams-1"></script><script>
const T=THREE,renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(1.5,devicePixelRatio));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;document.body.appendChild(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#8eb5c3');scene.add(new T.HemisphereLight('#ffeecf','#364f52',1));const sun=new T.DirectionalLight('#fff1d5',.9);sun.position.set(50,200,100);scene.add(sun);const camera=new T.PerspectiveCamera(60,innerWidth/innerHeight,.2,2400),sea=new T.Mesh(new T.PlaneGeometry(3000,3000),new T.MeshLambertMaterial({color:'#34697c'}));sea.rotation.x=-Math.PI/2;sea.position.y=-3;scene.add(sea);let root;
function show(mode){if(root)scene.remove(root);root=new T.Group();scene.add(root);if(mode==='ramp'){const W=20,cells=[],values=new Map();for(let z=3;z<=5;z++)for(let x=2;x<14;x++){const k=z*W+x;cells.push(k);values.set(k,40*(1-(x-2)/11));}const field=level29CityRenewal.continuousSurface(W,cells,values,()=>0),mesh=new T.Mesh(level29CityRenewal.roadGeometry(T,W,cells,field.height),new T.MeshLambertMaterial({color:'#727f85'}));root.add(mesh);const stripe=new T.MeshBasicMaterial({color:'#e4c65f'});for(let x=72;x<440;x+=28){const m=new T.Mesh(new T.BoxGeometry(12,.15,1),stripe);m.position.set(x,field.height(x,144)+.2,144);root.add(m);}camera.position.set(40,48,260);camera.lookAt(280,12,144);document.getElementById('status').textContent='40 → 0 height approach · all road cells share exact vertices · support uses the same triangles';}else{const entry={x:0,y:0},boat=level29HubReview.buildNatchezExterior(T,entry);root.add(boat);const dock=new T.Mesh(new T.BoxGeometry(90,2,72),new T.MeshLambertMaterial({color:'#8b7659'}));dock.position.set(-20,0,0);root.add(dock);const ramp=new T.Mesh(new T.BoxGeometry(100,1,40),new T.MeshLambertMaterial({color:'#808e92'}));ramp.position.set(-100,-.5,0);root.add(ramp);camera.position.set(-115,32,88);camera.lookAt(160,35,0);document.getElementById('status').textContent='Boarding landing clear · paddlewheel on far side · off-site interior excluded';}}
for(const mode of ['ramp','landing'])document.getElementById(mode).onclick=()=>show(mode);show('ramp');function loop(){renderer.render(scene,camera);requestAnimationFrame(loop);}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
