<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mobile controls regression fixture</title><link rel="stylesheet" href="foundation-menu.css"><style>body{margin:0;background:#15252d;color:#ebdbb5;font:14px monospace}header{padding:18px;max-width:65vw}#reviewResult{white-space:pre-wrap}#menu[hidden]{display:none}#reviewHints{margin:18px;max-width:85vw}#touch .off{display:none}#mobileActionsPanel{z-index:200!important}</style></head><body class="is-touch"><header>ISOLATED CONTROL REVIEW<br>Production touch CSS / mobile layout<br>Not a gameplay screenshot</header><p id="reviewResult">Loading real control styles…</p><p id="reviewHints">MENU contains secondary actions. Trigger STORE to verify forwarding. All 6 core buttons must be separate and inside the viewport.</p><div id="menu" hidden></div><div id="touch"><div class="group"><button id="wbtn">WEAPON</button><button id="shoot">FIRE</button><button id="enter">ENTER</button><button id="runBtn">RUN</button><button id="venueAction">USE</button><button id="storeBtn">STORE</button><button id="fishBtn">FISH</button><button id="jumpControl">JUMP</button></div></div><div id="joy"><div id="joyKnob"></div></div><script>
let state='play',mpRole=null,mouse={down:false},keys={},showMap=false;function update(){}let action='';for(const b of document.querySelectorAll('#touch button'))b.onclick=()=>{action=b.textContent+' forwarded';measure();};
function measure(){const buttons=[...document.querySelectorAll('#touch button')].filter(b=>getComputedStyle(b).display!=='none'),rects=buttons.map(b=>({id:b.id,r:b.getBoundingClientRect()}));const overlaps=rects.some((a,i)=>rects.slice(i+1).some(b=>a.r.left<b.r.right&&a.r.right>b.r.left&&a.r.top<b.r.bottom&&a.r.bottom>b.r.top));const fit=rects.every(({r})=>r.left>=0&&r.right<=innerWidth&&r.top>=0&&r.bottom<=innerHeight&&r.width>=44&&r.height>=40);document.getElementById('reviewResult').textContent=`${innerWidth} × ${innerHeight}\n${buttons.length} core buttons\n${!overlaps&&fit?'PASS: separate, in bounds':'FAIL: overlap/out of bounds'}\n${action}`;}
(async()=>{const source=await(await fetch('joy.js')).text(),match=source.match(/joyCss.textContent = `([\s\S]*?)`;/);if(!match)throw Error('Production touch CSS not found');const style=document.createElement('style');style.textContent=match[1];document.head.appendChild(style);const script=document.createElement('script');script.src='mobile-layout-fix.js?v=mobile-cashier-1';script.onload=()=>{update();setTimeout(measure,100);};document.body.appendChild(script);})();addEventListener('resize',measure);
</script></body></html>
