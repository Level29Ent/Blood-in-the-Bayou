const T=THREE,renderer=new T.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputEncoding=T.sRGBEncoding;document.body.appendChild(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#678d96');scene.add(new T.HemisphereLight('#f6edcf','#435d50',1.3));const camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);camera.position.set(0,0,6);const mat=new T.MeshStandardMaterial({color:'#bbb19a',roughness:.7}),cube=new T.Mesh(new T.BoxGeometry(2,2,2),mat);scene.add(cube);const loading=new T.LoadingManager(),manager=new level29TextureManager.TextureManager(renderer,loading),url='/game/textures/fixtures/loader-check.ktx2';let retained=0,pending=false;const status=document.getElementById('status'),error=document.getElementById('error');document.getElementById('load').onclick=async()=>{if(pending||retained)return;pending=true;error.textContent='';status.textContent='Loading…';try{const a=manager.loadKTX2Texture(url,null,p=>status.textContent=p.percent===null?'Loading bytes · total unknown':'Loading '+p.percent+'%'),b=manager.acquire(url);retained=2;const [t,u]=await Promise.all([a,b]);if(t!==u)throw Error('Duplicate textures');mat.map=t;mat.needsUpdate=true;status.textContent='LOADED · same texture shared · mip generation '+t.generateMipmaps;}catch(e){error.textContent=e.message;while(retained>0){manager.release(url);retained--;}}finally{pending=false;}};document.getElementById('release').onclick=()=>{mat.map=null;mat.needsUpdate=true;while(retained>0){manager.release(url);retained--;}status.textContent='RELEASED · cache empty';};document.getElementById('basis').onclick=async()=>{try{await manager.ktx2Loader.init();status.textContent='BASIS JS / WASM READY · no compressed payload tested';}catch(e){error.textContent=e.message;}};function loop(){cube.rotation.y+=.005;cube.rotation.x=.15;renderer.render(scene,camera);document.getElementById('stats').textContent=JSON.stringify({...manager.stats,gpuTextures:renderer.info.memory.textures});requestAnimationFrame(loop);}loop();addEventListener('pagehide',()=>manager.dispose());addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
