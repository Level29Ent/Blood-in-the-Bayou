<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level 29 · Interior Draw-call Benchmark</title><style>body{margin:0;background:#1c3035;color:#ead6a8;font:13px monospace}aside{position:fixed;top:12px;left:12px;padding:16px;background:#000d;max-width:390px}button{padding:10px;margin:3px;border:1px solid #ae9559;background:#293b3f;color:#f2d99b}#stats{white-space:pre-line}</style></head><body><aside><h2>STOCKED INTERIOR · GPU CHECK</h2><p>Same geometry and materials, with/without room batches. This is a small-scene benchmark, NOT full-city FPS evidence.</p><button id="toggle">SHOW UNBATCHED</button><button id="door">CLOSED WALL VIEW</button><p id="stats">Loading fixtures…</p></aside><script src="../three.min.js"></script><script>window.level29RoomPreview=true;</script><script src="../lived-interiors.js?v=1"></script><script src="../room-performance.js?v=1"></script><script>
'use strict';const A=level29RoomPreviewAPI,P=level29LivedPreview,scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,1400),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.appendChild(renderer.domElement);scene.background=new THREE.Color('#627b83');scene.add(new THREE.HemisphereLight('#f4ebd7','#55726b',1.4));const sun=new THREE.DirectionalLight('#fff0d1',1.3);sun.position.set(70,150,100);scene.add(sun);const room=new THREE.Group();scene.add(room);function box(w,h,d,x,y,z,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.85}));m.position.set(x,y,z);room.add(m);}box(180,1,180,90,-.5,90,'#a4987e');box(180,44,3,90,22,1.5,'#b6b49c');box(3,44,180,1.5,22,90,'#b6b49c');box(3,44,180,178.5,22,90,'#b6b49c');box(62,44,3,31,22,178.5,'#b6b49c');box(62,44,3,149,22,178.5,'#b6b49c');const specs=[['stocked-shelf',25,30],['stocked-shelf',25,75],['stocked-shelf',25,120],['drink-cooler',150,30],['drink-cooler',150,70],['checkout',145,120],['display-rack',125,150],['delivery-boxes',115,25],['lived-table',85,30],['home-shelf',55,20]];function furnish(){const g=new THREE.Group();for(const [kind,x,z]of specs){const p=P.buildFixture(THREE,kind,P.palette);p.position.set(x,0,z);g.add(p);}return g;}const original=furnish(),batched=furnish();scene.add(original,batched);const nodes=[];batched.traverse(o=>{if(A.staticLeaf(o,new Set()))nodes.push(o);});const reduction=A.mergeStatic(THREE,batched,nodes);let optimized=true,outside=false;document.getElementById('toggle').onclick=()=>{optimized=!optimized;document.getElementById('toggle').textContent=optimized?'SHOW UNBATCHED':'SHOW BATCHED';};document.getElementById('door').onclick=()=>{outside=!outside;document.getElementById('door').textContent=outside?'ENTER ROOM':'CLOSED WALL VIEW';};const data={rect:{x:0,y:0,w:180,h:180},bounds:new THREE.Box3(new THREE.Vector3(8,0,8),new THREE.Vector3(172,40,172)),base:0,portal:{x:90,y:180,width:56},open:false},frustum=new THREE.Frustum(),matrix=new THREE.Matrix4();function draw(){camera.position.set(outside?90:106,outside?20:55,outside?-170:205);camera.lookAt(90,12,85);camera.updateMatrixWorld(true);matrix.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);frustum.setFromProjectionMatrix(matrix);const visible=A.roomVisible(THREE,data,camera,frustum);original.visible=!optimized&&visible;batched.visible=optimized&&visible;renderer.render(scene,camera);document.getElementById('stats').textContent=(optimized?'BATCHED':'UNBATCHED')+' · '+renderer.info.render.calls+' DRAW CALLS\n'+renderer.info.render.triangles+' TRIANGLES\n'+reduction.source+' PROP MESHES → '+reduction.drawables+' BATCHES\nROOM CONTENTS: '+(visible?'VISIBLE':'CULLED BEHIND CLOSED WALL');requestAnimationFrame(draw);}draw();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
