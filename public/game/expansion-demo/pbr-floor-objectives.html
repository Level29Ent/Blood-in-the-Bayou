<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PBR / Zoned Room Review</title><style>body{margin:0;background:#152b34;color:#ecd8a4;font:13px monospace}aside{position:fixed;left:12px;top:12px;padding:14px;max-width:360px;background:#000d}button{min-height:44px;padding:10px;margin:3px;color:#ecd8a4;background:#2d494d;border:1px solid #b19a63}#error{color:#ffb094}</style></head><body><aside><h2>PBR / ZONE MASK REVIEW</h2><p>Shared room grid and managed material bindings. Tiny original uncompressed KTX2 fixtures—not compression savings or full-game art.</p><button id="apply">APPLY DIFFUSE + NORMAL</button><button id="release">RELEASE MATERIAL MAPS</button><p id="status"></p><p id="error"></p></aside><script src="../three.min.js"></script><script src="../vendor/ktx2-loader-r149.js"></script><script src="../texture-manager.js"></script><script src="../room-grid.js"></script><script src="../interior-core.js"></script><script>window.level29PBRReview=true;</script><script src="../pbr-texture-bindings.js"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,1,1500),renderer=new T.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);scene.background=new T.Color('#809a9f');scene.add(new T.HemisphereLight('#ede4cd','#435c4b',1.3));const sun=new T.DirectionalLight('#ffdfaa',.8);sun.position.set(-100,150,100);scene.add(sun);const manager=new level29TextureManager.TextureManager(renderer,T.DefaultLoadingManager),binding=new level29PBRReviewAPI.PBRBindings(manager),surface=new T.MeshStandardMaterial({color:'#c1b79e',roughness:.65,metalness:0}),wall=new T.Mesh(new T.BoxGeometry(180,28,2),surface);wall.position.set(90,14,0);scene.add(wall);const plan=level29InteriorCore.plan({id:'safe',b:{x:0,y:0,w:180,h:200},doorX:90,doorY:200,furniture:[]}),palette={wood:new T.MeshStandardMaterial({color:'#947a59'}),metal:new T.MeshStandardMaterial({color:'#678185',metalness:.5}),fabric:new T.MeshStandardMaterial({color:'#6e827a'}),paper:new T.MeshStandardMaterial({color:'#d7ceaf'})};const colors={living:'#677f6d',kitchen:'#8b866b',bedroom:'#74778a'};for(const zone of plan.zones){const m=new T.Mesh(new T.BoxGeometry(zone.w,1,zone.h),new T.MeshStandardMaterial({color:colors[zone.name]}));m.position.set(zone.x+zone.w/2,-1,zone.y+zone.h/2);scene.add(m);}const corridor=new T.Mesh(new T.BoxGeometry(plan.corridor.w,1,200),new T.MeshStandardMaterial({color:'#c1af7d'}));corridor.position.set(90,-1,100);scene.add(corridor);for(const p of plan.props){const mesh=level29InteriorCore.buildProp(T,p.kind,palette);mesh.position.set(p.x+p.w/2,0,p.y+p.h/2);mesh.rotation.y=p.angle;scene.add(mesh);}camera.position.set(250,165,310);camera.lookAt(90,0,95);let pending=false;const maps={map:'/game/textures/fixtures/pbr-diffuse.ktx2',normalMap:'/game/textures/fixtures/pbr-normal.ktx2'};document.getElementById('apply').onclick=async()=>{if(pending||binding.bindings.has(surface))return;pending=true;try{await binding.apply(surface,maps);document.getElementById('error').textContent='';}catch(e){document.getElementById('error').textContent=e.message;}pending=false;};document.getElementById('release').onclick=()=>binding.release(surface);function loop(){renderer.render(scene,camera);document.getElementById('status').textContent=plan.props.map(p=>p.kind+'→'+p.zone).join(' · ')+' | '+JSON.stringify(manager.stats)+' | GPU textures '+renderer.info.memory.textures;requestAnimationFrame(loop);}loop();addEventListener('pagehide',()=>{binding.dispose();manager.dispose();});
</script></body></html>
