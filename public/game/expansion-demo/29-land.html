<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29 Land — Ride Preview</title><style>body{margin:0;background:#182932;color:#ffe2a2;font:13px monospace}aside{position:fixed;left:12px;top:12px;background:#000d;padding:12px;max-width:350px}button,select{padding:10px;background:#25383e;color:#ffe2a2;border:1px solid #b29451}p{max-width:340px}</style></head><body><aside><h2>29 LAND · PARK PREVIEW</h2><p>Shared park models. Not full-city collision or performance verification.</p><select id="ride"><option value="overview">PARK OVERVIEW</option><option value="steel">BAYOU VIPER · STEEL</option><option value="wood">TIMBER RUN · WOODEN</option><option value="carousel">GOLDEN CAROUSEL</option><option value="wheel">SKY 29</option><option value="cups">NEON TEACUPS</option><option value="tower">BAYOU DROP</option></select><p id="status">Loading park…</p></aside><script src="../three.min.js"></script><script>addEventListener('error',e=>document.getElementById('status').textContent='PREVIEW ERROR: '+e.message);window.level29ParkPreviewOnly=true;</script><script src="../theme-park-scenery.js?v=reference-thrills-1"></script><script src="../29-land.js?v=reference-thrills-1"></script><script>
'use strict';const api=level29ParkBuilder,scene=new THREE.Scene();scene.background=new THREE.Color('#6d9eae');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);const camera=new THREE.PerspectiveCamera(57,innerWidth/innerHeight,1,3000);scene.add(new THREE.HemisphereLight('#eee9db','#626858',1.2));const sun=new THREE.DirectionalLight('#ffe7c3',1);sun.position.set(-200,700,500);scene.add(sun);const park=api.buildPark(THREE,{x:0,y:0});scene.add(park.root);const water=new THREE.Mesh(new THREE.PlaneGeometry(2500,2500),new THREE.MeshStandardMaterial({color:'#2d5964',roughness:.3}));water.rotation.x=-Math.PI/2;water.position.set(352,-4,320);scene.add(water);let selected='overview',t=0,last=performance.now();document.getElementById('ride').onchange=e=>selected=e.target.value;const lengths=['steel','wood'].map(id=>api.RIDES.find(r=>r.id===id).name+': '+Math.round(park.vehicles[id].length)+' world-unit track');document.getElementById('status').textContent=lengths.join(' / ');function animate(now){t+=Math.max(0,Math.min(.05,(now-last)/1000));last=now;api.animatePark(park,t);park.root.updateMatrixWorld(true);camera.up.set(0,1,0);if(selected==='overview'){camera.position.set(930,720,1170);camera.lookAt(352,12,320);}else{const v=park.vehicles[selected],p=new THREE.Vector3();v.anchor.getWorldPosition(p);camera.position.copy(p);if(v.curve){const q=v.curve.getPointAt((t/v.seconds+.018)%1);park.root.localToWorld(q);camera.up.set(0,1,0).applyQuaternion(v.anchor.getWorldQuaternion(new THREE.Quaternion()));q.addScaledVector(camera.up,5);camera.lookAt(q);}else camera.lookAt(352,16,350);}renderer.render(scene,camera);requestAnimationFrame(animate);}animate(performance.now());addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
