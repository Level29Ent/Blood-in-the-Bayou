<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level 29 · Visual Direction</title><style>body{margin:0;background:#1a3038;color:#f0d6a0;font:14px monospace}aside{position:fixed;left:12px;top:12px;padding:14px;max-width:350px;background:#000d}button{padding:12px;color:#f1d597;background:#203c45;border:1px solid #ad925b}</style></head><body><aside><h2>LEVEL 29 · VISUAL DIRECTION</h2><p>Exact façade-detail builder in a small review scene. Original stylized assets—not UE5 or full-city performance evidence.</p><button id="time">DUSK / DAY</button><p id="stats">Loading…</p></aside><script src="../three.min.js"></script><script>window.level29VisualPreview=true;</script><script src="../world-visual-polish.js"></script><script>
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(54,innerWidth/innerHeight,1,3000),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(1.5,devicePixelRatio));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);scene.background=new THREE.Color('#927c74');scene.fog=new THREE.Fog('#927c74',450,1700);const hemi=new THREE.HemisphereLight('#c3d6e4','#3b4d3f',.9),sun=new THREE.DirectionalLight('#ffc58a',1.7);sun.position.set(-150,80,250);scene.add(hemi,sun);const buildings=[{x:-200,y:0,w:128,h:96,H:47,kind:'normal'},{x:-30,y:0,w:140,h:96,H:67,kind:'tower'},{x:155,y:0,w:128,h:96,H:36,kind:'normal'}];const facade=new THREE.MeshStandardMaterial({color:'#817c6d',roughness:.9}),stone=new THREE.MeshStandardMaterial({color:'#c5b89c',roughness:.85}),metal=new THREE.MeshStandardMaterial({color:'#334f5b',metalness:.5,roughness:.35}),windowMat=new THREE.MeshStandardMaterial({color:'#223e4a',roughness:.24,metalness:.25});for(const b of buildings){const h=b.H*2.4,m=new THREE.Mesh(new THREE.BoxGeometry(b.w,h,b.h),facade);m.position.set(b.x+b.w/2,h/2,b.y+b.h/2);scene.add(m);for(let x=b.x+20;x<b.x+b.w-12;x+=52)for(let y=24;y<h-12;y+=48){const w=new THREE.Mesh(new THREE.BoxGeometry(21,18,1),windowMat);w.position.set(x,y,b.y+b.h+.5);scene.add(w);}}const details=level29VisualPolishBuilder.buildDetail(THREE,buildings,{stone,metal});scene.add(details);const road=new THREE.Mesh(new THREE.BoxGeometry(800,2,180),new THREE.MeshStandardMaterial({color:'#24343a',roughness:1}));road.position.set(0,-1,200);scene.add(road);const sidewalk=new THREE.Mesh(new THREE.BoxGeometry(800,3,60),stone);sidewalk.position.set(0,0,120);scene.add(sidewalk);for(let x=-360;x<350;x+=55){const stripe=new THREE.Mesh(new THREE.BoxGeometry(27,.2,2),new THREE.MeshBasicMaterial({color:'#b3ad81'}));stripe.position.set(x,.1,220);scene.add(stripe);}camera.position.set(360,110,440);camera.lookAt(10,60,45);let dusk=true;document.getElementById('time').onclick=()=>{dusk=!dusk;scene.background.set(dusk?'#927c74':'#9cb8c9');scene.fog.color.copy(scene.background);sun.color.set(dusk?'#ffc58a':'#fff1d9');sun.intensity=dusk?1.7:1.2;};function loop(){renderer.render(scene,camera);document.getElementById('stats').textContent=renderer.info.render.calls+' draws · façade overlay '+details.children.length+' shared instance batches';requestAnimationFrame(loop);}loop();
</script></body></html>
