<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interior Systems Review</title><style>body{margin:0;background:#10252b;color:#e6d3a6;font:13px monospace}aside{position:fixed;top:12px;left:12px;padding:14px;background:#000d;max-width:330px;z-index:2}button{min-height:44px;padding:9px;background:#2b464b;color:#eed9a5;border:1px solid #a68d59;margin:3px}</style></head><body><aside><h2>ROOM / COVER / PHYSICS REVIEW</h2><p>Shared human-scale prop generator, cannon-es articulated bodies and traveling missiles. Isolated test—not mobile FPS or full-city proof.</p><button id="room">ROOM VIEW</button><button id="damage">DAMAGE COVER</button><button id="ragdoll">IMPULSE RAGDOLL</button><button id="missile">FIRE MISSILE</button><p id="stats"></p><p id="error"></p></aside><script src="../three.min.js"></script><script src="../vendor/cannon-es.js?v=1"></script><script src="../interior-core.js?v=1"></script><script>window.level29PhysicsReview=true;</script><script src="../articulated-physics.js?v=1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,1,1500),renderer=new T.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);scene.background=new T.Color('#809fa5');scene.add(new T.HemisphereLight('#ede5cc','#46584c',1.1));const sun=new T.DirectionalLight('#ffdbae',1);sun.position.set(-80,200,150);scene.add(sun);const ground=new T.Mesh(new T.BoxGeometry(650,2,400),new T.MeshStandardMaterial({color:'#7c8778',roughness:.9}));ground.position.set(175,-2,70);scene.add(ground);const palette={wood:new T.MeshStandardMaterial({color:'#8b7054',roughness:.85}),metal:new T.MeshStandardMaterial({color:'#657e83',metalness:.5,roughness:.5}),fabric:new T.MeshStandardMaterial({color:'#687e73',roughness:.95}),paper:new T.MeshStandardMaterial({color:'#d6cfb6'})},layout=level29InteriorCore.plan({id:'safe',b:{x:0,y:0,w:140,h:160},doorX:70,doorY:160,furniture:[]}),props=[];for(const spec of layout.props){const m=level29InteriorCore.buildProp(T,spec.kind,palette);m.position.set(spec.x+spec.w/2,0,spec.y+spec.h/2);m.rotation.y=spec.angle;scene.add(m);props.push({...spec,maxHp:spec.hp,mesh:m});}const wall=new T.Mesh(new T.BoxGeometry(140,28,2),new T.MeshStandardMaterial({color:'#b4ae99',roughness:1}));wall.position.set(70,14,0);scene.add(wall);const stripe=new T.Mesh(new T.BoxGeometry(layout.corridor.w,.1,160),new T.MeshBasicMaterial({color:'#bfad73',transparent:true,opacity:.2}));stripe.position.set(70,.1,80);scene.add(stripe);const physics=new level29ArticulatedModels.RagdollWorld(BayouPhysics,T,scene),missiles=new level29ArticulatedModels.MissilePool(T,scene,4);let view='room',blasts=0;function roomView(){view='room';camera.position.set(200,125,240);camera.lookAt(70,6,70);}function physicsView(){view='physics';camera.position.set(340,85,140);camera.lookAt(260,13,0);}roomView();document.getElementById('room').onclick=roomView;document.getElementById('damage').onclick=()=>{const p=props.find(p=>!p.destroyed);if(p){level29InteriorCore.damage(p,40);p.mesh.visible=!p.destroyed;if(p.state==='damaged')p.mesh.scale.y=.85;}};document.getElementById('ragdoll').onclick=()=>{physicsView();physics.spawn(260,0,0,{x:60,y:10,z:10},2);};document.getElementById('missile').onclick=()=>{physicsView();missiles.launch(new T.Vector3(200,20,0),new T.Vector3(1,0,0),100);};let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;try{physics.step(dt);missiles.step(dt,(a,b)=>b.x>=300?b:null,()=>blasts++);renderer.render(scene,camera);document.getElementById('stats').textContent=props.filter(p=>!p.destroyed).length+' props · '+physics.world.bodies.length+' bodies / '+physics.world.constraints.length+' joints · '+missiles.items.length+' missiles · '+blasts+' impacts';}catch(e){document.getElementById('error').textContent=e.stack;return;}requestAnimationFrame(loop);}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
