<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level 29 City Career Catalog</title><style>body{background:#101e24;color:#ead7a4;font:14px monospace;margin:0;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap}button{padding:12px;background:#304951;color:#f1dea7;border:1px solid #a59361}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:20px}article{padding:16px;background:#1c3038;border:1px solid #74684c}p{line-height:1.6}h1{font-size:24px}</style></head><body><h1>LEVEL 29 · CITY CAREERS</h1><p>Shared in-game catalog —36three-stage jobs. Preview only:accept jobs at dispatch in the game’s F4 journal.</p><nav><button data-filter="all">ALL JOBS</button><button data-filter="new">NEW BUSINESSES</button><button data-filter="existing">EXISTING DESTINATIONS</button></nav><main></main><script src="../city-career-catalog.js"></script><script>const C=level29CityCareerCatalog;function draw(filter){document.querySelector('main').replaceChildren();for(const j of C.JOBS){const isNew=C.BUSINESSES.some(b=>b.id===j.owner);if(filter==='new'&&!isNew||filter==='existing'&&isNew)continue;const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=j.name;p.textContent=j.owner.toUpperCase()+' · $'+j.reward+' game cash · '+j.stages.join(' → ');a.append(h,p);document.querySelector('main').appendChild(a);}}document.querySelectorAll('button').forEach(b=>b.onclick=()=>draw(b.dataset.filter));draw('all');</script></body></html>
