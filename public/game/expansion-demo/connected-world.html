<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aircraft / Interior Review</title><style>body{margin:0;background:#182d38;color:#edd9a4;font:13px monospace}aside{position:fixed;top:12px;left:12px;background:#000d;padding:14px;max-width:350px}button{padding:10px;min-height:44px;color:#e5d5a0;background:#28434a;border:1px solid #b79f65}</style></head><body><aside><h2>AIRCRAFT / FLOOR STREAMING REVIEW</h2><p>Shared original aircraft builder and floor-visibility manager. Not full-game controls, physics or device performance evidence.</p><button id="lift">LIFT / LAND</button><button id="floor">NEXT FLOOR</button><p id="status"></p></aside><script src="../three.min.js"></script><script>window.level29AircraftReview=true;window.level29InteriorReview=true;window.level29PosterReview=true;</script><script src="../estate-aircraft.js"></script><script>const aircraftAPI=level29AircraftModels;</script><script src="../streamed-interiors.js?v=1"></script><script src="../movie-posters.js?v=connected-world-1"></script><script type="module">
// Loading a shared CommonJS export in this review avoids installing game hooks.
</script><script>
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,1,2000),renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);scene.background=new THREE.Color('#8dacae');scene.add(new THREE.HemisphereLight('#eff0d8','#4d635c',1.1));const sun=new THREE.DirectionalLight('#ffe3bd',1);sun.position.set(100,200,50);scene.add(sun);const m=aircraftAPI.buildApache(THREE);scene.add(m.root);const ground=new THREE.Mesh(new THREE.BoxGeometry(240,2,220),new THREE.MeshStandardMaterial({color:'#7c8375',roughness:.9}));ground.position.y=-2;scene.add(ground);const pad=new THREE.Mesh(new THREE.BoxGeometry(110,.2,95),new THREE.MeshStandardMaterial({color:'#3b494a'}));scene.add(pad);camera.position.set(150,85,170);camera.lookAt(0,20,0);let lifting=false,time=0,floor=1;document.getElementById('lift').onclick=()=>lifting=!lifting;document.getElementById('floor').onclick=()=>floor=floor%10+1;const streamed=new level29InteriorModelsReview.SkyscraperBuilding(scene,THREE,{x:-140,y:-100,w:65,h:50},10);const makeFloor=i=>{const g=new THREE.Group();g.position.set(-100,(i-1)*8,-70);const slab=new THREE.Mesh(new THREE.BoxGeometry(65,2,50),new THREE.MeshStandardMaterial({color:i%2?'#ada68d':'#879f99'}));g.add(slab);return g;};streamed.transitionToFloor(1,makeFloor);function loop(){time+=1/60;m.rotor.rotation.y=time*30;m.tail.rotation.z=time*40;m.root.position.y+=( (lifting?55:0)-m.root.position.y)*.02;if(streamed.currentFloor!==floor)streamed.transitionToFloor(floor,makeFloor);document.getElementById('status').textContent='Original helicopter · floor '+floor+' / 10 · only selected slab visible';renderer.render(scene,camera);requestAnimationFrame(loop);}loop();
</script></body></html>
