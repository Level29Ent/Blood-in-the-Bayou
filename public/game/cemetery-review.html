<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creole cemetery review</title><style>body{margin:0;font:14px sans-serif;background:#b9ccd0}aside{position:fixed;top:12px;left:12px;padding:12px;background:#253b35ed;color:#eee1c4;max-width:340px}button{padding:12px;margin:3px}</style><aside>CREOLE CEMETERY<p>Production tomb models on a 288×256 review parcel.<br>Not full-city collision or mobile-performance proof.</p><button id="overview">OVERVIEW</button><button id="lane">LANE</button><button id="detail">TOMB DETAIL</button><p id="status"></p></aside><script src="three.min.js"></script><script src="creole-cemetery.js?v=tomb-lanes-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,2500),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#bfd0d5');scene.add(new T.HemisphereLight('#fff3db','#66725f',1.2));const sun=new T.DirectionalLight('#ffeacb',.85);sun.position.set(-130,350,190);scene.add(sun);document.body.appendChild(renderer.domElement);const model=level29CreoleCemetery.build(T,{x:0,y:0,w:288,h:256});scene.add(model.root);const views={overview:[[420,300,430],[144,0,125]],lane:[[144,17,248],[144,17,35]],detail:[[98,17,75],[100,14,40]]};function show(id){camera.position.set(...views[id][0]);camera.lookAt(...views[id][1]);renderer.render(scene,camera);document.getElementById('status').textContent=model.root.userData.cemetery.tombs+' tombs · five variants · central walking lane';}for(const id of Object.keys(views))document.getElementById(id).onclick=()=>show(id);show('overview');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show('overview');});
</script></html>
