<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City renewal model review</title><style>body{margin:0;background:#263e4a;color:#f4e5b3;font:14px monospace}#panel{position:fixed;top:10px;left:10px;right:10px;z-index:2;background:#0e2028ed;padding:12px;max-width:560px}button{min-height:44px;margin:4px;padding:8px;background:#2c4b55;color:#ead49d;border:1px solid #a9955b}canvas{display:block}</style></head><body><section id="panel">CITY RENEWAL · ISOLATED MODEL REVIEW<p>Not the full generated city or a device performance benchmark.</p><button id="boat">NATCHEZ CASINO</button><button id="skyline">ROADSIDE BUILDINGS</button><button id="stock">GREENMART STOCK</button><p id="status"></p></section><script src="three.min.js"></script><script>window.level29HubReview=true;window.level29RenewalReview=true;window.level29RetailReview=true;</script><script src="riverboat-hub.js?v=city-renewal-1"></script><script src="city-renewal.js?v=1"></script><script src="retail-stock.js?v=1"></script><script>
const T=THREE,r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(1.5,devicePixelRatio));r.setSize(innerWidth,innerHeight);r.outputEncoding=T.sRGBEncoding;document.body.appendChild(r.domElement);const scene=new T.Scene();scene.background=new T.Color('#7fa8b8');scene.add(new T.HemisphereLight('#fff0d0','#4c6562',1));const sun=new T.DirectionalLight('#ffedd0',.8);sun.position.set(50,300,100);scene.add(sun);const camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,1,3000),ground=new T.Mesh(new T.PlaneGeometry(2000,2000),new T.MeshLambertMaterial({color:'#57746f'}));ground.rotation.x=-Math.PI/2;ground.position.y=-2;scene.add(ground);let root,boat;const cache={};function show(kind){if(root)scene.remove(root);if(!cache[kind]){if(kind==='boat'){cache[kind]=level29HubReview.buildNatchezExterior(T,{x:0,y:0});}else if(kind==='skyline'){const g=new T.Group(),m=Object.fromEntries(['wall','roof','trim','window','door'].map((k,i)=>[k,new T.MeshLambertMaterial({color:['#a8a69a','#566971','#d0c7b0','#426a80','#6a5344'][i]})]));for(let i=0;i<4;i++)g.add(level29CityRenewal.building(T,{x:i*140,y:0,w:96,h:96,H:[42,112,164,240][i],kind:['home','apartment','office','tower'][i]},m));cache[kind]=g;}else{const g=new T.Group();g.add(level29RetailStock.stock(T,0),level29RetailStock.stock(T,56));cache[kind]=g;}}root=cache[kind];scene.add(root);const box=new T.Box3(),instance=new T.Matrix4(),world=new T.Matrix4();root.updateMatrixWorld(true);root.traverse(o=>{if(!o.isMesh)return;o.geometry.computeBoundingBox();if(o.isInstancedMesh){for(let i=0;i<o.count;i++){o.getMatrixAt(i,instance);world.multiplyMatrices(o.matrixWorld,instance);box.union(o.geometry.boundingBox.clone().applyMatrix4(world));}}else box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));});const center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3()),distance=Math.max(size.x,size.y,size.z)/Math.min(1,camera.aspect);camera.position.copy(center).add(new T.Vector3(distance*.7,distance*.5,distance*1.2));camera.lookAt(center);boat=root.userData.wheel;document.getElementById('status').textContent=kind==='boat'?'Natchez hull, three decks, galleries, chimneys and paddlewheel at the boarding landing':kind==='skyline'?'Home · apartment · office · skyscraper · shared instance batches':'Packaged goods on both Greenmart floors · five material batches per floor';}
for(const kind of ['boat','skyline','stock'])document.getElementById(kind).onclick=()=>show(kind);function loop(t){if(boat)boat.rotation.z=t*.0003;r.render(scene,camera);requestAnimationFrame(loop);}show('boat');requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});
</script></body></html>
