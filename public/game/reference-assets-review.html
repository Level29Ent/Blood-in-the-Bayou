<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original character and compressed PBR review</title><style>body{margin:0;background:#242c30;color:#eddbb4;font:12px monospace}#panel{position:fixed;left:12px;top:12px;z-index:2;background:#0b151de8;padding:10px;max-width:85vw}button{min-height:44px;background:#263e47;color:#f1dda3;border:1px solid #ac9457;margin:3px}pre{white-space:pre-wrap}</style></head><body><div id="panel">ORIGINAL STYLIZED ASSET REVIEW · Not photorealistic / not full gameplay<br><button id="turn">ROTATE CHARACTER</button><button id="release">RELEASE PBR MAPS</button><pre id="status">Loading actual GLB and Basis-compressed surfaces…</pre></div><script src="three.min.js"></script><script src="vendor/gltf-loader-r149.js"></script><script src="vendor/ktx2-loader-r149.js"></script><script src="texture-manager.js"></script><script>window.level29PBRReview=true;</script><script src="pbr-texture-bindings.js"></script><script>
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(1.5,devicePixelRatio));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.appendChild(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.01,50);scene.background=new THREE.Color('#4c5353');camera.position.set(2.3,1.4,3.7);camera.lookAt(.3,.95,0);scene.add(new THREE.HemisphereLight('#d7e6f1','#41403b',1));const sun=new THREE.DirectionalLight('#ffe3b3',2.2);sun.position.set(3,5,5);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(15,15),new THREE.MeshStandardMaterial({color:'#59605c',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);let model=null;const manager=new level29TextureManager.TextureManager(renderer),binder=new level29PBRReviewAPI.PBRBindings(manager),materials=[];let info={};
(async()=>{const gltf=await new BayouAssets.GLTFLoader().loadAsync('models/characters/ronniebaby.glb');model=gltf.scene;scene.add(model);const bounds=new THREE.Box3().setFromObject(model);let tris=0,meshes=0;model.traverse(o=>{if(o.isMesh){meshes++;tris+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;}});info.model={height:bounds.max.y-bounds.min.y,triangles:tris,groups:meshes,rigged:false};const manifest=await(await fetch('textures/pbr-manifest.json')).json();for(const [i,kind]of ['concrete','wood','fabric'].entries()){const mat=new THREE.MeshStandardMaterial({color:['#a3aaa0','#8b6241','#6d784e'][i],roughness:.85});materials.push(mat);const cube=new THREE.Mesh(new THREE.BoxGeometry(.42,.42,.42),mat);cube.position.set(.65+i*.5,.21,-.3);scene.add(cube);await binder.apply(mat,manifest[kind],{repeat:{wrap:THREE.RepeatWrapping,x:2,y:2}});}info.compressed=materials.every(m=>m.normalMap?.isCompressedTexture&&m.normalMap.mipmaps.length>1);info.formats=materials.map(m=>m.normalMap.format);info.mips=materials.map(m=>m.normalMap.mipmaps.length);paint();})().catch(e=>{document.getElementById('status').textContent='FAILED: '+e.message;});function paint(){document.getElementById('status').textContent=JSON.stringify({...info,manager:manager.stats,textures:renderer.info.memory.textures},null,2);}document.getElementById('turn').onclick=()=>{if(model)model.rotation.y+=Math.PI/2;};document.getElementById('release').onclick=()=>{binder.dispose();setTimeout(paint,100);};function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);function loop(){requestAnimationFrame(loop);renderer.render(scene,camera);}loop();
</script></body></html>
