<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repository GLB activation review</title><style>body{margin:0;background:#26353f;color:#eedeb1;font:13px monospace}#panel{position:fixed;top:12px;left:12px;z-index:2;background:#07131ceb;padding:12px;max-width:85vw}select,button{min-height:44px;background:#264049;color:#f0ddb2;border:1px solid #ba9f59;margin:4px}pre{white-space:pre-wrap}</style></head><body><div id="panel">REPOSITORY GLBs · ISOLATED LOADER / ACTOR REVIEW<br>Not full-city gameplay<br><select id="asset" aria-label="Model"><option value="characters/ronniebaby">Ronniebaby</option><option value="watercraft/bowrider">Bowrider</option><option value="watercraft/cruiser">Cruiser</option><option value="watercraft/pontoon">Pontoon</option><option value="watercraft/skiff">Skiff</option><option value="watercraft/fishing-boat">Uploaded fishing boat</option><option value="watercraft/steamboat">Steamboat</option></select><button id="turn">ROTATE</button><pre id="status">Loading…</pre></div><script src="three.min.js"></script><script src="vendor/gltf-loader-r149.js"></script><script>window.level29CharacterReview=true;</script><script src="ronnie-reference-model.js?v=portable-glb-1"></script><script>
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1500),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;scene.background=new THREE.Color('#42545e');scene.add(new THREE.HemisphereLight('#d1e7f6','#4b4a3d',1));const light=new THREE.DirectionalLight('#ffe7bf',1.5);light.position.set(50,150,90);scene.add(light);document.body.appendChild(renderer.domElement);const floor=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({color:'#5c6b69',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-1;scene.add(floor);const loader=new BayouAssets.GLTFLoader(),templates=new Map();let current=null,sequence=0,wheel=null;
async function show(){const key=document.getElementById('asset').value,token=++sequence;document.getElementById('status').textContent='LOADING '+key;try{let t=templates.get(key);if(!t){const url=key.startsWith('characters')?level29CharacterReview.modelURL(document.baseURI):new URL('models/'+key+'.glb',document.baseURI).href;const g=await loader.loadAsync(url);t=g.scene;templates.set(key,t);}if(token!==sequence)return;if(current)scene.remove(current);if(key.startsWith('characters')){const root=new THREE.Group(),body=new THREE.Group(),ring=new THREE.Mesh(new THREE.RingGeometry(7,8,24),new THREE.MeshBasicMaterial({color:'#d3b35d',side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.15;body.add(new THREE.Mesh(new THREE.BoxGeometry(4,10,4),new THREE.MeshBasicMaterial()));root.userData={body,ring};root.add(body,ring);level29CharacterReview.install(THREE,root,t);current=root;}else current=t.clone(true);scene.add(current);wheel=current.getObjectByName('paddleWheel');const b=new THREE.Box3().setFromObject(current),s=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3()),size=Math.max(s.x,s.y,s.z);camera.position.copy(center).add(new THREE.Vector3(size*.9,size*.6,size*1.2));camera.lookAt(center);document.getElementById('status').textContent=JSON.stringify({loaded:key,assetCached:templates.size,staticModel:true,legacyBodyHidden:current.userData.body?current.userData.body.visible===false:undefined,metresToGameScale:current.userData.referenceModel?.scale.x,paddleWheel:!!wheel,dimensions:s},null,2);}catch(e){document.getElementById('status').textContent='FAILED: '+e.message;}}
document.getElementById('asset').onchange=show;document.getElementById('turn').onclick=()=>{if(current)current.rotation.y+=Math.PI/2;};function loop(){requestAnimationFrame(loop);if(wheel)wheel.rotation.z-=.015;renderer.render(scene,camera);}show();loop();addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></body></html>
