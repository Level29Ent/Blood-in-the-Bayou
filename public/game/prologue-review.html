<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Before the Bayou · component review</title><style>
body{margin:0;background:#17252d;color:#f0dfaf;font:13px/1.5 monospace}canvas{display:block}#panel{position:fixed;z-index:2;left:10px;right:10px;top:10px;background:#0c2029eb;padding:12px;max-width:570px;max-height:40dvh;overflow:auto;border:1px solid #a18a50}h1{font:700 20px sans-serif;margin:0 0 6px}p{margin:6px 0}button{min-height:44px;margin:4px 4px 4px 0;padding:8px;color:#f0dfaf;background:#28414a;border:1px solid #ad965d}#film{position:fixed;z-index:3;inset:0;padding:20px;background:#07131cf5;box-sizing:border-box;overflow:auto}#film[hidden]{display:none}iframe{width:100%;aspect-ratio:16/9;max-height:65vh;border:0}small{color:#b8ced2}
</style></head><body><section id="panel"><h1>BEFORE THE BAYOU · COMPONENT REVIEW</h1><small>Isolated crowd/float renderer and story state machine. Not full-city gameplay, escort pathing or a device performance benchmark.</small><p id="checkpoint"></p><p id="description"></p><button id="next">NEXT CHECKPOINT</button><button id="reset">RESET STORY</button><button id="play" hidden>PLAY THIS SCENE</button><p id="stats"></p></section><section id="film" hidden><h2 id="filmTitle"></h2><div id="mount"></div><button id="skip">SKIP SCENE / CONTINUE</button><button id="close">CLOSE</button></section><script src="three.min.js"></script><script src="prologue-story.js?v=1"></script><script src="prologue-crowd.js?v=1"></script><script>
'use strict';
const S=level29PrologueStory,C=level29PrologueCrowd,renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(1.5,devicePixelRatio));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#8daeb8');scene.add(new THREE.HemisphereLight('#f0e7cc','#4c5554',1));const sun=new THREE.DirectionalLight('#ffeac3',.7);sun.position.set(80,160,40);scene.add(sun);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,1,2000);camera.position.set(460,360,560);camera.lookAt(150,0,160);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),new THREE.MeshLambertMaterial({color:'#545e60'}));floor.rotation.x=-Math.PI/2;floor.position.y=-.2;scene.add(floor);
const W=30,mask=new Uint8Array(W*W);for(let y=2;y<25;y++)for(let x=2;x<25;x++)mask[y*W+x]=1;const nav={mask,point:k=>({x:(k%W+.5)*32-250,y:(Math.floor(k/W)+.5)*32-250}),nearest:(x,y)=>Math.floor((y+250)/32)*W+Math.floor((x+250)/32)};
const route=S.paradeRoute(nav,{x:100,y:100},W,26,2),crowd=C.create(THREE,104);scene.add(crowd);const floats=Array.from({length:5},(_,i)=>C.floatModel(THREE,i));floats.forEach(f=>scene.add(f));const residents=Array.from({length:38},(_,id)=>({id,x:-100+(id%6)*50,y:-60+Math.floor(id/6)*60,a:0,anim:0,cheer:true,wait:999})),marchers=Array.from({length:66},(_,i)=>({id:1000+i,festival:true}));let progress=S.fresh();
function updatePanel(){const s=S.STAGES[progress.stage];document.getElementById('checkpoint').textContent=s?'CHECKPOINT '+(progress.stage+1)+' / '+S.STAGES.length+' · '+s.title:'ORIGINAL CAMPAIGN HANDOFF';document.getElementById('description').textContent=s?s.action:'The prologue is complete; gameplay starts the original campaign.';document.getElementById('play').hidden=!s?.video;document.getElementById('next').disabled=!s;}
function advance(){const s=S.STAGES[progress.stage];progress=S.step(progress,s?.video?'videoDone':'interact');closeFilm();updatePanel();}
function closeFilm(){document.getElementById('mount').replaceChildren();document.getElementById('film').hidden=true;}
document.getElementById('next').onclick=advance;document.getElementById('reset').onclick=()=>{progress=S.fresh();closeFilm();updatePanel();};document.getElementById('play').onclick=()=>{const s=S.STAGES[progress.stage];if(!s?.video)return;document.getElementById('filmTitle').textContent=s.title;const f=document.createElement('iframe');f.src=S.embedURL(s.video,location.origin);f.title=s.title;f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';document.getElementById('mount').replaceChildren(f);document.getElementById('film').hidden=false;};document.getElementById('skip').onclick=advance;document.getElementById('close').onclick=closeFilm;addEventListener('message',e=>{const f=document.querySelector('iframe');if(f&&S.videoEnded(e,f.contentWindow))advance();});
function loop(now){const t=now/1000;for(let i=0;i<marchers.length;i++)Object.assign(marchers[i],S.routePoint(route,t*14+i*12),{anim:t*6+i});for(const a of residents)a.anim=t*3+a.id;C.pose(THREE,crowd,[...marchers,...residents],()=>0);floats.forEach((f,i)=>{const p=S.routePoint(route,t*14+i*140+70);f.position.set(p.x,0,p.y);f.rotation.y=-p.a;});renderer.render(scene,camera);document.getElementById('stats').textContent='66 marching residents · 38 cheering spectators · 5 floats · '+renderer.info.render.calls+' draw calls';requestAnimationFrame(loop);}updatePanel();requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
