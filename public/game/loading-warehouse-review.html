<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warehouse review</title><style>body{margin:0;background:#707b7c;font:13px sans-serif;color:white}canvas{display:block}aside{position:fixed;z-index:2;top:10px;left:10px;padding:12px;background:#20343dea;max-width:340px}button{min-height:44px;padding:10px;margin:3px;background:#33536a;color:white;border:1px solid #ce9b64}</style></head><body><aside><b>BAYOU LOADING WAREHOUSE</b><p>Production interior at actual footprint. Isolated review—not full-city contracts or driveable forklifts.</p><button id="entry">ENTRY AISLE</button><button id="racks">PALLET RACKS</button><button id="packing">PACK / DISPATCH</button><button id="forklift">FORKLIFT</button><p id="status"></p></aside><script src="three.min.js"></script><script src="loading-warehouse.js?v=warehouse-reference-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,1200),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#aab5b4');scene.add(new T.HemisphereLight('#fff4de','#596c70',1.1));const light=new T.DirectionalLight('#fff6e8',.8);light.position.set(50,100,200);scene.add(light);document.body.appendChild(renderer.domElement);const b={x:0,y:0,w:288,h:224},store=level29LoadingWarehouse.build(T,b);scene.add(store.root);const shell=new T.Group(),m=new T.MeshStandardMaterial({color:'#bbc4bf'});for(const [w,h,d,x,y,z]of [[288,52,1,144,26,.5],[1,52,224,.5,26,112],[1,52,224,287.5,26,112],[288,1,224,144,52,112]]){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);shell.add(o);}scene.add(shell);const views={entry:[[144,23,217],[144,23,30]],racks:[[144,24,130],[84,26,48]],packing:[[144,23,214],[73,12,177]],forklift:[[144,24,213],[212,14,185]]};function view(n){const[a,b]=views[n];camera.position.set(...a);camera.lookAt(...b);renderer.render(scene,camera);document.getElementById('status').textContent=store.root.userData.warehouse.pallets+' pallets · '+store.root.userData.warehouse.cartons+' cartons · '+store.root.userData.warehouse.wrappedLoads+' wrapped loads';}for(const n of Object.keys(views))document.getElementById(n).onclick=()=>view(n);view('entry');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);view('entry');});
</script></body></html>
