<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blackwater Sawmill log yard review</title><style>body{margin:0;background:#8a9d9a;color:#eee4c7;font:14px system-ui}canvas{display:block}section{position:fixed;top:12px;left:12px;max-width:395px;padding:12px;background:#233e37ed;border:1px solid #b8a079}button{min-height:44px;padding:8px;margin:3px;background:#e8dec0;color:#203d36;border:1px solid #a28a60}p{margin:8px 0}</style></head><body><section><strong>BLACKWATER SAWMILL · LOG YARD</strong><p>Production yard in the original parcel. Review cameras only; no city terrain, foreman or contract gameplay.</p><button id="yard">LOG YARD</button><button id="logs">LOG DETAIL</button><button id="mill">MILL SHEDS</button><button id="crane">GANTRY / INFEED</button><button id="aerial">AERIAL</button><p id="status"></p></section><script src="three.min.js"></script><script src="sawmill-yard.js?v=reference-sawmill-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,1500),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#afcbd0');scene.add(new T.HemisphereLight('#fff2d7','#5a6657',1.15));const sun=new T.DirectionalLight('#fff0cb',.85);sun.position.set(-70,180,140);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29SawmillYard.build(T,{x:0,y:0,w:224,h:192});scene.add(d.root);let current='yard';function show(view){current=view;const v={yard:[[112,19,189],[112,24,63]],logs:[[103,16,170],[48,11,130]],mill:[[112,21,85],[151,21,27]],crane:[[112,24,171],[110,51,87]],aerial:[[285,190,270],[112,12,94]]}[view];camera.position.set(...v[0]);camera.lookAt(...v[1]);renderer.render(scene,camera);document.getElementById('status').textContent=d.root.userData.sawmill.logs+' bark-textured logs · growth-ring ends · processing sheds · overhead crane · clear haul lane';}for(const id of ['yard','logs','mill','crane','aerial'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
