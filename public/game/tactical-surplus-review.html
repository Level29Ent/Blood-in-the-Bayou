<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perimeter Tactical Surplus review</title><style>body{margin:0;background:#353e34;color:#eee5cc;font:14px system-ui}canvas{display:block}section{position:fixed;top:12px;left:12px;max-width:390px;padding:12px;background:#20352eed;border:1px solid #b5a178}button{min-height:44px;margin:3px;padding:8px;background:#e5ddc3;color:#26382f;border:1px solid #a5946b}p{margin:8px 0}</style></head><body><section><strong>PERIMETER TACTICAL SURPLUS</strong><p>Production stock in the existing 128 × 128 shop. Review cameras only; no city shell, attendant or shop UI.</p><button id="store">STORE</button><button id="boots">BOOT WALL</button><button id="bags">FIELD GEAR</button><button id="racks">CLOTHING / BINS</button><button id="accessories">ACCESSORIES</button><p id="status"></p></section><script src="three.min.js"></script><script src="tactical-surplus-interior.js?v=reference-surplus-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#adb5aa');scene.add(new T.HemisphereLight('#fff6df','#60716a',1.25));const light=new T.DirectionalLight('#fff2d9',.65);light.position.set(50,140,120);scene.add(light);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29TacticalSurplus.build(T,{x:0,y:0,w:128,h:128});scene.add(d.root);let current='store';function show(view){current=view;const v={store:[[64,18,123],[64,23,24]],boots:[[17,23,109],[7,22,57]],bags:[[112,22,111],[120,24,57]],racks:[[64,19,114],[28,20,77]],accessories:[[64,20,120],[99,20,96]]}[view];camera.position.set(...v[0]);camera.lookAt(...v[1]);renderer.render(scene,camera);const s=d.root.userData.surplus;document.getElementById('status').textContent=s.boots+' boots · '+s.pouches+' wall bags · '+s.garments+' hanging garments · clear service aisle';}for(const id of ['store','boots','bags','racks','accessories'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
