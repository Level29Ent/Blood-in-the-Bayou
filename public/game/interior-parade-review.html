<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interior finishes and street-wide parade review</title><style>body{margin:0;background:#171d1a;color:#eee6cf;font:14px sans-serif}canvas{display:block}section{position:fixed;top:10px;left:10px;padding:12px;background:#10221be8;z-index:2;max-width:520px}button{min-height:44px;padding:10px;margin:3px;background:#254731;color:#f2edda;border:1px solid #9fb65b}p{margin:6px 0}</style></head><body><section><strong>BLOOD IN THE BAYOU · VISUAL COMPONENT REVIEW</strong><p>Production materials, Karma model, finish decorator and parade formation. Not full-city gameplay or a phone performance benchmark.</p><button id="karma">KARMA</button><button id="home">HOME INTERIOR</button><button id="shop">SHOP INTERIOR</button><button id="parade">STREET-WIDE PARADE</button><button id="npc">NPC CLOSE-UP</button><button id="women">WOMEN NPCs</button><button id="locs">LONG HAIR / LOCS</button><p id="status"></p></section><script src="three.min.js"></script><script src="interior-realism.js?v=1"></script><script src="karma-model.js?v=realism-2"></script><script src="prologue-story.js?v=city-renewal-1"></script><script src="festival-spectacle.js?v=1"></script><script src="npc-appearance.js?v=locs-3"></script><script src="prologue-crowd.js?v=locs-5"></script><script>
const T=THREE,F=level29InteriorRealism,C=level29PrologueCrowd,S=level29PrologueStory,renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.appendChild(renderer.domElement);const scene=new T.Scene(),camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.05,3000);let root,mode,crowd,actors,shape,floats,roadRoute;

function show(next){mode=next;if(root){scene.remove(root);const gs=new Set(),ms=new Set();root.traverse(o=>{if(o.geometry)gs.add(o.geometry);for(const m of Array.isArray(o.material)?o.material:[o.material])if(m)ms.add(m);});gs.forEach(g=>g.dispose());ms.forEach(m=>m.dispose());}root=new T.Group();scene.add(root);scene.background=new T.Color(next==='parade'?'#9fc1cc':'#18201b');
 if(next==='karma'){root.add(level29KarmaModel.buildKarma(T).root);camera.position.set(-.6,1.7,6.7);camera.lookAt(0,1.65,-5.5);document.getElementById('status').textContent='Karma · fine-grain finishes, thin clearcoat glass, cylindrical jars, register, receipts, ventilation and ceiling illumination';}
 else if(next==='npc'||next==='women'||next==='locs'){crowd=C.create(T,8);root.add(crowd);actors=Array.from({length:8},(_,i)=>({id:next==='locs'?[2009,2010,2011,2012,2013,2014,2015,2008][i]:next==='women'?2001+i*2:2000+i,...C.character(next==='locs'?[2009,2010,2011,2012,2013,2014,2015,2008][i]:next==='women'?2001+i*2:2000+i),x:(i%4)*12-18,y:Math.floor(i/4)*18,a:Math.PI/2,anim:0,wait:999,cheer:i<4,reaction:['wave','clap','dance','watch'][i%4]}));C.pose(T,crowd,actors,()=>0);camera.position.set(7,19,51);camera.lookAt(0,15,5);document.getElementById('status').textContent=(next==='locs'?'Long-haired women and African American women / men with short, shoulder-length, long and tied locs · ':next==='women'?'Women residents / parade audience · bob, ponytail, bun and natural hairstyles · ':'Mixed women and men · ')+'Shared nine-batch crowd renderer · modeled jaw, ears, nose, eyes, brows, lips, hair and hands · PBR cloth · not GLB/photographic scans';}
 else if(next==='parade'){const asphalt=F.material(T,'#505859','paint'),sidewalk=F.material(T,'#c4bfb1','paint');box(1500,2,128,500,-1,0,asphalt);for(const z of [-90,90])box(1500,2,52,500,0,z,sidewalk);for(let x=-200;x<1200;x+=32)box(14,.12,1.2,x,.12,0,new T.MeshBasicMaterial({color:'#c2aa55'}));roadRoute=[{x:-160,y:0},{x:1300,y:0}];const tile=(x,y)=>Math.abs(y)<64?1:Math.abs(y)<116?2:0;shape=C.formation(roadRoute,S.routePoint,tile,()=>false);crowd=C.create(T,768);root.add(crowd);actors=C.procession();root.userData.audience=C.spectators([{x:-160,y:0},{x:1300,y:0},{x:1314,y:0},{x:-160,y:0}],tile,()=>false,384);floats=Array.from({length:5},(_,i)=>{const g=C.floatModel(T,i);g.scale.z=1.45;root.add(g);return g;});camera.position.set(100,125,205);camera.lookAt(310,0,0);document.getElementById('status').textContent='Curb-to-curb marching ranks · 330 authored marcher slots · 5 wider floats · 768-person render cap · up to 384 sidewalk spectators';}
 else{const home=next==='home',b={x:0,y:0,w:160,h:192},wall=F.material(T,home?'#a8a297':'#858f87'),wood=F.material(T,'#765a41','wood'),metal=F.material(T,'#73817c','metal'),cloth=F.material(T,'#657c73','fabric');box(160,1,192,80,-.5,96,F.material(T,home?'#ac9273':'#cbc4b3',home?'wood':'marble'));box(160,44,3,80,22,0,wall);for(const x of [0,160])box(3,44,192,x,22,96,wall);root.add(F.decorate(T,b,{theme:home?'home':'public'}));
 if(home){box(44,8,18,32,5,62,cloth);box(44,17,3,32,12,54,cloth);for(const x of [12,52])box(4,14,20,x,10,62,wood);box(30,2,22,90,10,104,wood);for(const x of [78,102])for(const z of [96,112])box(1,10,1,x,5,z,metal);box(7,2,5,91,12,104,F.material(T,'#bda17a','fabric'));}
 else{for(const x of [14,146])for(const y of [5,14,23]){box(18,1,70,x,y,58,wood);for(let i=0;i<6;i++){box(8,7,7,x,y+4,30+i*11,F.material(T,['#9b8063','#708c71','#8d7077'][i%3]));}}box(60,12,15,82,6,32,wood);box(62,1,17,82,12.7,32,metal);box(9,7,1,88,18,31,metal);}
 camera.position.set(80,19,178);camera.lookAt(80,18,30);document.getElementById('status').textContent=(home?'Home':'Shop')+' · shared PBR finishes, skirting, crown trim, door casing, wall lighting, framed board and ventilation. Viewer furniture is illustrative.';}}
for(const name of ['karma','home','shop','parade','npc','women','locs'])document.getElementById(name).onclick=()=>show(name);show('karma');function draw(now){if(mode==='npc'||mode==='women'||mode==='locs'){for(const a of actors)a.anim=now/1000*3+a.id;C.pose(T,crowd,actors,()=>0);}if(mode==='parade'){const t=now/1000,visible=[];for(const a of actors){const p=C.formationPoint(shape,t*14+a.unit*220+140+a.row*14,a.column,a.columns);Object.assign(a,p,{anim:t*6+a.id});if(p.visible)visible.push(a);}for(const a of root.userData.audience)visible.push({...a,anim:t*3+a.id});C.pose(T,crowd,visible.slice(0,768),()=>1);floats.forEach((f,i)=>{const p=C.formationPoint(shape,t*14+i*220+70,0,1);f.visible=p.floatClear;f.position.set(p.x,1,p.y);f.rotation.y=-p.a;});}renderer.render(scene,camera);requestAnimationFrame(draw);}requestAnimationFrame(draw);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
