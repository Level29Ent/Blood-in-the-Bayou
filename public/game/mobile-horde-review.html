<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile distant zombie renderer review</title><style>body{margin:0;background:#10191c;color:#eed6a4;font:13px monospace}#panel{position:fixed;left:10px;top:10px;background:#071116dd;padding:12px;max-width:90vw;z-index:3}canvas{display:block}</style><div id="panel">Synthetic 48-zombie LOD review—not full-city gameplay.<p id="stats"></p></div><script src="three.min.js"></script><script>window.level29HordeReview=true;</script><script src="survival-instances.js?v=mobile-road-fix-1"></script><script>
const T=THREE,r=new T.WebGLRenderer({antialias:false});r.setPixelRatio(.85);r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);const s=new T.Scene();s.background=new T.Color('#657e89');s.add(new T.HemisphereLight('#dfe5df','#344b34',1));const cam=new T.PerspectiveCamera(65,innerWidth/innerHeight,1,1200);cam.position.set(160,110,330);cam.lookAt(140,10,80);const h=level29HordeReview.createHorde(T,48);s.add(h);const zs=Array.from({length:48},(_,i)=>({x:(i%8)*35,y:Math.floor(i/8)*32,a:1.3,anim:0,type:i%5?'walker':'runner',alive:true}));function tick(t){zs.forEach((z,i)=>z.anim=t*.003+i);level29HordeReview.pose(T,h,zs,()=>0);r.render(s,cam);document.getElementById('stats').textContent='Actors:48 · Draw calls:'+r.info.render.calls+' · Pixel ratio:'+r.getPixelRatio();requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
