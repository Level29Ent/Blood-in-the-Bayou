<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natchez prompt layout review</title><link rel="stylesheet" href="casino-controls.css"><link rel="stylesheet" href="hud-prompts.css?v=1"><style>body{margin:0;background:#344e4e;color:#f0dfad;font:14px/1.45 monospace}h1{font-size:18px}header{margin:12px;max-width:70vw}button{min-height:44px;background:#132c35;color:#f0dfad;border:1px solid #baad7b;padding:10px}#prologueAction{position:fixed;left:50%;bottom:210px;transform:translateX(-50%)}#interactionTutorial{position:fixed;left:12px;bottom:100px;z-index:87;width:min(360px,calc(100vw - 24px));max-height:42dvh;overflow:auto;box-sizing:border-box;padding:14px;background:#10231bea;border:1px solid #bead7b;font:14px/1.45 system-ui}#interactionTutorial h3{margin:0}#interactionTutorial button{margin:3px}#nolaEquipmentActions{position:fixed;right:12px;bottom:80px}#experienceButton{position:fixed;right:12px;bottom:12px}</style></head><body><header><h1>Natchez prompt layout review</h1><p>Isolated HUD fixture using the live prompt controller and CSS, not gameplay footage.</p><label><input id="story" type="checkbox" checked> Story contact nearby</label> <label><input id="build" type="checkbox" checked> Construction hint</label> <button id="pause">Pause / resume</button><p id="layoutResult" role="status"></p></header><aside id="interactionTutorial"><h3>1 / 7 · Move around</h3><p>W / S / A / D to walk; Shift to sprint; Space to jump. On touch, drag the left movement stick. Walk a few steps.</p><button>WAITING FOR ACTION</button><button>SKIP STEP</button><button>CLOSE</button></aside><button id="prologueAction">E · Talk to Sam Butcher</button><div id="riverboatControls" style="display:block"><button id="riverboatControlsToggle">CASINO</button></div><div id="nolaEquipmentActions"><button>FIREWORK · F10</button><button>FLARE GUN · F11</button></div><button id="experienceButton">SETTINGS / JOURNAL</button><script>var state='play',showMap=false,player={dead:false};function render(){level29HudPrompts.set('boat','BOOMCITY CASINO · PRESS U OR TAP CASINO');level29HudPrompts.set('downtown','E · BOOMCITY RIVERBOAT · GAMING / TRADE');if(document.getElementById('build').checked)level29HudPrompts.set('construction','Y · CONSTRUCT · GREENHOUSE ($12500) · X · PLACE · T · GRID ON');}document.getElementById('story').onchange=e=>document.getElementById('prologueAction').hidden=!e.target.checked;document.getElementById('pause').onclick=()=>state=state==='play'?'pause':'play';</script><script src="hud-prompts.js?v=1"></script><script>function tick(){render();const dock=document.getElementById('hudPromptStack'),rows=[...dock.children].filter(e=>!e.hidden&&getComputedStyle(e).display!=='none'),rects=rows.map(e=>e.getBoundingClientRect());let clean=rows.every(e=>e.scrollWidth<=e.clientWidth+1);for(let i=1;i<rects.length;i++)clean=clean&&rects[i].top>=rects[i-1].bottom+7;const tip=document.getElementById('interactionTutorial').getBoundingClientRect(),r=dock.getBoundingClientRect();clean=clean&&(tip.right<=r.left||tip.left>=r.right||tip.bottom<=r.top||tip.top>=r.bottom);document.getElementById('layoutResult').textContent=dock.hidden?'PAUSED · prompts hidden':(clean?'PASS':'FAIL')+' · prompt rows separated, wrapped and clear of tutorial';requestAnimationFrame(tick);}tick();</script></body></html>
