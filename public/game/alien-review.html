<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night visitor appearance review</title><style>body{margin:0;background:#1e2d33;color:#f2e7cd;font:14px sans-serif}aside{position:fixed;left:12px;top:12px;padding:12px;background:#122126ee;max-width:310px}button{min-height:44px;padding:10px;margin:3px}</style><aside>NIGHT VISITORS<p>Actual encounter models · static appearance review. Not full-city combat or phone-performance verification.</p><button id="lineup">LINEUP</button><button id="slate">SLATE</button><button id="sand">SAND</button><button id="sage">SAGE</button><button id="ribbed">RIBBED</button><button id="profile">PROFILE</button></aside><script src="three.min.js"></script><script>window.level29UFOPreviewOnly=true;</script><script src="ufo-night.js?v=reference-visitors-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;scene.background=new T.Color('#26383e');document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight('#dfedf3','#405052',1.1));for(const [x,c,i]of[[-60,'#d3edf9',1.4],[70,'#d2b18f',1]]){const l=new T.DirectionalLight(c,i);l.position.set(x,80,70);scene.add(l);}const data=level29UFOBuilder.makeModels(T);data.root.visible=true;data.craft.visible=false;data.beam.visible=false;scene.add(data.root);for(const [i,a]of data.aliens.entries())a.mesh.position.set((i-1.5)*15,0,0);const ground=new T.Mesh(new T.PlaneGeometry(200,120).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:'#34424a',roughness:1}));ground.position.y=-.1;scene.add(ground);let selected='lineup';const views={lineup:[[55,31,103],[0,13,0]],slate:[[-18,22,38],[-22.5,18,0]],sand:[[-3,22,38],[-7.5,18,0]],sage:[[12,22,38],[7.5,18,0]],ribbed:[[27,22,38],[22.5,18,0]],profile:[[60,22,10],[22.5,18,0]]};function show(id){selected=id;data.aliens.forEach((a,i)=>a.mesh.visible=id==='lineup'||i===({slate:0,sand:1,sage:2,ribbed:3,profile:3}[id]));camera.position.set(...views[id][0]);camera.lookAt(...views[id][1]);renderer.render(scene,camera);}for(const id of Object.keys(views))document.getElementById(id).onclick=()=>show(id);show('lineup');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(selected);});
</script></html>
