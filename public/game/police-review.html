<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Police station interior review</title><style>body{margin:0;background:#bdc8c7;color:#f7f1da;font:14px system-ui}canvas{display:block}section{position:fixed;top:12px;left:12px;max-width:390px;padding:12px;background:#143548ed;border:1px solid #a9bab8}button{min-height:44px;padding:8px;margin:3px;background:#e4dfcd;color:#183849;border:1px solid #adb9b4}p{margin:8px 0}</style></head><body><section><strong>POLICE · PUBLIC RECEPTION / HOLDING</strong><p>Production furnishings and cells. Review cameras only; no city shell, staff, captives or service UI.</p><button id="lobby">LOBBY</button><button id="reception">RECEPTION</button><button id="corridor">CELL CORRIDOR</button><button id="cell">CELL INTERIOR</button><button id="evidence">EVIDENCE / WAITING</button><p id="status"></p></section><script src="three.min.js"></script><script src="police-interior.js?v=reference-police-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#bcc6c4');scene.add(new T.HemisphereLight('#fff8e5','#73828a',1.2));const sun=new T.DirectionalLight('#fff6e7',.65);sun.position.set(60,180,180);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29PoliceInterior.build(T,{x:0,y:0,w:256,h:224});scene.add(d.root);let current='lobby';function show(view){current=view;const v={lobby:[[128,18,210],[123,23,62]],reception:[[107,18,113],[107,24,62]],corridor:[[154,18,211],[184,22,112]],cell:[[190,19,144],[228,20,116]],evidence:[[114,18,198],[26,20,130]]}[view];camera.position.set(...v[0]);camera.lookAt(...v[1]);renderer.render(scene,camera);document.getElementById('status').textContent='Glass enquiries counter · 2 secured cells · 4 bunks · unchanged police services';}for(const id of ['lobby','reception','corridor','cell','evidence'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
