<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home interiors review</title><style>body{margin:0;background:#a9b7ae;color:#fff1d8;font:14px system-ui}canvas{display:block}section{position:fixed;top:10px;left:10px;padding:12px;background:#283d36ed;max-width:340px}button,select{min-height:44px;margin:3px;padding:8px}p{margin:6px 0}</style><section><strong>PHOTO-INSPIRED HOME INTERIORS</strong><p>Production furnishings only. Shell front hidden for inspection; no live service UI or NPCs.</p><label>Style <select id="style"></select></label><button id="room">SAFEHOUSE / APARTMENT</button><button id="view">ROOM / OVERHEAD</button><p id="caption"></p></section><script src="three.min.js"></script><script src="home-lounges.js?v=reference-homes-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(64,innerWidth/innerHeight,.1,900),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#b8c6be');scene.add(new T.HemisphereLight('#fff2dd','#718473',1.3));const sun=new T.DirectionalLight('#ffeaca',.7);sun.position.set(30,140,170);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);let root=null,style=0,apartment=false,overhead=false;const sel=document.getElementById('style');for(const[s,p]of level29HomeLounges.STYLES.entries()){const o=document.createElement('option');o.value=s;o.textContent=p.name;sel.append(o);}function show(){if(root){scene.remove(root);root.traverse(o=>{if(o.isInstancedMesh)o.dispose();});}const b={x:0,y:0,w:apartment?152:192,h:apartment?216:160},ceiling=apartment?28:48;root=level29HomeLounges.build(T,b,{style,ceiling}).root;scene.add(root);camera.position.set(b.w*.52,overhead?220:ceiling*.55,overhead?b.h*.55:b.h+15);camera.lookAt(b.w/2,overhead?0:ceiling*.36,overhead?b.h*.54:b.h*.37);document.getElementById('caption').textContent=(apartment?'28-unit streamed apartment':'48-unit safehouse')+' · '+level29HomeLounges.STYLES[style].name;renderer.render(scene,camera);}sel.onchange=()=>{style=Number(sel.value);show();};document.getElementById('room').onclick=()=>{apartment=!apartment;show();};document.getElementById('view').onclick=()=>{overhead=!overhead;show();};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show();});show();
