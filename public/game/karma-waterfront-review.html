<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karma, Natchez and surface-road component review</title><style>body{margin:0;background:#111;color:#e5dfc5;font:14px sans-serif}canvas{display:block}section{position:fixed;top:10px;left:10px;padding:12px;background:#10221be8;z-index:2;max-width:520px}button{min-height:44px;padding:10px;margin:3px;background:#254731;color:#f2edda;border:1px solid #9fb65b}p{margin:6px 0}</style></head><body><section><strong>BLOOD IN THE BAYOU · COMPONENT REVIEW</strong><p>Production Karma / Natchez models and road height provider. Not the full game or a driving test.</p><button id="karma">KARMA INTERIOR</button><button id="boat">NATCHEZ</button><button id="road">SURFACE ROAD</button><p id="status"></p></section><script src="three.min.js"></script><script>window.level29HubReview=true;window.level29RoadReview=true;</script><script src="karma-model.js?v=1"></script><script src="riverboat-hub.js?v=natchez-transform-1"></script><script src="foundation-road.js?v=surface-roads-1"></script><script>
const T=THREE,renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;document.body.appendChild(renderer.domElement);const scene=new T.Scene(),camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.05,2500);let root,mode;
scene.add(new T.HemisphereLight('#fff2df','#344139',1.2));const sun=new T.DirectionalLight('#fff4df',1.4);sun.position.set(0,20,5);scene.add(sun);

 if(next==='karma'){const m=level29KarmaModel.buildKarma(T);root.add(m.root);camera.position.set(0,1.8,6.8);camera.lookAt(0,1.6,-5.8);document.getElementById('status').textContent='Karma · black walls, marble-look tile, glass counters, green rugs, timber feature wall and skeleton décor';}
 else if(next==='boat'){const m=level29HubReview.buildNatchezExterior(T,{x:0,y:0});root.add(m);const sea=new T.Mesh(new T.PlaneGeometry(2000,2000),new T.MeshStandardMaterial({color:'#366c7d',roughness:.4}));sea.rotation.x=-Math.PI/2;sea.position.y=-3;root.add(sea);const dock=new T.Mesh(new T.BoxGeometry(100,2,80),new T.MeshStandardMaterial({color:'#967d56'}));dock.position.set(-30,0,0);root.add(dock);camera.position.set(-65,75,245);camera.lookAt(180,49,0);document.getElementById('status').textContent='Natchez · intact hull, three galleries, chimneys and attached stern paddlewheel. Production batching position parity is tested.';}
 else {const B={left:0,right:600,top:0,bottom:600};for(let x=0;x<600;x+=24){const h=level29RoadReview.deckHeight(B,x,0),m=new T.Mesh(new T.BoxGeometry(24,3,156),new T.MeshStandardMaterial({color:'#343e43'}));m.position.set(x+12,h-1.5,0);root.add(m);for(const z of [-68,0,68]){const p=new T.Mesh(new T.BoxGeometry(z?24:14,.12,1.4),new T.MeshBasicMaterial({color:z?'#ddd9c4':'#d2ae55'}));p.position.set(x+12,h+.16,z);root.add(p);}}const ground=new T.Mesh(new T.PlaneGeometry(1800,1800),new T.MeshStandardMaterial({color:'#637550'}));ground.rotation.x=-Math.PI/2;ground.position.y=-3;root.add(ground);camera.position.set(-70,65,140);camera.lookAt(240,0,0);document.getElementById('status').textContent='Former interstate · ground-level pavement, no elevated decks, concrete walls or support pillars';}}
for(const name of ['karma','boat','road'])document.getElementById(name).onclick=()=>show(name);show('karma');function draw(){renderer.render(scene,camera);requestAnimationFrame(draw);}draw();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
