<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crescent Shine wash tunnel review</title><style>body{margin:0;background:#d6e1e1;color:#eef7ee;font:14px system-ui}canvas{display:block}section{position:fixed;top:12px;left:12px;max-width:400px;padding:12px;background:#12384dea;border:1px solid #a7d5e2}button{min-height:44px;padding:8px;margin:3px;background:#e3e9dd;color:#163e50;border:1px solid #7cb1c5}p{margin:8px 0}</style></head><body><section><strong>CRESCENT SHINE · AUTOMATED WASH TUNNEL</strong><p>Production equipment in the 192 × 160 carwash footprint. Review only; no live vehicle, city shell or payment simulation.</p><button id="entrance">WASH BAY</button><button id="brushes">BRUSH DETAIL</button><button id="conveyor">CONVEYOR GUIDES</button><button id="spray">SPRAY ARCH</button><button id="cycle">START REVIEW CYCLE</button><p id="status"></p></section><script src="three.min.js"></script><script src="carwash-interior.js?v=reference-wash-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#c5d4d5');scene.add(new T.HemisphereLight('#fffaec','#557580',1.3));const light=new T.DirectionalLight('#f6ffff',.65);light.position.set(50,140,120);scene.add(light);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29CarwashInterior.build(T,{x:0,y:0,w:192,h:160});scene.add(d.root);let current='entrance',washing=false,last=performance.now();function show(view){current=view;const v={entrance:[[96,18,154],[96,26,43]],brushes:[[96,20,139],[143,22,101]],conveyor:[[96,12,151],[96,5,50]],spray:[[96,19,126],[96,25,61]]}[view];camera.position.set(...v[0]);camera.lookAt(...v[1]);}for(const id of ['entrance','brushes','conveyor','spray'])document.getElementById(id).onclick=()=>show(id);document.getElementById('cycle').onclick=()=>{washing=!washing;document.getElementById('cycle').textContent=washing?'STOP REVIEW CYCLE':'START REVIEW CYCLE';};show(current);function frame(t){requestAnimationFrame(frame);const dt=(t-last)/1000;last=t;level29CarwashInterior.animate(d,dt,washing&&!document.hidden);renderer.render(scene,camera);document.getElementById('status').textContent='4 vertical brushes · overhead roller · '+(washing?'Review water jets ON':'Review water jets OFF')+' · vehicle lane clear';}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
