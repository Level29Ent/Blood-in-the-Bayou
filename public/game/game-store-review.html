<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayou Game Exchange interior review</title><style>body{margin:0;background:#1e2531;color:#fff3d6;font:14px system-ui}canvas{display:block}section{position:fixed;top:12px;left:12px;max-width:380px;padding:12px;background:#141f2bea;border:1px solid #acbfce}button{min-height:44px;margin:3px;padding:8px;background:#284b6f;color:#fff3d6;border:1px solid #91b5ca}p{margin:8px 0}</style></head><body><section><strong>BAYOU GAME EXCHANGE · INTERIOR REVIEW</strong><p>Actual mall shop footprint and production furnishings. Review cameras only; cabinets are decorative, not playable minigames.</p><button id="entrance">STORE</button><button id="cases">GAME SHELVES</button><button id="console">CONSOLE BAYS</button><button id="arcade">ARCADE ROW</button><button id="pinball">PINBALL / RACER</button><p id="status"></p></section><script src="three.min.js"></script><script src="game-store-interior.js?v=reference-game-store-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#a5afb2');scene.add(new T.HemisphereLight('#fff3dc','#5d708a',1.15));const light=new T.DirectionalLight('#fff3d5',.65);light.position.set(60,120,130);scene.add(light);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const s={name:'GAME STORE',room:{x:0,y:0,w:102,h:70},dir:1,doorX:51,doorY:70,x:51,y:50},d=level29GameStoreInterior.build(T,s,0);scene.add(d.root);let current='entrance';function show(view){current=view;const views={entrance:[[51,17,68],[51,21,12]],cases:[[65,21,60],[99,21,22]],console:[[51,20,44],[51,23,3]],arcade:[[39,19,63],[12,24,24]],pinball:[[65,20,65],[89,17,29]]},v=views[view];camera.position.set(...v[0]);camera.lookAt(...v[1]);renderer.render(scene,camera);document.getElementById('status').textContent=d.root.userData.gameStore.cases+' game cases · 2 arcade cabinets · 1 pinball · 1 racer · clear checkout approach';}for(const id of ['entrance','cases','console','arcade','pinball'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
