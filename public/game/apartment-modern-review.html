<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modern apartment review</title><style>body{margin:0;background:#a9b7ba;color:#f1e7ce;font:14px system-ui}canvas{display:block}aside{position:fixed;left:12px;top:12px;background:#323d3de8;padding:12px;max-width:350px}button{padding:10px;min-height:44px;margin:3px;background:#c5b692;border:1px solid #e1d2b2;color:#253539}</style></head><body><aside><strong>MODERN APARTMENT INTERIORS</strong><p>Production furnishing builder in a review shell.<br>Compact floor heights and circulation retained.<br>Not full-city elevator, ownership or device testing.</p><button id="lounge">LOUNGE</button><button id="kitchen">KITCHEN</button><button id="study">SLATS / BEDROOM</button><button id="variant">LIGHT / CHARCOAL</button><p id="status"></p></aside><script src="three.min.js"></script><script src="apartment-modern.js?v=reference-apartments-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,1500),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#bfd0d3');scene.add(new T.HemisphereLight('#fff0d6','#69746b',1.2));const sun=new T.DirectionalLight('#ffe6c0',.7);sun.position.set(180,120,180);scene.add(sun);document.body.appendChild(renderer.domElement);const b={x:0,y:0,w:70,h:150};let model,variant=0,current='lounge';const shell=new T.Group();scene.add(shell);for(const [w,h,d,x,y,z]of [[70,1,150,35,-.6,75],[1,28,150,.1,14,75],[1,28,150,69.9,14,75],[70,28,1,35,14,.1],[70,1,150,35,28.5,75]]){const o=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:'#ccc5b3',side:T.DoubleSide}));o.position.set(x,y,z);shell.add(o);}const views={lounge:[[35,16,74],[10,7,32]],kitchen:[[34,16,74],[60,9,30]],study:[[35,17,99],[13,9,131]]};function view(id){current=id;camera.position.set(...views[id][0]);camera.lookAt(...views[id][1]);renderer.render(scene,camera);document.getElementById('status').textContent='Sofa · kitchen · marble-look table · curtains · ring pendant · '+(variant?'charcoal':'light neutral');}function build(){if(model)scene.remove(model.root);model=level29ModernApartment.build(T,b,{variant});scene.add(model.root);view(current);}for(const id of Object.keys(views))document.getElementById(id).onclick=()=>view(id);document.getElementById('variant').onclick=()=>{variant=1-variant;build();};build();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);view(current);});
</script></body></html>
