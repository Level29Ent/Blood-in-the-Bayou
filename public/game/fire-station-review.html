<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire station reference review</title><style>body{margin:0;font:14px system-ui;background:#b6c0b7;color:#fff3db}canvas{display:block}section{position:fixed;left:12px;top:12px;max-width:390px;padding:12px;background:#693639ed}button{min-height:44px;margin:3px;padding:9px}p{margin:8px 0}</style><section><strong>FIRE STATION · TURNOUT / APPARATUS</strong><p>Production furnishings only; no city shell, captain or live fire-job UI. Parked engine and bay doors are decorative.</p><button id="hall">APPARATUS HALL</button><button id="gear">GEAR LOCKERS</button><button id="engine">FIRE ENGINE</button><button id="benches">BENCHES / CEILING</button></section><script src="three.min.js"></script><script src="fire-station-interior.js"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,1000),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#bdc9c3');scene.add(new T.HemisphereLight('#fff5dd','#64766e',1.2));const sun=new T.DirectionalLight('#fff3dc',.65);sun.position.set(60,140,150);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(level29FireStation.build(T,{x:0,y:0,w:256,h:224}).root);let current='hall';function show(v){current=v;const c={hall:[[128,19,210],[142,24,63]],gear:[[65,20,174],[14,22,127]],engine:[[126,22,162],[171,22,105]],benches:[[95,19,189],[44,27,112]]}[v];camera.position.set(...c[0]);camera.lookAt(...c[1]);renderer.render(scene,camera);}for(const id of ['hall','gear','engine','benches'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});</script></html>
