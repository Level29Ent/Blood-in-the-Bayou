const T=THREE,r=new T.WebGLRenderer({antialias:false});r.setPixelRatio(1);r.setSize(innerWidth,innerHeight);r.autoClear=false;r.outputEncoding=T.sRGBEncoding;document.body.appendChild(r.domElement);const s=new T.Scene(),v=new T.Scene();s.background=new T.Color('#819ca8');const camera=new T.PerspectiveCamera(74,innerWidth/innerHeight,1,1500),vm=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,100);camera.position.set(0,16,0);camera.lookAt(0,16,-100);for(const scene of [s,v]){scene.add(new T.HemisphereLight('#e3eaf0','#50453d',1));const l=new T.DirectionalLight('#ffead4',1);l.position.set(4,8,10);scene.add(l);}const floor=new T.Mesh(new T.PlaneGeometry(1600,1600),new T.MeshStandardMaterial({color:'#464a45'}));floor.rotation.x=-Math.PI/2;s.add(floor);const wall=new T.Mesh(new T.BoxGeometry(200,50,5),new T.MeshStandardMaterial({color:'#a8a698'}));wall.position.set(0,25,-500);s.add(wall);const gun=level29ArsenalReview.buildM240();gun.position.set(4.2,-4.4,-12);gun.scale.setScalar(.55);v.add(gun);const tip=new T.Object3D();tip.position.set(...level29TracerReview.muzzlePoint('m240'));gun.add(tip);const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(new Float32Array(60),3));const lines=new T.LineSegments(geo,new T.LineBasicMaterial({color:'#ffe181'}));lines.frustumCulled=false;s.add(lines);let firing=false,last=0,shots=[];document.getElementById('fire').onclick=()=>firing=!firing;function draw(now){requestAnimationFrame(draw);if(firing&&now-last>120){last=now;shots.push({at:now,x:0,z:0,height:13,muzzle:level29TracerReview.projectMuzzle(T,tip,vm,camera)});}shots=shots.filter(o=>now-o.at<500).slice(-10);let i=0;for(const shot of shots){const d=22+(now-shot.at)*.9,b={x:0,y:-d,vx:0,vy:-16},line=level29TracerReview.segment(shot,b);geo.attributes.position.setXYZ(i++,line.head.x,line.head.y,line.head.z);geo.attributes.position.setXYZ(i++,line.tail.x,line.tail.y,line.tail.z);}geo.setDrawRange(0,i);geo.attributes.position.needsUpdate=true;gun.userData.flash.visible=firing&&now-last<45;r.clear();r.render(s,camera);r.clearDepth();r.render(v,vm);document.getElementById('status').textContent=(firing?'FIRING':'IDLE')+' · '+shots.length+' bounded visual segments';}requestAnimationFrame(draw);
