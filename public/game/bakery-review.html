const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,700),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#9c9290');scene.add(new T.HemisphereLight('#fff3db','#6f6870',1.1));const light=new T.DirectionalLight('#fff2d5',.65);light.position.set(30,90,90);scene.add(light);document.body.appendChild(renderer.domElement);const b={x:0,y:0,w:79.2,h:70},room=new T.Group();scene.add(room);const m=new T.MeshStandardMaterial({color:'#e2d8c4'});for(const [w,h,d,x,y,z]of [[79.2,49,1,39.6,25,.5],[1,49,70,.5,25,35],[1,49,70,78.7,25,35],[79.2,1,70,39.6,49,35]]){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);room.add(o);}let dir=1,current='entry',store;const views={entry:[[39.6,23,66],[39.6,23,15]],bins:[[40,24,60],[12,17,33]],wall:[[40,24,60],[69,19,33]]};function view(n){current=n;const [a,b]=views[n].map(p=>dir===1?p:[79.2-p[0],p[1],70-p[2]]);camera.position.set(...a);camera.lookAt(...b);renderer.render(scene,camera);document.getElementById('status').textContent=store.root.userData.bakery.breads+' loaves · '+store.root.userData.bakery.pastries+' pastries · '+store.root.userData.bakery.cakes+' cakes';}function sign(g,text,w,h,x,y,z,color){const c=document.createElement('canvas');c.width=1024;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#f1e5cb';ctx.fillRect(0,0,1024,128);ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 60px sans-serif';ctx.fillText(text,512,64,990);const tex=new T.CanvasTexture(c);tex.encoding=T.sRGBEncoding;const mesh=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tex}));mesh.position.set(x,y,z);g.add(mesh);return mesh;}function build(){if(store)scene.remove(store.root);store=level29Bakery.build(T,b,{dir,sign});scene.add(store.root);view(current);}for(const n of ['entry','bins','wall'])document.getElementById(n).onclick=()=>view(n);document.getElementById('flip').onclick=()=>{dir*=-1;room.rotation.y=dir===1?0:Math.PI;room.position.set(dir===1?0:79.2,0,dir===1?0:70);build();};build();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera);});
