<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayou State University review</title><style>body{margin:0;color:#fff5dd;background:#9ebfc6;font:14px system-ui}canvas{display:block}aside{position:fixed;top:12px;left:12px;background:#273d3eee;padding:12px;max-width:340px}button{min-height:44px;padding:10px;margin:3px;background:#d9bb7f;color:#24353b;border:1px solid #f2dfb7}p{margin:7px 0}</style></head><body><aside><strong>BAYOU STATE UNIVERSITY</strong><p>Shared campus and lecture-hall production models.<br>Decorative tiered banks—not new walkable floors.<br>Not full-world missions or mobile performance.</p><button id="quad">CAMPUS QUAD</button><button id="stone">GOTHIC HALL</button><button id="lecture">LECTURE HALL</button><button id="lobby">STUDY LOBBY</button><p id="status"></p></aside><script src="three.min.js"></script><script>window.level29NolaReview=true;</script><script src="nola-landmarks.js?v=reference-university-1"></script><script src="university-interior.js?v=reference-university-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,2500),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#b2cdd1');scene.add(new T.HemisphereLight('#fff0d0','#6b7763',1.2));const sun=new T.DirectionalLight('#ffeac6',.8);sun.position.set(-80,200,260);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.appendChild(renderer.domElement);const campus=level29NolaReview.createNewOrleansLandmarks(T,scene,{university:{x:0,y:0,w:448,h:384}}),b={x:650,y:0,w:288,h:192},hall=level29University.build(T,b);scene.add(hall.root);scene.add(hall.ceiling);const shell=new T.Group();scene.add(shell);for(const [w,h,d,x,y,z]of [[b.w,48,1,794,24,.5],[1,48,b.h,650,24,96],[1,48,b.h,938,24,96]]){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:'#cbc1a8'}));m.position.set(x,y,z);shell.add(m);}const views={quad:[[610,360,595],[224,27,183]],stone:[[277,58,215],[224,43,84]],lecture:[[794,27,181],[794,25,13]],lobby:[[794,24,136],[674,16,175]]};let active='quad';function show(id){active=id;campus.visible=id==='quad'||id==='stone';hall.root.visible=hall.ceiling.visible=shell.visible=!campus.visible;camera.position.set(...views[id][0]);camera.lookAt(...views[id][1]);renderer.render(scene,camera);document.getElementById('status').textContent=campus.visible?'4 original campus rooms · original quad routes':hall.root.userData.university.seats+' lecture seats · '+hall.root.userData.university.laptops+' laptops · clear central aisle';}for(const id of Object.keys(views))document.getElementById(id).onclick=()=>show(id);show(active);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(active);});
</script></body></html>
