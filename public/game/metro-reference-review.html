<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decatur grand metro review</title><style>body{margin:0;font:14px system-ui;color:#eee1bd;background:#343b3b}canvas{display:block}aside{position:fixed;top:12px;left:12px;max-width:360px;background:#243331ed;padding:12px}button{padding:10px;margin:3px;min-height:44px;background:#d9c498;color:#26332e;border:1px solid #a08751}</style></head><body><aside><strong>DECATUR CENTRAL · GRAND METRO</strong><p>Production hall/train models. Review cameras—not a full-city travel test.</p><button id="hall">GRAND CONCOURSE</button><button id="ceiling">ORNATE CEILING</button><button id="train">RED TRAIN</button><button id="inside">CARRIAGE INTERIOR</button></aside><script src="three.min.js"></script><script src="metro-reference.js?v=grand-metro-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(72,innerWidth/innerHeight,.1,1600),renderer=new T.WebGLRenderer({antialias:false});scene.background=new T.Color('#596d6d');scene.add(new T.HemisphereLight('#fff1d5','#667470',1.25));const light=new T.DirectionalLight('#fff6de',.6);light.position.set(50,120,100);scene.add(light);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const hall=level29MetroReference.buildHall(T,{x:0,y:0,w:400,h:250},{base:0,travel:true}).root,train=level29MetroReference.buildTrain(T,{x:200,y:0,z:62});scene.add(hall,train);let current='hall';function show(v){current=v;hall.visible=v==='hall'||v==='ceiling';train.visible=v==='train'||v==='inside';const views={hall:[[200,20,226],[200,35,20]],ceiling:[[200,22,226],[200,65,115]],train:[[395,59,170],[195,17,62]],inside:[[200,19,62],[230,19,91]]},p=views[v];camera.position.set(...p[0]);camera.lookAt(...p[1]);renderer.render(scene,camera);}for(const v of['hall','ceiling','train','inside'])document.getElementById(v).onclick=()=>show(v);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
