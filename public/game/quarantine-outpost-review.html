<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quarantine outpost review</title><style>body{margin:0;background:#707b7c;font:13px sans-serif;color:white}canvas{display:block}aside{position:fixed;z-index:2;top:10px;left:10px;padding:12px;background:#20343dea;max-width:340px}button{min-height:44px;padding:10px;margin:3px;background:#33536a;color:white;border:1px solid #ce9b64}</style></head><body><aside><b>FEDERAL QUARANTINE OUTPOST</b><p>Production interior at actual footprint. Isolated review—not full-city guards or survival contracts.</p><button id="entry">CAMP OVERVIEW</button><button id="racks">MEDICAL TENT</button><button id="packing">BUNK DORMITORY</button><button id="forklift">ISOLATION ROW</button><p id="status"></p></aside><script src="three.min.js"></script><script src="quarantine-outpost.js?v=outpost-reference-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,1200),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;scene.background=new T.Color('#aab5b4');scene.add(new T.HemisphereLight('#fff4de','#596c70',1.1));const light=new T.DirectionalLight('#fff6e8',.8);light.position.set(50,100,200);scene.add(light);document.body.appendChild(renderer.domElement);const b={x:0,y:0,w:224,h:192},store=level29QuarantineOutpost.build(T,b);scene.add(store.root);const views={entry:[[300,235,335],[112,5,90]],racks:[[40,15,76],[40,15,23]],packing:[[181,14,76],[181,14,22]],forklift:[[116,23,187],[186,12,139]]};function view(n){const[a,b]=views[n];camera.position.set(...a);camera.lookAt(...b);store.roof.visible=n==='entry'||n==='forklift';renderer.render(scene,camera);document.getElementById('status').textContent='Medical tent · 2 shelters · 2 isolation cabins · 12 bunk beds';}for(const n of Object.keys(views))document.getElementById(n).onclick=()=>view(n);view('entry');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);view('entry');});
</script></body></html>
