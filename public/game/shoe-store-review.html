<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crescent Sole shoe store review</title><style>body{margin:0;background:#c3c7bc;color:#fff2da;font:14px system-ui}canvas{display:block}section{position:fixed;top:12px;left:12px;max-width:370px;padding:12px;background:#243c46ed}button{min-height:44px;padding:8px;margin:3px;background:#e5dfcb;color:#243c46;border:1px solid #ab9476}p{margin:8px 0}</style></head><body><section><strong>CRESCENT SOLE · FOOTWEAR</strong><p>Production shoe-store furnishings in the mall bay. Review cameras only; no surrounding mall or shopping UI.</p><button id="store">STORE</button><button id="sneakers">SNEAKER WALL</button><button id="women">WOMEN'S FOOTWEAR</button><button id="benches">FITTING BENCHES</button><p id="status"></p></section><script src="three.min.js"></script><script src="shoe-store-interior.js?v=reference-shoe-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,500),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#c5c9bd');scene.add(new T.HemisphereLight('#fff6df','#667871',1.2));const sun=new T.DirectionalLight('#fff1d9',.65);sun.position.set(40,120,90);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29ShoeStore.build(T,{x:0,y:0,w:79.2,h:70});scene.add(d.root);let current='store';function show(view){current=view;const v={store:[[39.6,18,68],[39.6,20,12]],sneakers:[[30,22,62],[6,21,24]],women:[[51,21,62],[74,20,24]],benches:[[39.6,15,65],[21,8,46]]}[view];camera.position.set(...v[0]);camera.lookAt(...v[1]);renderer.render(scene,camera);const s=d.root.userData.shoes;document.getElementById('status').textContent=s.sneakers+' sneakers · '+s.heels+' heels · red fitting benches · clear browsing aisle';}for(const id of ['store','sneakers','women','benches'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
