<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crescent Newsstand review</title><style>body{margin:0;background:#b9bbae;color:#fff2da;font:14px system-ui}canvas{display:block}section{position:fixed;top:12px;left:12px;max-width:360px;padding:12px;background:#243c43ed}button{min-height:44px;padding:8px;margin:3px;background:#e5dfcc;color:#243c43;border:1px solid #a49779}p{margin:8px 0}</style></head><body><section><strong>CRESCENT NEWSSTAND · MAGAZINES</strong><p>Production magazine stock in the mall bay. Review cameras only; no mall shell or service simulation.</p><button id="store">STORE</button><button id="wall">MAGAZINE WALL</button><button id="rack">FREESTANDING RACK</button><button id="checkout">CHECKOUT</button><p id="status"></p></section><script src="three.min.js"></script><script src="magazine-store-interior.js?v=reference-magazine-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,500),renderer=new T.WebGLRenderer({antialias:true});scene.background=new T.Color('#c3c9bc');scene.add(new T.HemisphereLight('#fff5df','#6b7874',1.2));const sun=new T.DirectionalLight('#fff5e5',.65);sun.position.set(50,120,90);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const d=level29MagazineStore.build(T,{x:0,y:0,w:102,h:70});scene.add(d.root);let current='store';function show(view){current=view;const v={store:[[51,18,68],[51,21,10]],wall:[[83,22,61],[97,22,28]],rack:[[51,18,66],[19,18,43]],checkout:[[51,18,46],[82,15,19]]}[view];camera.position.set(...v[0]);camera.lookAt(...v[1]);renderer.render(scene,camera);document.getElementById('status').textContent=d.root.userData.magazines.count+' face-out magazines · 48 original covers · clear entrance aisle';}for(const id of ['store','wall','rack','checkout'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
