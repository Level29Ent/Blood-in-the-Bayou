<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crescent Freight Depot interior review</title><style>body{margin:0;background:#9aa89b;color:#f1eedb;font:14px sans-serif}canvas{display:block}aside{position:fixed;left:12px;top:12px;max-width:330px;padding:12px;background:#214237e8}p{margin:7px 0}button{min-height:44px;padding:9px;margin:3px;background:#3f6e54;color:#fff6dc;border:1px solid #b2bea1}</style></head><body><aside><strong>CRESCENT FREIGHT · PACKING / SHIPPING</strong><p>Production model at the actual 320 × 224 parcel size.<br>Isolated room, not a city or phone benchmark.</p><button id="entry">ENTRANCE</button><button id="boxes">BOX DISPLAY</button><button id="counter">SERVICE COUNTER</button><button id="racks">PACKING SUPPLIES</button><p id="status"></p></aside><script src="three.min.js"></script><script src="freight-depot-interior.js?v=reference-freight-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(76,innerWidth/innerHeight,.1,1500),renderer=new T.WebGLRenderer({antialias:false});renderer.outputEncoding=T.sRGBEncoding;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.background=new T.Color('#9aa89b');scene.add(new T.HemisphereLight('#fff7e2','#8b9b8e',1.1));const fill=new T.DirectionalLight('#fff7e8',.6);fill.position.set(100,180,180);scene.add(fill);
