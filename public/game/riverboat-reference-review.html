<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natchez riverboat reference review</title><style>body{margin:0;background:#271b2a;color:#ffe5b5;font:14px system-ui}canvas{display:block}section{position:fixed;left:12px;top:12px;max-width:410px;padding:12px;background:#251623ed;border:1px solid #b89454}button{min-height:44px;padding:8px;margin:3px;background:#662c41;color:#ffe6b6;border:1px solid #b89454}p{margin:8px 0}</style></head><body><section><strong>NATCHEZ · DINING / GRAND SALON / EXTERIOR</strong><p>Production riverboat deck and furnishings. Review cameras only; not a full-city gameplay or device performance test.</p><button id="outside">NATCHEZ EXTERIOR</button><button id="stern">STERNWHEEL</button><button id="dining">DINING SALON</button><button id="banquet">GRAND SALON</button><button id="casino">CASINO</button><p id="status"></p></section><script src="three.min.js"></script><script>window.level29HubReview=true;</script><script src="casino-interior.js?v=reference-casino-1"></script><script src="riverboat-reference.js?v=natchez-reference-1"></script><script src="riverboat-hub.js?v=natchez-reference-1"></script><script>
const T=THREE,scene=new T.Scene(),camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,2000),renderer=new T.WebGLRenderer({antialias:false});scene.background=new T.Color('#b4c8cd');scene.add(new T.HemisphereLight('#fff6e4','#68766f',1.3));const sun=new T.DirectionalLight('#fff5e4',.8);sun.position.set(80,160,90);scene.add(sun);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const b={x:0,y:0,w:320,h:192},hub=level29HubReview.buildHub(T,b),boat=level29HubReview.buildNatchezExterior(T,{x:-190,y:0},{label:sign});boat.rotation.y=0;hub.userData.exterior.visible=false;scene.add(hub,boat);let current='outside';
function sign(g,text,w,h,x,y,z,color){const c=document.createElement('canvas');c.width=1024;c.height=128;const a=c.getContext('2d');a.fillStyle='#eee8d6';a.fillRect(0,0,1024,128);a.fillStyle=color;a.font='bold 80px serif';a.textAlign='center';a.fillText(text,512,96);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:t,side:T.DoubleSide}));m.position.set(x,y,z);g.add(m);return m;}
function show(view){current=view;const outside=view==='outside'||view==='stern';boat.visible=outside;hub.visible=!outside;hub.userData.floors.forEach((g,i)=>g.visible=i===(view==='banquet'?2:view==='casino'?0:1));const views={outside:[[260,165,290],[0,50,0]],stern:[[-260,70,170],[-70,48,0]],dining:[[160,66,178],[64,68,79]],banquet:[[160,113,174],[160,116,25]],casino:[[160,16,180],[160,22,50]]},v=views[view];camera.position.set(...v[0]);camera.lookAt(...v[1]);renderer.render(scene,camera);document.getElementById('status').textContent='Natchez reference · '+view+' · review cameras, not full-city travel';}for(const id of['outside','stern','dining','banquet','casino'])document.getElementById(id).onclick=()=>show(id);show(current);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);show(current);});
</script></body></html>
