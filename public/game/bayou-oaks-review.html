const T=THREE,B=level29BayouSubdivision,R=level29CityRenewal,renderer=new T.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;document.body.appendChild(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#a3bcc7');scene.add(new T.HemisphereLight('#fff0dc','#4a5d47',1));const sun=new T.DirectionalLight('#fff4da',1);sun.position.set(250,500,300);scene.add(sun);const camera=new T.PerspectiveCamera(62,innerWidth/innerHeight,.1,4000),W=80,g=new Uint8Array(W*W);for(let y=1;y<79;y++)for(const x of [9,10,11])g[y*W+x]=1;const c={width:W,height:W,g,venues:[{careerBusiness:'pawn',doorX:400,doorY:960}],buildings:[],features:[],trees:[],parked:[],heightAt:()=>0,get:(x,y)=>x<0||y<0||x>=W||y>=W?4:g[Math.floor(y)*W+Math.floor(x)]},target=B.anchor(c),sub=B.plan(c,target),data=B.apply(c,sub,target),values=new Map(data.cells.map(k=>[k,0])),surface=R.continuousSurface(W,data.cells,values,()=>0),root=B.build(T,data,{width:W,height:surface.height});scene.add(root);const land=new T.Mesh(new T.PlaneGeometry(3000,3000),new T.MeshStandardMaterial({color:'#68845b',roughness:1}));land.rotation.x=-Math.PI/2;land.position.set(1000,-.1,1000);scene.add(land);const roads=new T.Mesh(R.roadGeometry(T,W,data.cells,()=>.045),new T.MeshStandardMaterial({color:'#3f494b',roughness:.95}));root.add(roads);const b=sub.b;
